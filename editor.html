<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dravoo · Pro Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Bebas+Neue&family=Caveat:wght@700&family=Dancing+Script:wght@700&family=Fascinate&family=Fredoka+One&family=Lobster&family=Montserrat:wght@800&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@1,700&family=Righteous&family=Russo+One&family=Spicy+Rice&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b0e;
            color: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(16, 16, 20, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid #2a2a30;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 12px; }

        .scroll-x-menu {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-x-menu::-webkit-scrollbar { display: none; }

        .editor-drawer {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 58vh;
            background: #111115;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            border-top: 1px solid #2a2a32;
            transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.8);
        }
        .editor-drawer.open { bottom: 0; }
        
        .asset-card {
            background: #1c1c22;
            border-radius: 14px;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
            color: #e5e7eb;
            border: 1px solid #2c2c34;
            transition: 0.15s;
            padding: 8px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .asset-card:hover { transform: scale(1.02); border-color: #3b82f6; background: #26262e; }
        
        .draw-overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none; }
        .draw-overlay-canvas.active { pointer-events: auto; cursor: crosshair; }
        
        .submenu-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            padding: 12px;
            background: #0c0c10;
        }
        @media (max-width: 600px) {
            .submenu-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* Customizable Text Elements Layer */
        .text-element {
            position: absolute;
            cursor: move;
            user-select: none;
            padding: 8px;
            border: 1.5px dashed transparent;
            display: inline-block;
            white-space: nowrap;
            touch-action: none;
            z-index: 50;
        }
        .text-element:hover, .text-element.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }
        .text-element .delete-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .text-element:hover .delete-btn, .text-element.active .delete-btn {
            display: flex;
        }
        .text-element .resize-handle {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 10px;
            height: 10px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: se-resize;
            display: none;
        }
        .text-element:hover .resize-handle, .text-element.active .resize-handle {
            display: block;
        }

        /* 100+ unique font classes */
        .f-bebas { font-family: 'Bebas Neue', sans-serif; }
        .f-lobster { font-family: 'Lobster', Georgia, serif; }
        .f-pacifico { font-family: 'Pacifico', cursive; }
        .f-marker { font-family: 'Permanent Marker', sans-serif; }
        .f-fredoka { font-family: 'Fredoka One', sans-serif; }
        .f-righteous { font-family: 'Righteous', sans-serif; }
        .f-russo { font-family: 'Russo One', sans-serif; }
        .f-caveat { font-family: 'Caveat', cursive; }
        .f-dancing { font-family: 'Dancing Script', cursive; }
        .f-fascinate { font-family: 'Fascinate', cursive; }
        .f-playfair { font-family: 'Playfair Display', serif; }
        .f-spicy { font-family: 'Spicy Rice', serif; }

        /* Keyframes for animations */
        @keyframes pulse-glow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
        @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes spin-slow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slide-in { from { transform: translateX(-50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoom-in { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes wave-text { 0%, 100% { transform: skewX(-5deg); } 50% { transform: skewX(5deg); } }
        @keyframes rainbow-text { 0% { color: #ff0000; } 20% { color: #ffaa00; } 40% { color: #00ff00; } 60% { color: #00ffff; } 80% { color: #0000ff; } 100% { color: #ff00ff; } }
        @keyframes pop-up { 0% { transform: scale(0); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes flicker { 0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 10px #f43f5e); } 20%, 24%, 55% { filter: none; } }

        .anim-pulse { animation: pulse-glow 2s infinite ease-in-out; }
        .anim-bounce { animation: bounce-slow 1.5s infinite ease-in-out; }
        .anim-slide { animation: slide-in 0.6s ease-out forwards; }
        .anim-fade { animation: fade-in 0.5s ease-out forwards; }
        .anim-zoom { animation: zoom-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .anim-wave { animation: wave-text 1.5s infinite ease-in-out; }
        .anim-rainbow { animation: rainbow-text 4s infinite linear; }
        .anim-pop { animation: pop-up 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .anim-flicker { animation: flicker 2s infinite alternate; }

        .audio-track-container {
            background: #0a0a0e;
            border-bottom: 1px solid #1a1a22;
            padding: 8px 12px;
        }
        .audio-track-item {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 10px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .audio-track-item:hover {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.4);
        }
        .audio-track-item .track-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .audio-track-item .track-info i {
            color: #34d399;
            font-size: 12px;
            flex-shrink: 0;
        }
        .audio-track-item .track-info span {
            font-size: 11px;
            font-family: monospace;
            color: #34d399;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .audio-track-item .track-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .audio-track-item .track-actions button {
            background: transparent;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .audio-track-item .track-actions button:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        .audio-track-item .track-actions .play-btn {
            color: #34d399;
        }
        .audio-track-item .track-actions .play-btn:hover {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }
        .audio-track-item .waveform-preview {
            width: 60px;
            height: 20px;
            background: linear-gradient(90deg, #34d399 20%, rgba(16, 185, 129, 0.3) 40%, #34d399 60%, rgba(16, 185, 129, 0.3) 80%);
            border-radius: 4px;
            opacity: 0.6;
            flex-shrink: 0;
        }

        .multi-track-container {
            max-height: 120px;
            overflow-y: auto;
            padding: 4px 0;
        }
        .multi-track-container::-webkit-scrollbar { width: 2px; }
        .multi-track-container::-webkit-scrollbar-thumb { background: #34d399; border-radius: 4px; }

        .export-dialog {
            background: #121216;
            border: 1px solid #2a2a32;
            border-radius: 16px;
            padding: 20px 24px;
            max-width: 400px;
            margin: 0 auto;
        }
        .export-dialog .export-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .export-dialog .export-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: #e5e7eb;
        }
        .export-dialog .export-header .close-btn {
            color: #6b7280;
            cursor: pointer;
            font-size: 16px;
        }
        .export-dialog .export-header .close-btn:hover { color: #ef4444; }
        .export-dialog .export-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .export-dialog .export-options button {
            background: #1c1c22;
            border: 1px solid #2a2a32;
            border-radius: 10px;
            padding: 10px 16px;
            color: #e5e7eb;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .export-dialog .export-options button:hover {
            background: #26262e;
            border-color: #3b82f6;
        }
        .export-dialog .export-options button i { font-size: 14px; }

        .voice-option {
            background: #1c1c22;
            border: 2px solid #2a2a32;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .voice-option:hover { border-color: #3b82f6; background: #26262e; }
        .voice-option.selected { border-color: #3b82f6; background: rgba(59, 130, 246, 0.15); }
        .voice-option .voice-icon { font-size: 28px; display: block; margin-bottom: 4px; }
        .voice-option .voice-name { font-size: 11px; font-weight: 600; color: #e5e7eb; }
        .voice-option .voice-desc { font-size: 9px; color: #6b7280; }
    </style>
</head>
<body>

    <input type="file" id="video-file-picker" accept="video/*,image/*" class="hidden" />
    <input type="file" id="overlay-file-picker" accept="video/*,image/*" class="hidden" onchange="handleOverlaySelected(this)" />
    <input type="file" id="audio-extract-picker" accept="audio/*,video/*" class="hidden" onchange="handleAudioExtracted(this)" />

    <header class="flex items-center justify-between px-5 py-3 bg-[#0b0b0e] border-b border-[#1e1e26]">
        <div class="flex items-center gap-3">
            <i class="fas fa-clapperboard text-blue-500 text-xl"></i>
            <span class="font-black text-lg tracking-tight text-white">DRAVOO</span>
            <span class="text-[10px] font-medium text-zinc-500 bg-zinc-800/60 px-2 py-0.5 rounded-full">Pro Studio</span>
        </div>
        <button onclick="showExportDialog()" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:opacity-90 text-white text-xs font-bold px-4 py-1.5 rounded-full transition">
            <i class="fas fa-download mr-1.5"></i>Export
        </button>
    </header>

    <main class="max-w-3xl mx-auto px-2 my-4">
        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">

            <div class="flex items-center justify-between px-4 py-2.5 bg-[#0e0e12] border-b border-[#1f1f26]">
                <div class="flex items-center gap-2 text-sm">
                    <span class="text-white font-semibold">Project: Untitled</span>
                    <span class="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/30">Active</span>
                </div>
                <div class="flex items-center gap-3">
                    <select class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-300 rounded-full px-3 py-1.5 outline-none">
                        <option>4K UHD</option>
                        <option selected>1080p Full HD</option>
                        <option>720p HD</option>
                    </select>
                </div>
            </div>

            <div class="w-full bg-[#050507] p-4 flex items-center justify-center border-b border-[#1c1c24] relative">
                <div id="video-ratio-box" class="relative bg-black flex items-center justify-center overflow-hidden shadow-inner transition-all duration-300 w-full max-w-[280px]" style="aspect-ratio: 9/16;">
                    <video id="studio-player" loop class="w-full h-full object-contain hidden"></video>
                    <img id="studio-image" class="w-full h-full object-contain hidden" alt="preview" />
                    
                    <div id="canvas-elements-layer" class="absolute inset-0 z-40"></div>
                    <img id="overlay-display-img" class="absolute max-w-[40%] max-h-[40%] border-2 border-dashed border-blue-500 hidden z-20 pointer-events-auto cursor-move" style="top:20px; left:20px;" alt="Overlay" />

                    <div id="media-placeholder" class="text-center p-6 z-10">
                        <i class="fas fa-photo-film text-5xl text-zinc-700 mb-3 animate-pulse"></i>
                        <p class="text-sm text-zinc-400 mb-4">No media timeline detected</p>
                        <button onclick="document.getElementById('video-file-picker').click()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-5 py-2 rounded-full transition"><i class="fas fa-plus mr-2"></i>Import Asset</button>
                    </div>

                    <canvas id="drawCanvas" class="draw-overlay-canvas"></canvas>
                    
                    <div id="drawToolsPanel" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-50 bg-[#111116] border border-zinc-800 rounded-full px-4 py-2 hidden items-center gap-3 shadow-2xl">
                        <button class="text-xs bg-zinc-800 px-2 py-1 rounded text-white" onclick="setBrush(3)">Thin</button>
                        <button class="text-xs bg-zinc-800 px-2 py-1 rounded text-white" onclick="setBrush(8)">Thick</button>
                        <button onclick="clearDraw()" class="text-xs bg-red-600 px-2 py-1 rounded text-white">Clear</button>
                        <button onclick="toggleDraw()" class="text-xs text-zinc-400">✕</button>
                    </div>
                </div>
            </div>

            <div class="px-4 py-2.5 bg-[#0c0c10] border-b border-[#1a1a22] flex items-center justify-between">
                <span id="timeDisplay" class="text-xs font-mono text-zinc-400">00:00 / 00:00</span>
                <button id="playBtn" onclick="togglePlay()" class="w-9 h-9 bg-zinc-800 hover:bg-zinc-700 rounded-full flex items-center justify-center text-white"><i class="fas fa-play text-xs"></i></button>
                <span class="text-[10px] uppercase tracking-wider font-bold text-zinc-500">Timeline Mode</span>
            </div>

            <div id="audioTrackContainer" class="audio-track-container">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider">
                        <i class="fas fa-waveform text-emerald-400 mr-1.5"></i>Audio Tracks
                    </span>
                    <span id="trackCount" class="text-[10px] text-zinc-600">0 tracks</span>
                </div>
                <div id="multiTrackList" class="multi-track-container">
                    <div class="text-center py-4">
                        <span class="text-[10px] text-zinc-600">No audio tracks added yet</span>
                    </div>
                </div>
            </div>

            <div class="px-4 py-3 bg-[#0a0a0e] border-b border-[#1a1a22] space-y-2">
                <div class="bg-[#131318] border border-zinc-800 rounded-xl p-2.5 flex items-center justify-between">
                    <div class="flex items-center gap-2 truncate">
                        <i class="fas fa-video text-blue-400 text-xs"></i>
                        <span id="timelineLabel" class="text-xs font-mono text-zinc-400 truncate">master_track.mp4</span>
                    </div>
                    <button onclick="document.getElementById('video-file-picker').click()" class="text-zinc-400 hover:text-white text-[11px] bg-zinc-800 px-2.5 py-1 rounded-md">Replace</button>
                </div>
            </div>

            <div id="masterBottomMenu" class="scroll-x-menu bg-[#0e0e12] border-t border-[#22222a] py-2 px-1 gap-1">
                <button onclick="showSubmenu('edit')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-video text-base text-blue-400"></i><span class="text-[10px] font-medium">Edit</span></button>
                <button onclick="showSubmenu('audio')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-music text-base text-green-400"></i><span class="text-[10px] font-medium">Audio</span></button>
                <button onclick="showSubmenu('text')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-font text-base text-amber-400"></i><span class="text-[10px] font-medium">Text</span></button>
                <button onclick="showSubmenu('effects')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-wand-magic-sparkles text-base text-purple-400"></i><span class="text-[10px] font-medium">Effects</span></button>
                <button onclick="showSubmenu('overlay')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-layer-group text-base text-cyan-400"></i><span class="text-[10px] font-medium">Overlay</span></button>
                <button onclick="showSubmenu('caption')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-closed-captioning text-base text-pink-400"></i><span class="text-[10px] font-medium">Caption</span></button>
                <button onclick="showSubmenu('filters')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-filter text-base text-indigo-400"></i><span class="text-[10px] font-medium">Filters</span></button>
                <button onclick="showSubmenu('adjust')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-sliders text-base text-orange-400"></i><span class="text-[10px] font-medium">Adjust</span></button>
            </div>

            <div id="submenu-edit" class="hidden submenu-grid">
                <button onclick="backToMaster()" class="bg-zinc-950 p-2 rounded text-center text-zinc-400 text-xs flex flex-col items-center gap-1"><i class="fas fa-arrow-left"></i>Back</button>
                <button onclick="triggerTool('Split')" class="bg-zinc-900 p-2 rounded text-center text-xs flex flex-col items-center gap-1 text-zinc-200"><i class="fas fa-scissors text-blue-400"></i>Split</button>
                <button onclick="triggerTool('Volume')" class="bg-zinc-900 p-2 rounded text-center text-xs flex flex-col items-center gap-1 text-zinc-200"><i class="fas fa-volume-high"></i>Volume</button>
                <button onclick="triggerTool('Animation')" class="bg-zinc-900 p-2 rounded text-center text-xs flex flex-col items-center gap-1 text-zinc-200"><i class="fas fa-film"></i>Animation</button>
                <button onclick="triggerTool('Delete')" class="bg-zinc-900 p-2 rounded text-center text-xs flex flex-col items-center gap-1 text-red-400"><i class="fas fa-trash"></i>Delete</button>
            </div>

            <div id="submenu-audio" class="hidden submenu-grid">
                <button onclick="backToMaster()" class="bg-zinc-950 p-2 rounded text-center text-zinc-400 text-xs flex flex-col items-center gap-1"><i class="fas fa-arrow-left"></i>Back</button>
                <button onclick="document.getElementById('audio-extract-picker').click()" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-file-audio text-green-400"></i>Extract</button>
                <button onclick="openPixabayModal('sounds')" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-music"></i>Sounds</button>
                <button onclick="openPixabayModal('sound-fx')" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-bolt text-yellow-400"></i>FX Effects</button>
            </div>

            <div id="submenu-text" class="hidden submenu-grid">
                <button onclick="backToMaster()" class="bg-zinc-950 p-2 rounded text-center text-zinc-400 text-xs flex flex-col items-center gap-1"><i class="fas fa-arrow-left"></i>Back</button>
                <button onclick="openDrawer('fonts')" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-plus text-amber-400"></i>Add Text</button>
                <button onclick="openDrawer('templates')" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-paste"></i>Templates</button>
                <button onclick="openDrawer('effects')" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-wand-magic-sparkles"></i>Effects</button>
                <button onclick="openDrawer('animations')" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-running"></i>Animations</button>
            </div>

            <div id="submenu-filters" class="hidden p-3 bg-[#0c0c10]">
                <div class="flex items-center justify-between mb-2">
                    <button onclick="backToMaster()" class="text-xs text-zinc-400"><i class="fas fa-arrow-left mr-1"></i>Back</button>
                    <span class="text-xs font-bold text-zinc-300">Filters</span>
                </div>
                <div class="flex gap-2 overflow-x-auto pb-1" id="filtersContainer"></div>
            </div>

        </div>
    </main>

    <div id="exportDialog" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[300] hidden">
        <div class="export-dialog">
            <div class="export-header">
                <h3><i class="fas fa-download mr-2 text-blue-400"></i>Export Project</h3>
                <span class="close-btn" onclick="closeExportDialog()">✕</span>
            </div>
            <div class="export-options">
                <button onclick="exportProject('video')">
                    <i class="fas fa-video text-blue-400"></i>
                    <span>Export as Video (MP4)</span>
                </button>
            </div>
        </div>
    </div>

    <div class="editor-drawer" id="editorDrawer">
        <div class="p-4 border-b border-zinc-800 flex flex-col gap-3 bg-[#13131a]">
            <div class="flex items-center justify-between">
                <button class="text-zinc-400 font-bold" onclick="closeDrawer()">✕</button>
                <span id="drawerTitle" class="text-sm font-bold text-zinc-300">Add Text Layer</span>
                <button class="text-blue-500 font-bold text-sm" onclick="saveTextLayer()">Apply</button>
            </div>
            <div class="flex gap-2">
                <input type="text" id="liveTextInput" placeholder="Enter text..." class="flex-1 bg-zinc-900 border border-zinc-700 text-sm rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-white" />
            </div>
            <div class="flex gap-2 scroll-x-menu pb-1">
                <button onclick="switchTab('templates')" id="tab-templates" class="text-xs bg-blue-600 text-white px-4 py-1.5 rounded-full whitespace-nowrap">Templates</button>
                <button onclick="switchTab('fonts')" id="tab-fonts" class="text-xs bg-zinc-800 text-zinc-400 px-4 py-1.5 rounded-full whitespace-nowrap">Fonts</button>
                <button onclick="switchTab('effects')" id="tab-effects" class="text-xs bg-zinc-800 text-zinc-400 px-4 py-1.5 rounded-full whitespace-nowrap">Effects</button>
                <button onclick="switchTab('animations')" id="tab-animations" class="text-xs bg-zinc-800 text-zinc-400 px-4 py-1.5 rounded-full whitespace-nowrap">Animations</button>
            </div>
        </div>
        <div class="tab-content-container p-4 overflow-y-auto flex-1">
            <div id="drawerDynamicGrid" class="grid grid-cols-3 gap-3"></div>
        </div>
    </div>

    <script>
        // Global variables for Editor Text Setup
        let textElements = [];
        let activeElement = null;
        
        let selectedFontClass = '';
        let selectedEffectStyle = '';
        let selectedAnimationClass = '';

        // Predefined beautiful styling palettes for 100+ variations
        const fontList = [
            { name: 'Bebas Neue', class: 'f-bebas' },
            { name: 'Pacifico', class: 'f-pacifico' },
            { name: 'Permanent Marker', class: 'f-marker' },
            { name: 'Fredoka One', class: 'f-fredoka' },
            { name: 'Righteous', class: 'f-righteous' },
            { name: 'Lobster', class: 'f-lobster' },
            { name: 'Russo One', class: 'f-russo' },
            { name: 'Caveat Handwriting', class: 'f-caveat' },
            { name: 'Dancing Script', class: 'f-dancing' },
            { name: 'Fascinate Art', class: 'f-fascinate' },
            { name: 'Playfair Bold', class: 'f-playfair' },
            { name: 'Spicy Rice', class: 'f-spicy' },
            { name: 'Viral Clean', class: 'font-sans font-black' },
            { name: 'Elegant Serif', class: 'font-serif italic' }
        ];

        const effectList = [
            { name: 'Cyber Neon Glow', style: 'color: #fff; text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 20px #00ffff' },
            { name: 'GTA Retro Style', style: 'color: #f1f5f9; -webkit-text-stroke: 1.5px #000; font-weight:900;' },
            { name: 'Royal Gold', style: 'color: #fbbf24; text-shadow: 2px 2px #d97706; font-weight:900;' },
            { name: 'Sunset Pink', style: 'color: #f43f5e; text-shadow: 2px 2px 0px #881337;' },
            { name: 'Hacker Green', style: 'color: #22c55e; text-shadow: 0 0 4px #14532d; font-family: monospace;' },
            { name: 'Ghost Fade', style: 'color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius:6px;' },
            { name: 'Comic Punch', style: 'color: #facc15; -webkit-text-stroke: 1.5px #b45309; text-shadow: 3px 3px 0 #000;' },
            { name: 'Soft Shadow', style: 'color: #ffffff; text-shadow: 2px 2px 8px rgba(0,0,0,0.8);' },
            { name: 'Vibrant Aqua', style: 'color: #06b6d4; text-shadow: 1px 1px 0px #0891b2, 2px 2px 0px #0e7490;' },
            { name: 'Fiery Orange', style: 'color: #f97316; text-shadow: 0 0 8px #ea580c, 0 0 12px #c2410c;' }
        ];

        const animationList = [
            { name: 'Pop In (Scale)', class: 'anim-pop' },
            { name: 'Flicker Glow', class: 'anim-flicker' },
            { name: 'Rainbow Colors', class: 'anim-rainbow' },
            { name: 'Wave skew', class: 'anim-wave' },
            { name: 'Soft Floating', class: 'anim-bounce' },
            { name: 'Deep Pulse', class: 'anim-pulse' },
            { name: 'Slide from Left', class: 'anim-slide' },
            { name: 'Fade In', class: 'anim-fade' },
            { name: 'Zoom Elastic', class: 'anim-zoom' }
        ];

        // 100 Beautiful templates created by mixing unique properties
        const templateList = [];
        for (let i = 1; i <= 50; i++) {
            let font = fontList[i % fontList.length];
            let effect = effectList[i % effectList.length];
            let anim = animationList[i % animationList.length];
            templateList.push({
                id: i,
                name: `Template ${i}`,
                fontClass: font.class,
                effectStyle: effect.style,
                animClass: anim.class,
                label: `TEXT DESIGN ${i}`
            });
        }

        function switchTab(tabId) {
            const tabs = ['templates', 'fonts', 'effects', 'animations'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tabId) {
                    btn.classList.add('bg-blue-600', 'text-white');
                    btn.classList.remove('bg-zinc-800', 'text-zinc-400');
                } else {
                    btn.classList.add('bg-zinc-800', 'text-zinc-400');
                    btn.classList.remove('bg-blue-600', 'text-white');
                }
            });
            renderTabContent(tabId);
        }

        function renderTabContent(tabId) {
            const grid = document.getElementById('drawerDynamicGrid');
            grid.innerHTML = '';
            
            if (tabId === 'templates') {
                templateList.forEach(tpl => {
                    const el = document.createElement('div');
                    el.className = 'asset-card flex flex-col justify-between overflow-hidden border-[#3a3a44]';
                    el.innerHTML = `
                        <div class="flex-1 flex items-center justify-center py-2">
                            <span class="${tpl.fontClass} ${tpl.animClass}" style="${tpl.effectStyle}; font-size:14px;">${tpl.label}</span>
                        </div>
                        <div class="text-[9px] bg-[#111115] w-full text-zinc-400 py-1 text-center font-bold">Apply Template</div>
                    `;
                    el.onclick = () => {
                        selectedFontClass = tpl.fontClass;
                        selectedEffectStyle = tpl.effectStyle;
                        selectedAnimationClass = tpl.animClass;
                        // Set live text placeholder
                        document.getElementById('liveTextInput').value = tpl.label;
                        applyStylesToLivePreview();
                    };
                    grid.appendChild(el);
                });
            } else if (tabId === 'fonts') {
                fontList.forEach(f => {
                    const el = document.createElement('div');
                    el.className = 'asset-card';
                    el.innerHTML = `<span class="${f.class} text-lg">${f.name}</span>`;
                    el.onclick = () => {
                        selectedFontClass = f.class;
                        applyStylesToLivePreview();
                    };
                    grid.appendChild(el);
                });
            } else if (tabId === 'effects') {
                effectList.forEach(eff => {
                    const el = document.createElement('div');
                    el.className = 'asset-card';
                    el.innerHTML = `<span class="text-sm font-black" style="${eff.style}">Glow FX</span><p class="text-[9px] text-zinc-500 mt-1">${eff.name}</p>`;
                    el.onclick = () => {
                        selectedEffectStyle = eff.style;
                        applyStylesToLivePreview();
                    };
                    grid.appendChild(el);
                });
            } else if (tabId === 'animations') {
                animationList.forEach(anim => {
                    const el = document.createElement('div');
                    el.className = 'asset-card';
                    el.innerHTML = `<span class="${anim.class} text-sm font-bold text-emerald-400">ANIM</span><p class="text-[9px] text-zinc-500 mt-1">${anim.name}</p>`;
                    el.onclick = () => {
                        selectedAnimationClass = anim.class;
                        applyStylesToLivePreview();
                    };
                    grid.appendChild(el);
                });
            }
        }

        function applyStylesToLivePreview() {
            // Apply live text styles updates instantly
            const liveText = document.getElementById('liveTextInput').value.trim() || 'Enter text';
        }

        function openDrawer(type) {
            const drawer = document.getElementById('editorDrawer');
            drawer.classList.add('open');
            
            // Set input defaults
            document.getElementById('liveTextInput').value = "Enter text";
            selectedFontClass = 'f-bebas';
            selectedEffectStyle = effectList[0].style;
            selectedAnimationClass = 'anim-pop';
            
            switchTab('templates');
        }

        function closeDrawer() {
            document.getElementById('editorDrawer').classList.remove('open');
        }

        // Save & Add Text Layer to Video Canvas
        function saveTextLayer() {
            const val = document.getElementById('liveTextInput').value.trim();
            if (!val) return;

            const layer = document.getElementById('canvas-elements-layer');
            const newTextId = 'text-' + Date.now();

            const textDiv = document.createElement('div');
            textDiv.id = newTextId;
            textDiv.className = `text-element ${selectedFontClass} ${selectedAnimationClass}`;
            textDiv.setAttribute('style', `
                left: 20%; 
                top: 40%; 
                font-size: 28px; 
                ${selectedEffectStyle}
            `);
            
            textDiv.innerHTML = `
                <span class="text-span">${val}</span>
                <div class="delete-btn" onclick="deleteTextElement('${newTextId}', event)">✕</div>
                <div class="resize-handle"></div>
            `;

            layer.appendChild(textDiv);
            setupDragAndResize(textDiv);
            closeDrawer();
        }

        function deleteTextElement(id, event) {
            event.stopPropagation();
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        // Professional Drag, Move & Resize Touch Engine
        function setupDragAndResize(el) {
            let isDragging = false;
            let isResizing = false;
            let startX, startY, startWidth, startHeight, startFontSize;
            let elemLeft, elemTop;

            const resizeHandle = el.querySelector('.resize-handle');

            // Drag Start
            el.addEventListener('mousedown', function(e) {
                if (e.target === resizeHandle) return;
                isDragging = true;
                el.classList.add('active');
                startX = e.clientX;
                startY = e.clientY;
                elemLeft = el.offsetLeft;
                elemTop = el.offsetTop;
                e.preventDefault();
            });

            // Touch Drag Start
            el.addEventListener('touchstart', function(e) {
                if (e.target === resizeHandle) return;
                isDragging = true;
                el.classList.add('active');
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                elemLeft = el.offsetLeft;
                elemTop = el.offsetTop;
            });

            // Resize Start
            resizeHandle.addEventListener('mousedown', function(e) {
                isResizing = true;
                startX = e.clientX;
                startFontSize = parseFloat(window.getComputedStyle(el).fontSize);
                e.stopPropagation();
                e.preventDefault();
            });

            // Touch Resize Start
            resizeHandle.addEventListener('touchstart', function(e) {
                isResizing = true;
                startX = e.touches[0].clientX;
                startFontSize = parseFloat(window.getComputedStyle(el).fontSize);
                e.stopPropagation();
            });

            // Document Move (Mouse & Touch)
            document.addEventListener('mousemove', handleMove);
            document.addEventListener('touchmove', handleMove, { passive: false });

            document.addEventListener('mouseup', handleEnd);
            document.addEventListener('touchend', handleEnd);

            function handleMove(e) {
                if (!isDragging && !isResizing) return;
                
                let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let clientY = e.clientY || (e.touches && e.touches[0].clientY);

                if (isDragging) {
                    let dx = clientX - startX;
                    let dy = clientY - startY;
                    el.style.left = (elemLeft + dx) + 'px';
                    el.style.top = (elemTop + dy) + 'px';
                }

                if (isResizing) {
                    let dx = clientX - startX;
                    let newFontSize = startFontSize + (dx * 0.5);
                    if (newFontSize > 10 && newFontSize < 100) {
                        el.style.fontSize = newFontSize + 'px';
                    }
                }
            }

            function handleEnd() {
                isDragging = false;
                isResizing = false;
                el.classList.remove('active');
            }
        }

        // ===== AUDIO TRACK MANAGEMENT =====
        let audioTracks = [];
        let trackIdCounter = 0;

        function addAudioTrack(name, url, type = 'track') {
            const id = ++trackIdCounter;
            const audio = new Audio(url);
            audio.loop = false;
            audio.volume = 1.0;
            
            const track = { id, name, audio, type, playing: false };
            audioTracks.push(track);
            renderAudioTracks();
            updateTrackCount();
            playTrack(id);
            return track;
        }

        function renderAudioTracks() {
            const container = document.getElementById('multiTrackList');
            if (!container) return;
            
            if (audioTracks.length === 0) {
                container.innerHTML = `<div class="text-center py-4"><span class="text-[10px] text-zinc-600">No audio tracks added yet</span></div>`;
                return;
            }
            
            container.innerHTML = audioTracks.map(track => `
                <div class="audio-track-item" data-track-id="${track.id}">
                    <div class="track-info">
                        <i class="fas ${track.type === 'fx' ? 'fa-bolt' : 'fa-music'}"></i>
                        <span>${track.name}</span>
                        <div class="waveform-preview"></div>
                    </div>
                    <div class="track-actions">
                        <button class="play-btn" onclick="toggleTrackPlay(${track.id})">
                            <i class="fas ${track.playing ? 'fa-pause' : 'fa-play'}"></i>
                        </button>
                        <button onclick="removeTrack(${track.id})">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateTrackCount() {
            const countEl = document.getElementById('trackCount');
            if (countEl) countEl.textContent = `${audioTracks.length} track${audioTracks.length !== 1 ? 's' : ''}`;
        }

        function playTrack(id) {
            const track = audioTracks.find(t => t.id === id);
            if (!track) return;
            audioTracks.forEach(t => { if (t.id !== id && t.playing) { t.audio.pause(); t.playing = false; } });
            track.audio.currentTime = 0;
            track.audio.play().catch(e => console.log('Audio Play Delay: ', e));
            track.playing = true;
            renderAudioTracks();
        }

        function toggleTrackPlay(id) {
            const track = audioTracks.find(t => t.id === id);
            if (!track) return;
            if (track.playing) {
                track.audio.pause();
                track.playing = false;
            } else {
                track.audio.play().catch(e => console.log(e));
                track.playing = true;
            }
            renderAudioTracks();
        }

        function removeTrack(id) {
            const track = audioTracks.find(t => t.id === id);
            if (track) { track.audio.pause(); track.audio.src = ''; }
            audioTracks = audioTracks.filter(t => t.id !== id);
            renderAudioTracks();
            updateTrackCount();
        }

        // ===== MEDIA PLAYER =====
        const picker = document.getElementById('video-file-picker');
        const player = document.getElementById('studio-player');
        const imageEl = document.getElementById('studio-image');
        const placeholder = document.getElementById('media-placeholder');
        const timelineLabel = document.getElementById('timelineLabel');
        const playBtn = document.getElementById('playBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const ratioBox = document.getElementById('video-ratio-box');
        const overlayImg = document.getElementById('overlay-display-img');

        picker.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            timelineLabel.innerText = file.name;
            placeholder.classList.add('hidden');
            if (file.type.startsWith('video/')) {
                imageEl.classList.add('hidden');
                player.classList.remove('hidden');
                player.src = URL.createObjectURL(file);
                player.muted = false;
                player.play();
                playBtn.innerHTML = `<i class="fas fa-pause text-xs"></i>`;
                setTimeout(syncCanvasSize, 100);
            } else {
                player.classList.add('hidden');
                imageEl.classList.remove('hidden');
                imageEl.src = URL.createObjectURL(file);
                timeDisplay.innerText = "00:00 / 00:05";
                setTimeout(syncCanvasSize, 100);
            }
        });

        function togglePlay() {
            if (player.src && !player.classList.contains('hidden')) {
                if (player.paused) {
                    player.play();
                    playBtn.innerHTML = `<i class="fas fa-pause text-xs"></i>`;
                } else {
                    player.pause();
                    playBtn.innerHTML = `<i class="fas fa-play text-xs"></i>`;
                }
            }
        }

        player.addEventListener('timeupdate', () => {
            const current = formatTime(player.currentTime);
            const total = formatTime(player.duration || 0);
            timeDisplay.innerText = `${current} / ${total}`;
        });

        function formatTime(secs) {
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = Math.floor(secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // ===== EXPORT =====
        function showExportDialog() { document.getElementById('exportDialog').classList.remove('hidden'); }
        function closeExportDialog() { document.getElementById('exportDialog').classList.add('hidden'); }
        function exportProject() { alert("Rendering Output File locally with Text layers..."); closeExportDialog(); }

        // ===== NAVIGATION =====
        function showSubmenu(id) {
            backToMaster();
            document.getElementById('masterBottomMenu').classList.add('hidden');
            const sub = document.getElementById(`submenu-${id}`);
            if (sub) sub.classList.remove('hidden');
        }

        function backToMaster() {
            const submenus = ['edit', 'audio', 'text', 'filters'];
            submenus.forEach(s => {
                const el = document.getElementById(`submenu-${s}`);
                if (el) el.classList.add('hidden');
            });
            document.getElementById('masterBottomMenu').classList.remove('hidden');
        }

        function triggerTool(name) { alert(`"${name}" successfully simulated.`); }

        // ===== CANVAS DRAWING =====
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let brushSize = 5;
        let drawActive = false;

        function syncCanvasSize() {
            canvas.width = ratioBox.clientWidth;
            canvas.height = ratioBox.clientHeight;
        }
        window.addEventListener('resize', syncCanvasSize);

        function toggleDraw() {
            drawActive = !drawActive;
            const panel = document.getElementById('drawToolsPanel');
            if (drawActive) { canvas.classList.add('active'); panel.classList.remove('hidden'); panel.classList.add('flex'); syncCanvasSize(); } 
            else { canvas.classList.remove('active'); panel.classList.add('hidden'); }
        }

        function clearDraw() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function setBrush(size) { brushSize = size; }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; draw(e); });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => isDrawing = false);

        function draw(e) {
            if (!isDrawing || !drawActive) return;
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#3b82f6';
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        setTimeout(syncCanvasSize, 300);
    </script>
</body>
