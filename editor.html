<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dravoo · Pro Editor - Track System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0b0e; color: #f1f5f9; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }
    .glass-card { background: rgba(16, 16, 20, 0.9); backdrop-filter: blur(12px); border: 1px solid #2a2a30; }
    
    /* TRACK SYSTEM */
    .track-container { 
      background: #0a0a0e; 
      border-bottom: 1px solid #1a1a22; 
      padding: 8px 12px;
    }
    .track-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      border-bottom: 1px solid #14141a;
      min-height: 48px;
    }
    .track-row:last-child { border-bottom: none; }
    .track-label {
      font-size: 10px;
      font-weight: 700;
      color: #6b7280;
      min-width: 70px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .track-timeline {
      flex: 1;
      position: relative;
      height: 36px;
      background: #0f0f14;
      border-radius: 6px;
      border: 1px solid #1e1e26;
      overflow: visible;
      cursor: pointer;
    }
    .track-clip {
      position: absolute;
      height: 28px;
      top: 4px;
      border-radius: 4px;
      cursor: grab;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 9px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: box-shadow 0.2s;
      min-width: 30px;
      user-select: none;
    }
    .track-clip:hover { box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4); z-index: 10; }
    .track-clip.dragging { cursor: grabbing; box-shadow: 0 4px 20px rgba(0,0,0,0.6); z-index: 20; opacity: 0.85; }
    .track-clip .clip-label { font-size: 8px; opacity: 0.8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track-clip .clip-duration { font-size: 7px; opacity: 0.6; margin-left: 4px; }
    .track-clip .resize-handle {
      position: absolute;
      right: -4px;
      top: 0;
      width: 8px;
      height: 100%;
      cursor: ew-resize;
      background: rgba(255,255,255,0.1);
      border-radius: 0 4px 4px 0;
    }
    .track-clip .resize-handle-left {
      position: absolute;
      left: -4px;
      top: 0;
      width: 8px;
      height: 100%;
      cursor: ew-resize;
      background: rgba(255,255,255,0.1);
      border-radius: 4px 0 0 4px;
    }
    .track-clip .delete-clip {
      position: absolute;
      right: -14px;
      top: -8px;
      width: 16px;
      height: 16px;
      background: #ef4444;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 8px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
    .track-clip:hover .delete-clip { display: flex; }
    .track-clip .delete-clip:hover { background: #dc2626; transform: scale(1.1); }

    /* Playhead */
    .playhead {
      position: absolute;
      top: -4px;
      bottom: -4px;
      width: 2px;
      background: #3b82f6;
      z-index: 50;
      pointer-events: none;
      transition: left 0.05s linear;
    }
    .playhead::after {
      content: '';
      position: absolute;
      top: -6px;
      left: -4px;
      width: 10px;
      height: 10px;
      background: #3b82f6;
      border-radius: 50%;
    }

    /* Timeline ruler */
    .timeline-ruler {
      height: 16px;
      background: #08080c;
      border-bottom: 1px solid #1a1a22;
      position: relative;
      overflow: hidden;
      padding: 0 12px;
      display: flex;
      align-items: flex-end;
    }
    .timeline-ruler .tick {
      position: absolute;
      bottom: 0;
      width: 1px;
      background: #2a2a34;
      height: 6px;
    }
    .timeline-ruler .tick.major {
      height: 10px;
      background: #3a3a44;
    }
    .timeline-ruler .tick-label {
      position: absolute;
      bottom: 10px;
      font-size: 7px;
      color: #4a4a54;
      transform: translateX(-50%);
      font-family: monospace;
    }

    /* Editor Drawer */
    .editor-drawer {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      height: 70vh;
      background: #111115;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border-top: 1px solid #2a2a32;
      transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.8);
    }
    .editor-drawer.open { bottom: 0; }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .drawer-content::-webkit-scrollbar { width: 3px; }
    .drawer-content::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }

    .tab-btn {
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      color: #8e8e93;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: 0.2s;
      cursor: pointer;
      background: transparent;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .tab-btn.active { color: #3b82f6; border-color: #3b82f6; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 12px; }

    /* Toast */
    .toast-notification {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 16, 20, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid #2a2a32;
      border-radius: 16px;
      padding: 12px 24px;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      animation: slideUp 0.3s ease-out;
      pointer-events: none;
    }
    .toast-notification.hidden { display: none; }
    @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* Canvas elements */
    .canvas-text-item {
      position: absolute;
      cursor: grab;
      user-select: none;
      padding: 4px 8px;
      border-radius: 4px;
      transition: box-shadow 0.2s;
      z-index: 50;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.95 !important;
    }
    .canvas-text-item:hover { box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5); }
    .canvas-text-item .text-content { pointer-events: none; opacity: 0.95 !important; }
    .canvas-text-item .delete-btn {
      display: none;
      background: rgba(239, 68, 68, 0.9);
      color: white;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      pointer-events: auto;
    }
    .canvas-text-item:hover .delete-btn { display: flex; }
    .canvas-text-item .delete-btn:hover { background: #ef4444; transform: scale(1.1); }
    .canvas-text-item.dragging { cursor: grabbing; opacity: 0.8; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }

    .media-placeholder {
      text-align: center;
      padding: 20px;
      z-index: 10;
    }
    .media-placeholder i { font-size: 48px; color: #2a2a34; margin-bottom: 12px; display: block; }
    .media-placeholder p { color: #6b7280; font-size: 13px; margin-bottom: 12px; }
  </style>
</head>
<body>

<!-- File Pickers -->
<input type="file" id="videoFilePicker" accept="video/*,image/*" class="hidden" />
<input type="file" id="audioFilePicker" accept="audio/*" class="hidden" onchange="handleAudioFileSelected(this)" />

<!-- Navbar -->
<header class="flex items-center justify-between px-4 py-2.5 bg-[#0b0b0e] border-b border-[#1e1e26]">
  <div class="flex items-center gap-3">
    <i class="fas fa-clapperboard text-blue-500 text-xl"></i>
    <span class="font-black text-lg tracking-tight text-white">DRAVOO</span>
    <span class="text-[10px] font-medium text-zinc-500 bg-zinc-800/60 px-2 py-0.5 rounded-full">Pro Studio</span>
  </div>
  <button onclick="showExportDialog()" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:opacity-90 text-white text-xs font-bold px-4 py-1.5 rounded-full transition">
    <i class="fas fa-download mr-1.5"></i>Export
  </button>
</header>

<!-- Main Workspace -->
<main class="max-w-4xl mx-auto px-2 my-3">
  <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">

    <!-- Project Toolbar -->
    <div class="flex items-center justify-between px-4 py-2 bg-[#0e0e12] border-b border-[#1f1f26]">
      <div class="flex items-center gap-2 text-sm">
        <span class="text-white font-semibold text-xs">Project: Untitled</span>
        <span class="text-[9px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/30">Active</span>
      </div>
      <div class="flex items-center gap-2">
        <select class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-300 rounded-full px-3 py-1 outline-none">
          <option>1080p</option>
          <option>4K UHD</option>
          <option>720p</option>
        </select>
        <button onclick="showExportDialog()" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:opacity-90 text-white text-xs font-bold px-3 py-1 rounded-full transition">
          <i class="fas fa-upload mr-1"></i>Export
        </button>
      </div>
    </div>

    <!-- Canvas Viewport -->
    <div class="w-full bg-[#050507] p-3 flex items-center justify-center border-b border-[#1c1c24]">
      <div id="videoRatioBox" class="relative bg-black flex items-center justify-center overflow-hidden shadow-inner transition-all duration-300 w-full max-w-[260px]" style="aspect-ratio: 9/16;">
        <video id="studioPlayer" loop class="w-full h-full object-contain hidden"></video>
        <img id="studioImage" class="w-full h-full object-contain hidden" alt="Preview" />
        <div id="canvasElementsLayer" class="absolute inset-0 pointer-events-none z-40"></div>
        <div id="mediaPlaceholder" class="media-placeholder">
          <i class="fas fa-photo-film"></i>
          <p>No media loaded</p>
          <button onclick="document.getElementById('videoFilePicker').click()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-1.5 rounded-full transition">
            <i class="fas fa-plus mr-1"></i>Import
          </button>
        </div>
      </div>
    </div>

    <!-- Playback Controls -->
    <div class="px-4 py-2 bg-[#0c0c10] border-b border-[#1a1a22] flex items-center justify-between">
      <span id="timeDisplay" class="text-xs font-mono text-zinc-400">00:00 / 00:00</span>
      <button id="playBtn" onclick="togglePlay()" class="w-8 h-8 bg-zinc-800 hover:bg-zinc-700 rounded-full flex items-center justify-center text-white">
        <i class="fas fa-play text-xs"></i>
      </button>
      <span class="text-[9px] uppercase tracking-wider font-bold text-zinc-500">Timeline</span>
    </div>

    <!-- TIMELINE RULER -->
    <div class="timeline-ruler" id="timelineRuler"></div>

    <!-- ==================== TRACK SYSTEM ==================== -->
    <div class="track-container" id="trackContainer">
      <!-- Text Tracks -->
      <div class="track-row" id="textTrackRow">
        <div class="track-label"><i class="fas fa-font text-blue-400 mr-1"></i>Text</div>
        <div class="track-timeline" id="textTrackTimeline" data-track-type="text">
          <div class="playhead" id="textPlayhead" style="left: 0%;"></div>
        </div>
      </div>

      <!-- Audio Tracks -->
      <div class="track-row" id="audioTrackRow">
        <div class="track-label"><i class="fas fa-music text-green-400 mr-1"></i>Audio</div>
        <div class="track-timeline" id="audioTrackTimeline" data-track-type="audio">
          <div class="playhead" id="audioPlayhead" style="left: 0%;"></div>
        </div>
      </div>

      <!-- Add Track Button -->
      <div class="flex gap-1 mt-1 pt-1 border-t border-[#14141a]">
        <button onclick="addNewTextTrack()" class="text-[9px] bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 px-2 py-0.5 rounded flex items-center gap-1 transition">
          <i class="fas fa-plus text-[8px]"></i>Text
        </button>
        <button onclick="document.getElementById('audioFilePicker').click()" class="text-[9px] bg-green-600/20 hover:bg-green-600/30 text-green-400 px-2 py-0.5 rounded flex items-center gap-1 transition">
          <i class="fas fa-plus text-[8px]"></i>Audio
        </button>
        <button onclick="showAddTextDrawer()" class="text-[9px] bg-purple-600/20 hover:bg-purple-600/30 text-purple-400 px-2 py-0.5 rounded flex items-center gap-1 transition">
          <i class="fas fa-font text-[8px]"></i>Add Text
        </button>
      </div>
    </div>

    <!-- Bottom Menu -->
    <div id="bottomMenu" class="flex overflow-x-auto bg-[#0e0e12] border-t border-[#22222a] py-1.5 px-1 gap-0.5 scroll-x-menu">
      <button onclick="showAddTextDrawer()" class="flex-shrink-0 w-16 flex flex-col items-center gap-0.5 text-zinc-400 hover:text-white py-1 transition">
        <i class="fas fa-font text-sm text-blue-400"></i><span class="text-[8px] font-medium">Text</span>
      </button>
      <button onclick="document.getElementById('audioFilePicker').click()" class="flex-shrink-0 w-16 flex flex-col items-center gap-0.5 text-zinc-400 hover:text-white py-1 transition">
        <i class="fas fa-music text-sm text-green-400"></i><span class="text-[8px] font-medium">Audio</span>
      </button>
      <button onclick="addNewTextTrack()" class="flex-shrink-0 w-16 flex flex-col items-center gap-0.5 text-zinc-400 hover:text-white py-1 transition">
        <i class="fas fa-plus text-sm text-purple-400"></i><span class="text-[8px] font-medium">Add Track</span>
      </button>
      <button onclick="openDrawer('styles')" class="flex-shrink-0 w-16 flex flex-col items-center gap-0.5 text-zinc-400 hover:text-white py-1 transition">
        <i class="fas fa-palette text-sm text-amber-400"></i><span class="text-[8px] font-medium">Styles</span>
      </button>
      <button onclick="openDrawer('animations')" class="flex-shrink-0 w-16 flex flex-col items-center gap-0.5 text-zinc-400 hover:text-white py-1 transition">
        <i class="fas fa-wand-magic-sparkles text-sm text-pink-400"></i><span class="text-[8px] font-medium">Animate</span>
      </button>
      <button onclick="clearAllTracks()" class="flex-shrink-0 w-16 flex flex-col items-center gap-0.5 text-red-400 hover:text-red-300 py-1 transition">
        <i class="fas fa-trash text-sm"></i><span class="text-[8px] font-medium">Clear All</span>
      </button>
    </div>

  </div>
</main>

<!-- ==================== EDITOR DRAWER ==================== -->
<div class="editor-drawer" id="editorDrawer">
  <div class="flex items-center justify-between px-4 py-3 border-b border-zinc-800 flex-shrink-0">
    <button class="text-zinc-400 font-bold" onclick="closeDrawer()">✕</button>
    <span id="drawerTitle" class="text-sm font-bold text-zinc-300">Text Editor</span>
    <button class="text-blue-500 font-bold text-sm" onclick="applyTextAndClose()">Done</button>
  </div>
  
  <div class="px-4 py-3 border-b border-zinc-800 flex-shrink-0">
    <div class="flex gap-2">
      <input type="text" id="textInput" oninput="updatePreview()" placeholder="Type your text here..." 
             class="flex-1 bg-zinc-900 border border-zinc-800 text-sm text-white px-3 py-2 rounded-xl outline-none focus:border-blue-500" 
             value="Your Text Here" />
      <button onclick="applyTextAndClose()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-xl font-bold transition whitespace-nowrap">
        <i class="fas fa-plus mr-1"></i>Add
      </button>
    </div>
  </div>

  <div class="flex border-b border-zinc-800 bg-[#0e0e12] overflow-x-auto flex-shrink-0">
    <button onclick="switchDrawerTab('styles')" class="tab-btn active" id="tab-styles">Styles</button>
    <button onclick="switchDrawerTab('fonts')" class="tab-btn" id="tab-fonts">Fonts</button>
    <button onclick="switchDrawerTab('animations')" class="tab-btn" id="tab-animations">Animations</button>
    <button onclick="switchDrawerTab('colors')" class="tab-btn" id="tab-colors">Colors</button>
  </div>

  <div class="drawer-content" id="drawerContent">
    <!-- Dynamic content rendered here -->
  </div>
</div>

<!-- ==================== EXPORT DIALOG ==================== -->
<div id="exportDialog" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[300] hidden">
  <div class="bg-[#121216] border border-zinc-800 rounded-2xl p-6 max-w-sm w-full">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-sm font-bold text-white"><i class="fas fa-download mr-2 text-blue-400"></i>Export</h3>
      <button onclick="closeExportDialog()" class="text-zinc-500 hover:text-white">✕</button>
    </div>
    <div class="space-y-2">
      <button onclick="exportProject('video')" class="w-full bg-zinc-800 hover:bg-zinc-700 rounded-xl px-4 py-3 text-left text-sm text-white flex items-center gap-3 transition">
        <i class="fas fa-video text-blue-400"></i> Video (MP4)
      </button>
      <button onclick="exportProject('audio')" class="w-full bg-zinc-800 hover:bg-zinc-700 rounded-xl px-4 py-3 text-left text-sm text-white flex items-center gap-3 transition">
        <i class="fas fa-music text-green-400"></i> Audio (MP3)
      </button>
      <button onclick="exportProject('project')" class="w-full bg-zinc-800 hover:bg-zinc-700 rounded-xl px-4 py-3 text-left text-sm text-white flex items-center gap-3 transition">
        <i class="fas fa-file-archive text-amber-400"></i> Project (.dravoo)
      </button>
    </div>
  </div>
</div>

<!-- ==================== TOAST ==================== -->
<div id="toast" class="toast-notification hidden">
  <i class="fas fa-check-circle text-blue-400 text-lg"></i>
  <span id="toastMessage" class="text-sm text-white font-medium">Ready!</span>
</div>

<!-- ====================== JAVASCRIPT ============================ -->
<!-- ============================================================ -->
<script>
// ============================================================
// DRAVOO PRO EDITOR - COMPLETE TRACK SYSTEM
// ============================================================

// ==================== DATA STRUCTURES ====================

let textTracks = []; // { id, name, clips: [{ id, text, start, end, style, font, animation }] }
let audioTracks = []; // { id, name, clips: [{ id, url, start, end, name }] }
let trackIdCounter = 0;
let clipIdCounter = 0;
let currentTrackId = null;

// Video state
let isPlaying = false;
let currentTime = 0;
const TOTAL_DURATION = 30; // 30 seconds timeline

// Canvas text elements
let canvasTextElements = [];

// ==================== DOM REFS ====================

const videoPlayer = document.getElementById('studioPlayer');
const imageEl = document.getElementById('studioImage');
const placeholder = document.getElementById('mediaPlaceholder');
const ratioBox = document.getElementById('videoRatioBox');
const playBtn = document.getElementById('playBtn');
const timeDisplay = document.getElementById('timeDisplay');
const canvasLayer = document.getElementById('canvasElementsLayer');
const textTimeline = document.getElementById('textTrackTimeline');
const audioTimeline = document.getElementById('audioTrackTimeline');

// ==================== MEDIA LOADING ====================

document.getElementById('videoFilePicker').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  placeholder.classList.add('hidden');
  
  if (file.type.startsWith('video/')) {
    imageEl.classList.add('hidden');
    videoPlayer.classList.remove('hidden');
    const url = URL.createObjectURL(file);
    videoPlayer.src = url;
    videoPlayer.muted = false;
    videoPlayer.play().catch(() => {});
    playBtn.innerHTML = `<i class="fas fa-pause text-xs"></i>`;
    isPlaying = true;
    showToast('🎬 Video loaded!');
  } else if (file.type.startsWith('image/')) {
    videoPlayer.classList.add('hidden');
    imageEl.classList.remove('hidden');
    imageEl.src = URL.createObjectURL(file);
    showToast('🖼️ Image loaded!');
  }
  
  setTimeout(updateTimelineUI, 200);
});

// ==================== AUDIO FILE HANDLER ====================

function handleAudioFileSelected(input) {
  const file = input.files[0];
  if (!file) return;
  
  const url = URL.createObjectURL(file);
  const audio = new Audio(url);
  audio.load();
  
  // Add to audio track
  const track = getOrCreateAudioTrack();
  const clip = {
    id: ++clipIdCounter,
    url: url,
    name: file.name.replace(/\.[^/.]+$/, '') || 'Audio Track',
    start: 0,
    end: Math.min(10, TOTAL_DURATION),
    audio: audio
  };
  track.clips.push(clip);
  
  updateTimelineUI();
  showToast(`🎵 "${clip.name}" added!`);
  input.value = '';
}

// ==================== TRACK MANAGEMENT ====================

function getOrCreateTextTrack() {
  if (textTracks.length === 0) {
    textTracks.push({ id: ++trackIdCounter, name: 'Text Track 1', clips: [] });
  }
  return textTracks[0];
}

function getOrCreateAudioTrack() {
  if (audioTracks.length === 0) {
    audioTracks.push({ id: ++trackIdCounter, name: 'Audio Track 1', clips: [] });
  }
  return audioTracks[0];
}

function addNewTextTrack() {
  const track = getOrCreateTextTrack();
  showAddTextDrawer();
}

function addTextClip(text, style, font, animation) {
  const track = getOrCreateTextTrack();
  const clip = {
    id: ++clipIdCounter,
    text: text,
    start: currentTime,
    end: Math.min(currentTime + 3, TOTAL_DURATION),
    style: style || 'color: #ffffff; text-shadow: 0 0 10px rgba(0,0,0,0.8);',
    font: font || 'Inter',
    animation: animation || 'Fade In'
  };
  track.clips.push(clip);
  
  // Add to canvas
  addTextToCanvas(clip);
  
  updateTimelineUI();
  showToast(`✏️ "${text}" added to timeline!`);
  return clip;
}

// ==================== CANVAS TEXT ====================

function addTextToCanvas(clip) {
  const el = document.createElement('div');
  el.className = 'canvas-text-item';
  el.dataset.clipId = clip.id;
  
  const x = 20 + Math.random() * 60;
  const y = 20 + Math.random() * 60;
  el.style.left = x + '%';
  el.style.top = y + '%';
  el.style.transform = 'translate(-50%, -50%)';
  
  const textSpan = document.createElement('span');
  textSpan.className = 'text-content';
  textSpan.innerText = clip.text;
  textSpan.style.cssText = clip.style;
  textSpan.style.fontFamily = clip.font;
  
  if (clip.animation) {
    textSpan.style.animation = getAnimationCSS(clip.animation);
  }
  
  const deleteBtn = document.createElement('button');
  deleteBtn.className = 'delete-btn';
  deleteBtn.innerHTML = '×';
  deleteBtn.onclick = (e) => {
    e.stopPropagation();
    removeTextClip(clip.id);
  };
  
  el.appendChild(textSpan);
  el.appendChild(deleteBtn);
  canvasLayer.appendChild(el);
  canvasLayer.style.pointerEvents = 'auto';
  
  setupDrag(el);
  canvasTextElements.push(el);
}

function removeTextClip(clipId) {
  // Remove from canvas
  const el = canvasLayer.querySelector(`[data-clip-id="${clipId}"]`);
  if (el) el.remove();
  canvasTextElements = canvasTextElements.filter(e => e.dataset.clipId != clipId);
  
  // Remove from track
  textTracks.forEach(track => {
    track.clips = track.clips.filter(c => c.id !== clipId);
  });
  
  updateTimelineUI();
  showToast('🗑️ Text removed');
}

function setupDrag(element) {
  let isDragging = false, startX, startY, startLeft, startTop;
  
  element.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('delete-btn')) return;
    isDragging = true;
    element.classList.add('dragging');
    startX = e.clientX;
    startY = e.clientY;
    startLeft = parseFloat(element.style.left) || 50;
    startTop = parseFloat(element.style.top) || 50;
    e.preventDefault();
  });
  
  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const rect = element.parentElement.getBoundingClientRect();
    const dx = (e.clientX - startX) / rect.width * 100;
    const dy = (e.clientY - startY) / rect.height * 100;
    let newLeft = Math.max(0, Math.min(100, startLeft + dx));
    let newTop = Math.max(0, Math.min(100, startTop + dy));
    element.style.left = newLeft + '%';
    element.style.top = newTop + '%';
  });
  
  document.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      element.classList.remove('dragging');
    }
  });
}

// ==================== TIMELINE UI ====================

function updateTimelineUI() {
  renderTextTrackClips();
  renderAudioTrackClips();
  updatePlayhead();
  updateTimeDisplay();
  renderRuler();
}

function renderTextTrackClips() {
  const timeline = textTimeline;
  // Remove old clips (keep playhead)
  const playhead = timeline.querySelector('.playhead');
  timeline.innerHTML = '';
  if (playhead) timeline.appendChild(playhead);
  
  const track = textTracks[0];
  if (!track || track.clips.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'absolute inset-0 flex items-center justify-center text-[8px] text-zinc-600';
    empty.innerText = 'No text clips';
    timeline.appendChild(empty);
    return;
  }
  
  track.clips.forEach(clip => {
    const el = createClipElement(clip, '#3b82f6', 'text');
    timeline.appendChild(el);
  });
}

function renderAudioTrackClips() {
  const timeline = audioTimeline;
  const playhead = timeline.querySelector('.playhead');
  timeline.innerHTML = '';
  if (playhead) timeline.appendChild(playhead);
  
  const track = audioTracks[0];
  if (!track || track.clips.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'absolute inset-0 flex items-center justify-center text-[8px] text-zinc-600';
    empty.innerText = 'No audio clips';
    timeline.appendChild(empty);
    return;
  }
  
  track.clips.forEach(clip => {
    const el = createClipElement(clip, '#10b981', 'audio');
    timeline.appendChild(el);
  });
}

function createClipElement(clip, color, type) {
  const el = document.createElement('div');
  el.className = 'track-clip';
  el.dataset.clipId = clip.id;
  el.dataset.trackType = type;
  
  const startPercent = (clip.start / TOTAL_DURATION) * 100;
  const endPercent = (clip.end / TOTAL_DURATION) * 100;
  const width = endPercent - startPercent;
  
  el.style.left = startPercent + '%';
  el.style.width = Math.max(width, 3) + '%';
  el.style.background = `linear-gradient(135deg, ${color}dd, ${color}88)`;
  
  const label = document.createElement('span');
  label.className = 'clip-label';
  label.innerText = clip.text || clip.name || 'Clip';
  el.appendChild(label);
  
  // Duration
  const dur = document.createElement('span');
  dur.className = 'clip-duration';
  const duration = (clip.end - clip.start).toFixed(1);
  dur.innerText = `${duration}s`;
  el.appendChild(dur);
  
  // Delete button
  const del = document.createElement('button');
  del.className = 'delete-clip';
  del.innerHTML = '×';
  del.onclick = (e) => {
    e.stopPropagation();
    if (type === 'text') {
      removeTextClip(clip.id);
    } else {
      removeAudioClip(clip.id);
    }
  };
  el.appendChild(del);
  
  // Resize handles
  const leftHandle = document.createElement('div');
  leftHandle.className = 'resize-handle-left';
  leftHandle.onmousedown = (e) => startResize(e, clip, 'left');
  el.appendChild(leftHandle);
  
  const rightHandle = document.createElement('div');
  rightHandle.className = 'resize-handle';
  rightHandle.onmousedown = (e) => startResize(e, clip, 'right');
  el.appendChild(rightHandle);
  
  // Drag to move
  el.onmousedown = (e) => {
    if (e.target.classList.contains('resize-handle') || 
        e.target.classList.contains('resize-handle-left') ||
        e.target.classList.contains('delete-clip')) return;
    startDragClip(e, clip, type);
  };
  
  return el;
}

// ==================== CLIP DRAG & RESIZE ====================

let dragData = null;

function startDragClip(e, clip, type) {
  const rect = e.currentTarget.parentElement.getBoundingClientRect();
  const startX = e.clientX;
  const startLeft = clip.start;
  const startRight = clip.end;
  
  dragData = { clip, type, startX, startLeft, startRight, rect };
  
  const onMove = (ev) => {
    if (!dragData) return;
    const dx = (ev.clientX - dragData.startX) / dragData.rect.width * TOTAL_DURATION;
    const newStart = Math.max(0, Math.min(TOTAL_DURATION - (clip.end - clip.start), dragData.startLeft + dx));
    const newEnd = newStart + (dragData.startRight - dragData.startLeft);
    clip.start = newStart;
    clip.end = Math.min(newEnd, TOTAL_DURATION);
    updateTimelineUI();
    updateCanvasTextPosition(clip);
  };
  
  const onUp = () => {
    dragData = null;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function startResize(e, clip, side) {
  e.stopPropagation();
  const rect = e.currentTarget.closest('.track-timeline').getBoundingClientRect();
  const startX = e.clientX;
  const startVal = side === 'left' ? clip.start : clip.end;
  
  const onMove = (ev) => {
    const dx = (ev.clientX - startX) / rect.width * TOTAL_DURATION;
    let newVal = Math.max(0, Math.min(TOTAL_DURATION, startVal + dx));
    
    if (side === 'left') {
      clip.start = Math.min(newVal, clip.end - 0.5);
    } else {
      clip.end = Math.max(newVal, clip.start + 0.5);
    }
    updateTimelineUI();
    updateCanvasTextPosition(clip);
  };
  
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function updateCanvasTextPosition(clip) {
  const el = canvasLayer.querySelector(`[data-clip-id="${clip.id}"]`);
  if (!el) return;
  // We don't reposition canvas elements based on timeline time
  // They stay in place and visibility is controlled by playhead
}

// ==================== PLAYHEAD ====================

let animationFrame = null;

function updatePlayhead() {
  const percent = (currentTime / TOTAL_DURATION) * 100;
  document.querySelectorAll('.playhead').forEach(el => {
    el.style.left = Math.min(percent, 100) + '%';
  });
  
  // Update canvas text visibility based on current time
  updateCanvasVisibility();
}

function updateCanvasVisibility() {
  const allTexts = canvasLayer.querySelectorAll('.canvas-text-item');
  allTexts.forEach(el => {
    const clipId = parseInt(el.dataset.clipId);
    let visible = false;
    textTracks.forEach(track => {
      track.clips.forEach(clip => {
        if (clip.id === clipId && currentTime >= clip.start && currentTime <= clip.end) {
          visible = true;
        }
      });
    });
    el.style.display = visible ? 'flex' : 'none';
  });
}

function updateTimeDisplay() {
  const mins = Math.floor(currentTime / 60);
  const secs = Math.floor(currentTime % 60);
  const totalMins = Math.floor(TOTAL_DURATION / 60);
  const totalSecs = Math.floor(TOTAL_DURATION % 60);
  timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')} / ${String(totalMins).padStart(2, '0')}:${String(totalSecs).padStart(2, '0')}`;
}

// ==================== RULER ====================

function renderRuler() {
  const ruler = document.getElementById('timelineRuler');
  ruler.innerHTML = '';
  const segments = 10;
  for (let i = 0; i <= segments; i++) {
    const pos = (i / segments) * 100;
    const tick = document.createElement('div');
    tick.className = 'tick' + (i % 2 === 0 ? ' major' : '');
    tick.style.left = pos + '%';
    ruler.appendChild(tick);
    
    if (i % 2 === 0) {
      const label = document.createElement('div');
      label.className = 'tick-label';
      label.style.left = pos + '%';
      label.textContent = `${(i / segments * TOTAL_DURATION).toFixed(1)}s`;
      ruler.appendChild(label);
    }
  }
}

// ==================== PLAYBACK ====================

function togglePlay() {
  if (!videoPlayer.src || videoPlayer.classList.contains('hidden')) {
    // Audio only mode
    if (isPlaying) {
      isPlaying = false;
      playBtn.innerHTML = `<i class="fas fa-play text-xs"></i>`;
      pauseAudioClips();
    } else {
      isPlaying = true;
      playBtn.innerHTML = `<i class="fas fa-pause text-xs"></i>`;
      playAudioClips();
      startTimelinePlayback();
    }
    return;
  }
  
  if (isPlaying) {
    videoPlayer.pause();
    isPlaying = false;
    playBtn.innerHTML = `<i class="fas fa-play text-xs"></i>`;
    pauseAudioClips();
    if (animationFrame) {
      cancelAnimationFrame(animationFrame);
      animationFrame = null;
    }
  } else {
    videoPlayer.play().catch(() => {});
    isPlaying = true;
    playBtn.innerHTML = `<i class="fas fa-pause text-xs"></i>`;
    playAudioClips();
    startTimelinePlayback();
  }
}

function startTimelinePlayback() {
  if (animationFrame) cancelAnimationFrame(animationFrame);
  
  let lastTime = performance.now();
  
  function tick() {
    if (!isPlaying) {
      animationFrame = null;
      return;
    }
    
    const now = performance.now();
    const delta = (now - lastTime) / 1000;
    lastTime = now;
    
    currentTime = Math.min(currentTime + delta, TOTAL_DURATION);
    updatePlayhead();
    updateTimeDisplay();
    
    if (currentTime >= TOTAL_DURATION) {
      currentTime = 0;
      isPlaying = false;
      playBtn.innerHTML = `<i class="fas fa-play text-xs"></i>`;
      pauseAudioClips();
      updatePlayhead();
      showToast('⏹️ Playback ended');
      return;
    }
    
    animationFrame = requestAnimationFrame(tick);
  }
  
  animationFrame = requestAnimationFrame(tick);
}

function playAudioClips() {
  audioTracks.forEach(track => {
    track.clips.forEach(clip => {
      if (clip.audio) {
        clip.audio.currentTime = Math.max(0, currentTime - clip.start);
        clip.audio.play().catch(() => {});
      }
    });
  });
}

function pauseAudioClips() {
  audioTracks.forEach(track => {
    track.clips.forEach(clip => {
      if (clip.audio) {
        clip.audio.pause();
      }
    });
  });
}

// ==================== REMOVE AUDIO CLIP ====================

function removeAudioClip(clipId) {
  audioTracks.forEach(track => {
    const clip = track.clips.find(c => c.id === clipId);
    if (clip && clip.audio) {
      clip.audio.pause();
      clip.audio.src = '';
      clip.audio.load();
    }
    track.clips = track.clips.filter(c => c.id !== clipId);
  });
  updateTimelineUI();
  showToast('🗑️ Audio removed');
}

// ==================== CLEAR ALL ====================

function clearAllTracks() {
  if (!confirm('Remove all clips from timeline?')) return;
  
  textTracks.forEach(t => t.clips = []);
  audioTracks.forEach(t => t.clips = []);
  canvasLayer.innerHTML = '';
  canvasTextElements = [];
  currentTime = 0;
  updateTimelineUI();
  showToast('🧹 All tracks cleared');
}

function getAnimationCSS(anim) {

    'Fade In': 'textFadeIn 0.6s ease-out forwards',

    'Bounce': 'textBounce 0.6s ease-in-out infinite',

// ==================== EXPORT ====================

function showExportDialog() {
  document.getElementById('exportDialog').classList.remove('hidden');
}

function closeExportDialog() {
  document.getElementById('exportDialog').classList.add('hidden');
}

function exportProject(type) {
  const textCount = textTracks.reduce((sum, t) => sum + t.clips.length, 0);
  const audioCount = audioTracks.reduce((sum, t) => sum + t.clips.length, 0);
  
  let msg = `📦 Exporting ${type.toUpperCase()}\n\n`;
  msg += `📝 Text Clips: ${textCount}\n`;
  msg += `🎵 Audio Clips: ${audioCount}\n`;
  msg += `⏱️ Duration: ${TOTAL_DURATION}s\n\n`;
  
  if (type === 'project') {
    const data = {
      version: '1.0',
      duration: TOTAL_DURATION,
      textTracks: textTracks.map(t => ({ ...t, clips: t.clips.map(c => ({ ...c, audio: undefined })) })),
      audioTracks: audioTracks.map(t => ({ ...t, clips: t.clips.map(c => ({ ...c, audio: undefined, url: undefined })) })),
      exported: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `dravoo-project-${new Date().toISOString().slice(0,10)}.dravoo`;
    a.click();
    URL.revokeObjectURL(url);
    msg += '✅ Project file saved!';
  } else {
    msg += '✅ Export complete!';
  }
  
  alert(msg);
  closeExportDialog();
  showToast(`📤 ${type} exported!`);
}

// ==================== TOAST ====================

function showToast(message, icon = 'fa-check-circle') {
  const toast = document.getElementById('toast');
  const msgEl = document.getElementById('toastMessage');
  const iconEl = toast.querySelector('i');
  iconEl.className = `fas ${icon} text-blue-400 text-lg`;
  msgEl.textContent = message;
  toast.classList.remove('hidden');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.add('hidden'), 2500);
}

  updateTimelineUI();
  renderRuler();
  showToast('🚀 Dravoo Pro ready! Add text or audio to start.');
  
  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' && e.target === document.body) {
      e.preventDefault();
      togglePlay();
    }
    if (e.key === 'Escape') {
      closeDrawer();
      closeExportDialog();
    }
    if (e.key === 't' && !e.ctrlKey && !e.metaKey) {
      showAddTextDrawer();
    }
  });
}

// Add CSS animations
const styleSheet = document.createElement('style');
styleSheet.textContent = `
  @keyframes textFadeIn { 0% { opacity: 0; } 100% { opacity: 0.95; } }
  @keyframes textSlideIn { 0% { transform: translateX(-20px); opacity: 0; } 100% { transform: translateX(0); opacity: 0.95; } }
  @keyframes textBounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @keyframes textPulse { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.5; } }
  @keyframes textGlow { 0%, 100% { text-shadow: 0 0 10px #3b82f6; } 50% { text-shadow: 0 0 30px #3b82f6; } }
  @keyframes textZoom { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 0.95; } }
  @keyframes textWave { 0% { transform: translateY(0); } 25% { transform: translateY(-5px); } 50% { transform: translateY(0); } 75% { transform: translateY(5px); } 100% { transform: translateY(0); } }
  @keyframes textShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @keyframes textWobble { 0%, 100% { transform: rotate(-2deg) scale(1); } 50% { transform: rotate(2deg) scale(1.05); } }
  @keyframes textJello { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.1) rotate(-5deg); } 50% { transform: scale(0.9) rotate(5deg); } 70% { transform: scale(1.05) rotate(-3deg); } }
  @keyframes textHeartbeat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.2); } 28% { transform: scale(1); } 42% { transform: scale(1.15); } 70% { transform: scale(1); } }
  @keyframes textFlicker { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.3; } 75% { opacity: 0.7; } }
  @keyframes textSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes textDropIn { 0% { transform: translateY(-50px) scale(0.5); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 0.95; } }
  @keyframes textRiseUp { 0% { transform: translateY(30px); opacity: 0; } 100% { transform: translateY(0); opacity: 0.95; } }
`;
document.head.appendChild(styleSheet);

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
