<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dravoo · Pro Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Bebas+Neue&family=Lobster&family=Pacifico&family=Caveat:wght@700&family=Playfair+Display:ital,wght@1,700&family=Oswald:wght@500;700&family=Montserrat:wght@800&family=Fascinate&family=Permanent+Marker&family=Righteous&family=Fredoka+One&family=Alfa+Slab+One&family=Bangers&family=Cinzel:wght@700&family=Comfortaa:wght@700&family=Courgette&family=Creepster&family=Gloria+Hallelujah&family=Great+Vibes&family=Kaushan+Script&family=Luckiest+Guy&family=Monoton&family=Orbitron:wght@900&family=Press+Start+2P&family=Sacramento&family=Satisfy&family=Special+Elite&family=Spicy+Rice&family=Titan+One&family=Vampiro+One&family=Abril+Fatface&family=Anton&family=Archivo+Black&family=Black+Ops+One&family=Bungee&family=Coiny&family=Exo+2:wght@800&family=Francois+One&family=Gravitas+One&family=Josefin+Sans:wght@700&family=Kanit:wght@800&family=Lilita+One&family=Limelight&family=Megrim&family=New+Rocker&family=Nosifer&family=Paytone+One&family=Plaster&family=Poiret+One&family=Rajdhani:wght@700&family=Rampart+One&family=Rancho&family=Russo+One&family=Sigmar+One&family=Staatliches&family=Syncopate:wght@700&family=Uncial+Antiqua&family=Wallpoet&family=Big+Shoulders+Display:wght@900&family=Black+Han+Sans&family=Chango&family=Comic+Neue&family=Delius+Swash+Caps&family=Emblema+One&family=Fugaz+One&family=Gaegu&family=Girassol&family=Hanalei&family=Henny+Penny&family=Iceberg&family=Jacques+Francois+Shadow&family=Kavoon&family=Leckerli+One&family=Ma+Shan+Zheng&family=Monofett&family=New+Rocker&family=Overlock&family=Patua+One&family=Qwigley&family=Redressed&family=Shrikhand&family=Sirin+Stencil&family=Sofia&family=Sriracha&family=Stalinist+One&family=Warnes&family=ZCOOL+KuaiLe&family=Blacker+Pro&family=Dancing+Script&family=Epilogue&family=Fira+Code&family=Genos&family=Hind&family=Inconsolata&family=JetBrains+Mono&family=Karla&family=Lato&family=Merriweather&family=Nunito&family=Open+Sans&family=Poppins&family=Quicksand&family=Roboto&family=Source+Sans+Pro&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b0e;
            color: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(16, 16, 20, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid #2a2a30;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 12px; }

        .scroll-x-menu {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-x-menu::-webkit-scrollbar { display: none; }

        .editor-drawer {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 70vh;
            background: #111115;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            border-top: 1px solid #2a2a32;
            transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.8);
        }
        .editor-drawer.open { bottom: 0; }
        
        .asset-card {
            background: #1c1c22;
            border-radius: 14px;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
            color: #e5e7eb;
            border: 1px solid #2c2c34;
            transition: 0.15s;
            padding: 8px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .asset-card:hover { transform: scale(1.02); border-color: #3b82f6; background: #26262e; }
        
        .draw-overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none; }
        .draw-overlay-canvas.active { pointer-events: auto; cursor: crosshair; }
        
        .submenu-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            padding: 12px;
            background: #0c0c10;
        }
        @media (max-width: 600px) {
            .submenu-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .audio-track-container {
            background: #0a0a0e;
            border-bottom: 1px solid #1a1a22;
            padding: 8px 12px;
        }
        .audio-track-item {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 10px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .audio-track-item:hover {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.4);
        }
        .audio-track-item .track-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .audio-track-item .track-info i {
            color: #34d399;
            font-size: 12px;
            flex-shrink: 0;
        }
        .audio-track-item .track-info span {
            font-size: 11px;
            font-family: monospace;
            color: #34d399;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .audio-track-item .track-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .audio-track-item .track-actions button {
            background: transparent;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .audio-track-item .track-actions button:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        .audio-track-item .track-actions .play-btn {
            color: #34d399;
        }
        .audio-track-item .track-actions .play-btn:hover {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }
        .audio-track-item .waveform-preview {
            width: 60px;
            height: 20px;
            background: linear-gradient(90deg, #34d399 20%, rgba(16, 185, 129, 0.3) 40%, #34d399 60%, rgba(16, 185, 129, 0.3) 80%);
            border-radius: 4px;
            opacity: 0.6;
            flex-shrink: 0;
        }

        .multi-track-container {
            max-height: 120px;
            overflow-y: auto;
            padding: 4px 0;
        }
        .multi-track-container::-webkit-scrollbar { width: 2px; }
        .multi-track-container::-webkit-scrollbar-thumb { background: #34d399; border-radius: 4px; }

        .export-dialog {
            background: #121216;
            border: 1px solid #2a2a32;
            border-radius: 16px;
            padding: 20px 24px;
            max-width: 400px;
            margin: 0 auto;
        }
        .export-dialog .export-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .export-dialog .export-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: #e5e7eb;
        }
        .export-dialog .export-header .close-btn {
            color: #6b7280;
            cursor: pointer;
            font-size: 16px;
        }
        .export-dialog .export-header .close-btn:hover { color: #ef4444; }
        .export-dialog .export-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .export-dialog .export-options button {
            background: #1c1c22;
            border: 1px solid #2a2a32;
            border-radius: 10px;
            padding: 10px 16px;
            color: #e5e7eb;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .export-dialog .export-options button:hover {
            background: #26262e;
            border-color: #3b82f6;
        }
        .export-dialog .export-options button i { font-size: 14px; }

        .voice-option {
            background: #1c1c22;
            border: 2px solid #2a2a32;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .voice-option:hover {
            border-color: #3b82f6;
            background: #26262e;
        }
        .voice-option.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
        }
        .voice-option .voice-icon {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }
        .voice-option .voice-name {
            font-size: 11px;
            font-weight: 600;
            color: #e5e7eb;
        }
        .voice-option .voice-desc {
            font-size: 9px;
            color: #6b7280;
        }

        .tab-btn {
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: 0.2s;
            cursor: pointer;
            background: transparent;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        .tab-btn.active {
            color: #3b82f6;
            border-color: #3b82f6;
        }

        .font-preview-btn {
            background: #18181c;
            border: 1px solid #2a2a32;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .font-preview-btn:hover {
            border-color: #3b82f6;
            background: #22222a;
        }
        .font-preview-btn .font-name {
            font-size: 11px;
            color: #9ca3af;
            font-family: monospace;
        }
        .font-preview-btn .font-sample {
            font-size: 16px;
            color: #fff;
            font-weight: 700;
        }

        /* Animation Keyframes */
        @keyframes textFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes textBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes textSlideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(59,130,246,0.5); }
            50% { text-shadow: 0 0 30px rgba(59,130,246,0.8); }
        }
        @keyframes textRotate {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }
        @keyframes textPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes textWave {
            0% { transform: translateY(0); }
            25% { transform: translateY(-5px); }
            50% { transform: translateY(0); }
            75% { transform: translateY(5px); }
            100% { transform: translateY(0); }
        }
        @keyframes textShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        @keyframes textFlip {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
        @keyframes textZoom {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        @keyframes textNeonPulse {
            0%, 100% { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #3b82f6, 0 0 40px #3b82f6; }
            50% { text-shadow: 0 0 10px #fff, 0 0 20px #3b82f6, 0 0 40px #3b82f6, 0 0 80px #3b82f6; }
        }
        @keyframes textRainbow {
            0% { color: #ff0000; }
            17% { color: #ff8800; }
            33% { color: #ffff00; }
            50% { color: #00ff00; }
            67% { color: #0088ff; }
            83% { color: #8800ff; }
            100% { color: #ff0000; }
        }

        .canvas-text-item {
            position: absolute;
            cursor: grab;
            user-select: none;
            padding: 4px 8px;
            border-radius: 4px;
            transition: box-shadow 0.2s;
            z-index: 50;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .canvas-text-item:hover {
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
            border-radius: 4px;
        }
        .canvas-text-item .text-content {
            pointer-events: none;
            opacity: 1 !important;  /* Fix: text opacity increased */
        }
        .canvas-text-item .delete-btn {
            display: none;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            pointer-events: auto;
        }
        .canvas-text-item:hover .delete-btn {
            display: flex;
        }
        .canvas-text-item .delete-btn:hover {
            background: #ef4444;
            transform: scale(1.1);
        }
        .canvas-text-item.dragging {
            cursor: grabbing;
            opacity: 0.9;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        .toast-notification {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 16, 20, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid #2a2a32;
            border-radius: 16px;
            padding: 12px 24px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            animation: slideUp 0.3s ease-out;
            pointer-events: none;
        }
        .toast-notification.hidden { display: none; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* search bar styles */
        .group-search-bar {
            background: #1a1a22;
            border: 1px solid #2a2a32;
            border-radius: 30px;
            padding: 4px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .group-search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: #f1f5f9;
            font-size: 13px;
            width: 100%;
            padding: 8px 0;
        }
        .group-search-bar input::placeholder {
            color: #6b7280;
        }
        .group-search-bar i {
            color: #6b7280;
            font-size: 14px;
        }
        .group-label {
            font-size: 10px;
            font-weight: 700;
            color: #8e8e93;
            letter-spacing: 0.5px;
            padding: 2px 12px;
            background: #18181c;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <input type="file" id="video-file-picker" accept="video/*,image/*" class="hidden" />
    <input type="file" id="overlay-file-picker" accept="video/*,image/*" class="hidden" onchange="handleOverlaySelected(this)" />
    <input type="file" id="audio-extract-picker" accept="audio/*,video/*" class="hidden" onchange="handleAudioExtracted(this)" />

    <!-- Navbar -->
    <header class="flex items-center justify-between px-5 py-3 bg-[#0b0b0e] border-b border-[#1e1e26]">
        <div class="flex items-center gap-3">
            <i class="fas fa-clapperboard text-blue-500 text-xl"></i>
            <span class="font-black text-lg tracking-tight text-white">DRAVOO</span>
            <span class="text-[10px] font-medium text-zinc-500 bg-zinc-800/60 px-2 py-0.5 rounded-full">Pro Studio</span>
        </div>
        <button onclick="showExportDialog()" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:opacity-90 text-white text-xs font-bold px-4 py-1.5 rounded-full transition">
            <i class="fas fa-download mr-1.5"></i>Export
        </button>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-3xl mx-auto px-2 my-4">
        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">

            <!-- Top Project Toolbar -->
            <div class="flex items-center justify-between px-4 py-2.5 bg-[#0e0e12] border-b border-[#1f1f26]">
                <div class="flex items-center gap-2 text-sm">
                    <span class="text-white font-semibold">Project: Untitled</span>
                    <span class="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/30">Active</span>
                </div>
                <div class="flex items-center gap-3">
                    <select class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-300 rounded-full px-3 py-1.5 outline-none">
                        <option>4K UHD</option>
                        <option selected>1080p Full HD</option>
                        <option>720p HD</option>
                    </select>
                    <button onclick="showExportDialog()" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:opacity-90 text-white text-xs font-bold px-4 py-1.5 rounded-full transition">
                        <i class="fas fa-upload mr-1.5"></i>Export
                    </button>
                </div>
            </div>

            <!-- Main Canvas Viewport -->
            <div class="w-full bg-[#050507] p-4 flex items-center justify-center border-b border-[#1c1c24]">
                <div id="video-ratio-box" class="relative bg-black flex items-center justify-center overflow-hidden shadow-inner transition-all duration-300 w-full max-w-[280px]" style="aspect-ratio: 9/16;">
                    <video id="studio-player" loop class="w-full h-full object-contain hidden"></video>
                    <img id="studio-image" class="w-full h-full object-contain hidden" alt="preview" />
                    
                    <div id="canvas-elements-layer" class="absolute inset-0 pointer-events-none z-40"></div>
                    <img id="overlay-display-img" class="absolute max-w-[40%] max-h-[40%] border-2 border-dashed border-blue-500 hidden z-20 pointer-events-auto cursor-move" style="top:20px; left:20px;" alt="Overlay" />

                    <div id="media-placeholder" class="text-center p-6 z-10">
                        <i class="fas fa-photo-film text-5xl text-zinc-700 mb-3 animate-pulse"></i>
                        <p class="text-sm text-zinc-400 mb-4">No media timeline detected</p>
                        <button onclick="document.getElementById('video-file-picker').click()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-5 py-2 rounded-full transition"><i class="fas fa-plus mr-2"></i>Import Asset</button>
                    </div>

                    <canvas id="drawCanvas" class="draw-overlay-canvas"></canvas>
                    
                    <div id="drawToolsPanel" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-50 bg-[#111116] border border-zinc-800 rounded-full px-4 py-2 hidden items-center gap-3 shadow-2xl">
                        <button class="text-xs bg-zinc-800 px-2 py-1 rounded text-white" onclick="setBrush(3)">Thin</button>
                        <button class="text-xs bg-zinc-800 px-2 py-1 rounded text-white" onclick="setBrush(8)">Thick</button>
                        <button onclick="clearDraw()" class="text-xs bg-red-600 px-2 py-1 rounded text-white">Clear</button>
                        <button onclick="toggleDraw()" class="text-xs text-zinc-400">✕</button>
                    </div>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="px-4 py-2.5 bg-[#0c0c10] border-b border-[#1a1a22] flex items-center justify-between">
                <span id="timeDisplay" class="text-xs font-mono text-zinc-400">00:00 / 00:00</span>
                <button id="playBtn" onclick="togglePlay()" class="w-9 h-9 bg-zinc-800 hover:bg-zinc-700 rounded-full flex items-center justify-center text-white"><i class="fas fa-play text-xs"></i></button>
                <span class="text-[10px] uppercase tracking-wider font-bold text-zinc-500">Timeline Mode</span>
            </div>

            <!-- AUDIO TRACK CONTAINER -->
            <div id="audioTrackContainer" class="audio-track-container">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider">
                        <i class="fas fa-waveform text-emerald-400 mr-1.5"></i>Audio Tracks
                    </span>
                    <span id="trackCount" class="text-[10px] text-zinc-600">0 tracks</span>
                </div>
                <div id="multiTrackList" class="multi-track-container">
                    <div class="text-center py-4">
                        <span class="text-[10px] text-zinc-600">No audio tracks added yet</span>
                    </div>
                </div>
            </div>

            <!-- Video Timeline Track -->
            <div class="px-4 py-3 bg-[#0a0a0e] border-b border-[#1a1a22] space-y-2">
                <div class="bg-[#131318] border border-zinc-800 rounded-xl p-2.5 flex items-center justify-between">
                    <div class="flex items-center gap-2 truncate">
                        <i class="fas fa-video text-blue-400 text-xs"></i>
                        <span id="timelineLabel" class="text-xs font-mono text-zinc-400 truncate">master_track.mp4</span>
                    </div>
                    <button onclick="document.getElementById('video-file-picker').click()" class="text-zinc-400 hover:text-white text-[11px] bg-zinc-800 px-2.5 py-1 rounded-md">Replace</button>
                </div>
            </div>

            <!-- MASTER BOTTOM MENU -->
            <div id="masterBottomMenu" class="scroll-x-menu bg-[#0e0e12] border-t border-[#22222a] py-2 px-1 gap-1">
                <button onclick="showSubmenu('edit')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-video text-base text-blue-400"></i><span class="text-[10px] font-medium">Edit</span></button>

    <script>
        // ============================================================
        // FULL JAVASCRIPT with GROUPS, SEARCH, DRAG/DELETE, OPACITY FIX
        // ============================================================

        // Global variables
        let currentTextState = {
            text: "Enter Text",
            font: "Inter",
            styleCSS: "color: #ffffff; text-shadow: none;",
            animation: "",
            bubbleCSS: ""
        };

        let customPresets = [];
        let textElementCounter = 0;
        let dragData = null;

        // ===== TOAST NOTIFICATION =====
        let toastTimeout = null;
        function showToast(message, icon = 'fa-check-circle') {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = toast.querySelector('i');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastIcon.className = `fas ${icon} text-blue-400 text-lg`;
            toastMsg.textContent = message;
            toast.classList.remove('hidden');

        // ===== AUDIO TRACK MANAGEMENT =====
        let audioTracks = [];
        let trackIdCounter = 0;

        function addAudioTrack(name, url, type = 'track') {
            const id = ++trackIdCounter;
            const audio = new Audio(url);
            audio.loop = false;
            audio.volume = 1.0;
            const track = { id, name, audio, type, playing: false };
            audioTracks.push(track);
            renderAudioTracks();
            updateTrackCount();
            playTrack(id);
            showToast(`🎵 "${name}" added to track`, 'fa-music');
            return track;
        }

        function renderAudioTracks() {
            const container = document.getElementById('multiTrackList');
            if (!container) return;
            if (audioTracks.length === 0) {
                container.innerHTML = `<div class="text-center py-4"><span class="text-[10px] text-zinc-600">No audio tracks added yet</span></div>`;
                return;
            }
            container.innerHTML = audioTracks.map(track => `
                <div class="audio-track-item" data-track-id="${track.id}">
                    <div class="track-info">
                        <i class="fas ${track.type === 'fx' ? 'fa-bolt' : 'fa-music'}"></i>
                        <span>${track.name}</span>
                        <div class="waveform-preview"></div>
                    </div>
                    <div class="track-actions">
                        <button class="play-btn" onclick="toggleTrackPlay(${track.id})">
                            <i class="fas ${track.playing ? 'fa-pause' : 'fa-play'}"></i>
                        </button>
                        <button onclick="removeTrack(${track.id})"><i class="fas fa-times"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function updateTrackCount() {
            const countEl = document.getElementById('trackCount');
            if (countEl) countEl.textContent = `${audioTracks.length} track${audioTracks.length !== 1 ? 's' : ''}`;
        }

        function playTrack(id) {
            const track = audioTracks.find(t => t.id === id);
            if (!track) return;
            audioTracks.forEach(t => { if (t.id !== id && t.playing) { t.audio.pause(); t.playing = false; } });
            track.audio.currentTime = 0;
            track.audio.play().catch(e => console.log('Play error:', e));
            track.playing = true;
            const player = document.getElementById('studio-player');
            if (!player.paused && player.currentTime > 0) track.audio.currentTime = player.currentTime;
            renderAudioTracks();
        }

        function toggleTrackPlay(id) {
            const track = audioTracks.find(t => t.id === id);
            if (!track) return;
            if (track.playing) { track.audio.pause(); track.playing = false; }
            else { audioTracks.forEach(t => { if (t.id !== id && t.playing) { t.audio.pause(); t.playing = false; } });
                track.audio.play().catch(e => console.log('Play error:', e));
                track.playing = true; }
            renderAudioTracks();
        }

        function removeTrack(id) {
            const track = audioTracks.find(t => t.id === id);
            if (track) { track.audio.pause(); track.audio.src = ''; }
            audioTracks = audioTracks.filter(t => t.id !== id);
            renderAudioTracks();
            updateTrackCount();
            if (audioTracks.length === 0) {
                document.getElementById('multiTrackList').innerHTML = `<div class="text-center py-4"><span class="text-[10px] text-zinc-600">No audio tracks added yet</span></div>`;
            }
            showToast('Track removed', 'fa-trash');
        }

        function playAllTracks() { audioTracks.forEach(track => { track.audio.currentTime = 0; track.audio.play().catch(e => console.log('Play error:', e)); track.playing = true; }); renderAudioTracks(); }
        function pauseAllTracks() { audioTracks.forEach(track => { track.audio.pause(); track.playing = false; }); renderAudioTracks(); }
        function syncTracksWithVideo(time) { audioTracks.forEach(track => { if (track.playing) track.audio.currentTime = time; }); }

        // ===== MEDIA PLAYER =====
        const picker = document.getElementById('video-file-picker');
        const player = document.getElementById('studio-player');
        const imageEl = document.getElementById('studio-image');
        const placeholder = document.getElementById('media-placeholder');
        const timelineLabel = document.getElementById('timelineLabel');
        const playBtn = document.getElementById('playBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const ratioBox = document.getElementById('video-ratio-box');
        const elementsLayer = document.getElementById('canvas-elements-layer');
        const overlayImg = document.getElementById('overlay-display-img');

        picker.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            timelineLabel.innerText = file.name;
            placeholder.classList.add('hidden');
            if (file.type.startsWith('video/')) {
                imageEl.classList.add('hidden');
                player.classList.remove('hidden');
                player.src = URL.createObjectURL(file);
                player.muted = false;
                player.play();
                playBtn.innerHTML = `<i class="fas fa-pause text-xs"></i>`;
                setTimeout(syncCanvasSize, 100);
            } else {
                player.classList.add('hidden');
                imageEl.classList.remove('hidden');
                imageEl.src = URL.createObjectURL(file);
                timeDisplay.innerText = "00:00 / 00:05";
                setTimeout(syncCanvasSize, 100);
            }
        });

        function togglePlay() {
            if (player.src && !player.classList.contains('hidden')) {
                if (player.paused) { player.play(); audioTracks.forEach(t => { if (t.playing) t.audio.play(); }); playBtn.innerHTML = `<i class="fas fa-pause text-xs"></i>`; }
                else { player.pause(); audioTracks.forEach(t => { if (t.playing) t.audio.pause(); }); playBtn.innerHTML = `<i class="fas fa-play text-xs"></i>`; }
            } else {
                if (audioTracks.length > 0) {
                    const anyPlaying = audioTracks.some(t => t.playing);
                    if (anyPlaying) { pauseAllTracks(); playBtn.innerHTML = `<i class="fas fa-play text-xs"></i>`; } 
                    else { playAllTracks(); playBtn.innerHTML = `<i class="fas fa-pause text-xs"></i>`; }
                }
            }
        }

        player.addEventListener('timeupdate', () => {
            const current = formatTime(player.currentTime);
            const total = formatTime(player.duration || 0);
            timeDisplay.innerText = `${current} / ${total}`;
            syncTracksWithVideo(player.currentTime);
        });

        function formatTime(secs) { const m = Math.floor(secs / 60).toString().padStart(2, '0'); const s = Math.floor(secs % 60).toString().padStart(2, '0'); return `${m}:${s}`; }

        function handleAudioExtracted(input) {
            const file = input.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            const trackName = file.name.replace(/\.[^/.]+$/, '') || 'Extracted Audio';
            addAudioTrack(trackName, url, 'track');
            showSubmenu('audio');
            input.value = '';
        }

        // ===== PIXABAY API =====
        const PIXABAY_API_KEY = '52778614-b103ae3cfe866a30cb154bd0a';
        function openPixabayModal(mode) {

        function closePixabayModal() { document.getElementById('pixabayModal').classList.add('hidden'); }

        // ===== NAVIGATION =====
        function showSubmenu(id) { backToMaster(); document.getElementById('masterBottomMenu').classList.add('hidden'); const sub = document.getElementById(`submenu-${id}`); if (sub) sub.classList.remove('hidden'); }
        function backToMaster() { const submenus = ['edit','audio','text','effects','overlay','caption','filters','adjust','generate-media','ai-avatar','aspect-ratio','background']; submenus.forEach(s => { const el = document.getElementById(`submenu-${s}`); if (el) el.classList.add('hidden'); }); document.getElementById('masterBottomMenu').classList.remove('hidden'); }
        function triggerTool(name) { alert(`"${name}" layer triggered.`); showToast(`⚡ ${name} triggered`, 'fa-bolt'); }
        function handleOverlaySelected(input) { const file = input.files[0]; if (file) { overlayImg.src = URL.createObjectURL(file); overlayImg.classList.remove('hidden'); showToast('📁 Overlay added!', 'fa-layer-group'); } }
        function applyCSSFilter(filterValue) { player.style.filter = filterValue; imageEl.style.filter = filterValue; }
        function adjustBrightness(val) { applyCSSFilter(`brightness(${val}%)`); }
        function changeRatio(ratioStr) {
            if (ratioStr === '9/16') { ratioBox.style.aspectRatio = '9/16'; ratioBox.style.maxWidth = '280px'; } 
            else if (ratioStr === '16/9') { ratioBox.style.aspectRatio = '16/9'; ratioBox.style.maxWidth = '100%'; } 
            else if (ratioStr === '1/1') { ratioBox.style.aspectRatio = '1/1'; ratioBox.style.maxWidth = '360px'; } 
            else if (ratioStr === '4/3') { ratioBox.style.aspectRatio = '4/3'; ratioBox.style.maxWidth = '400px'; }

            showToast(`📐 Ratio: ${ratioStr}`, 'fa-crop-simple');

        // ============================================================
        // ===== TEXT ELEMENT MANAGEMENT (DELETE + DRAG) =====
        // ============================================================

        function createTextElementOnCanvas(text, styleCSS = '', font = 'Inter', bubbleCSS = '') {
            const container = document.getElementById('video-ratio-box');
            const elementsLayer = document.getElementById('canvas-elements-layer');
            const wrapper = document.createElement('div');
            wrapper.className = 'canvas-text-item';
            wrapper.id = `text-${++textElementCounter}`;
            const boxRect = container.getBoundingClientRect();
            const randomX = 20 + Math.random() * 60;
            const randomY = 20 + Math.random() * 60;
            wrapper.style.left = randomX + '%';
            wrapper.style.top = randomY + '%';
            wrapper.style.transform = 'translate(-50%, -50%)';
            const textSpan = document.createElement('span');
            textSpan.className = 'text-content';
            textSpan.innerText = text || 'Enter Text';
            textSpan.style.cssText = `${styleCSS}; font-family: '${font}'; ${bubbleCSS}; opacity: 1;`; // opacity fix
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '×';
            deleteBtn.title = 'Delete text';
            deleteBtn.onclick = (e) => { e.stopPropagation(); deleteTextElement(wrapper.id); };
            wrapper.appendChild(textSpan);
            wrapper.appendChild(deleteBtn);
            elementsLayer.appendChild(wrapper);
            wrapper.style.pointerEvents = 'auto';
            setupDrag(wrapper);
            return wrapper;
        }

        function deleteTextElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.transition = 'all 0.2s';
                el.style.transform = 'scale(0.8)';
                el.style.opacity = '0';
                setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); showToast('🗑️ Text deleted', 'fa-trash'); }, 200);
            }
        }

        function deleteAllTextElements() { document.querySelectorAll('.canvas-text-item').forEach(el => deleteTextElement(el.id)); }

        // ===== DRAG FUNCTIONALITY (FIXED) =====
        function setupDrag(element) {
            let isDragging = false;
            let startX, startY, startLeft, startTop;
            element.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('delete-btn')) return;
                isDragging = true;
                element.classList.add('dragging');
                const rect = element.getBoundingClientRect();
                const containerRect = element.parentElement.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                startLeft = parseFloat(element.style.left) || 50;
                startTop = parseFloat(element.style.top) || 50;
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const containerRect = element.parentElement.getBoundingClientRect();
                const deltaX = (e.clientX - startX) / containerRect.width * 100;
                const deltaY = (e.clientY - startY) / containerRect.height * 100;
                let newLeft = startLeft + deltaX;
                let newTop = startTop + deltaY;
                newLeft = Math.max(0, Math.min(100, newLeft));
                newTop = Math.max(0, Math.min(100, newTop));
                element.style.left = newLeft + '%';
                element.style.top = newTop + '%';
                e.preventDefault();
            });
            document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; element.classList.remove('dragging'); } });
        }

        function applyNewTextToCanvas() {
            const text = document.getElementById('liveTextInput').value || 'Enter Text';
            createTextElementOnCanvas(text, currentTextState.styleCSS, currentTextState.font, currentTextState.bubbleCSS);
            closeDrawer();
            showToast('✏️ Text added to canvas!', 'fa-font');
        }

        function updateLiveTextPreview() {
            const text = document.getElementById('liveTextInput').value || 'Enter Text';
            currentTextState.text = text;
            let previewEl = document.getElementById('live-canvas-text-preview');
            if (!previewEl) {
                previewEl = document.createElement('div');
                previewEl.id = 'live-canvas-text-preview';
                previewEl.className = 'absolute z-45 p-2 select-none pointer-events-none opacity-100';
                const layer = document.getElementById('canvas-elements-layer');
                if (layer) layer.appendChild(previewEl);
            }
            previewEl.style.cssText = `${currentTextState.styleCSS}; font-family: '${currentTextState.font}'; ${currentTextState.bubbleCSS}; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 1; pointer-events: none; z-index: 45;`;
            previewEl.innerText = text;
        }

        // ===== GENERATE 100+ TEMPLATES WITH GROUPS =====
        function generate100Templates() {
            const groups = [
                { name: '🔥 Trending', start: 0, count: 25 },
                { name: '🎨 Artistic', start: 25, count: 25 },
                { name: '💡 Modern', start: 50, count: 25 },
                { name: '🌟 Classic', start: 75, count: 25 }
            ];
            const templates = [];
            const styleNames = ['Neon', 'Glow', 'Shadow', 'Gradient', '3D', 'Glass', 'Chrome', 'Gold', 'Silver', 'Retro', 'Vintage', 'Cyber', 'Hologram', 'Crystal', 'Fire', 'Ice', 'Water', 'Sand', 'Metal', 'Wood', 'Paper', 'Ink', 'Paint', 'Sketch', 'Pixel', 'Vector', 'Minimal', 'Maximal', 'Elegant', 'Bold', 'Soft', 'Dreamy', 'Dark', 'Light', 'Colorful', 'Monochrome', 'Pastel', 'Vibrant', 'Muted'];
            const fonts = ['Inter', 'Bebas Neue', 'Orbitron', 'Pacifico', 'Permanent Marker', 'Lobster', 'Cinzel', 'Bangers', 'Abril Fatface', 'Anton'];
            const words = ['STYLE', 'DESIGN', 'CREATE', 'VISION', 'DREAM', 'LIVE', 'LOVE', 'ART', 'SOUL', 'VIBE', 'GOLD', 'CORE', 'PURE', 'TRUE', 'BOLD', 'WILD', 'FREE', 'STAR', 'MOON', 'SUN'];
            for (let i = 0; i < 100; i++) {
                const style = styleNames[i % styleNames.length];
                const font = fonts[i % fonts.length];
                const word = words[i % words.length];
                const group = groups.find(g => i >= g.start && i < g.start + g.count) || groups[0];
                templates.push({
                    name: `${style} ${word} #${i}`,
                    font: font,
                    styleCSS: generateStyleCSS(style, i),
                    group: group.name
                });
            }
            return templates;
        }

        function generateStyleCSS(style, index) {
            const hue = (index * 37 + 180) % 360;
            const hue2 = (index * 53 + 60) % 360;
            switch(style) {
                case 'Neon': return `color: #fff; text-shadow: 0 0 5px hsl(${hue}, 100%, 50%), 0 0 15px hsl(${hue}, 100%, 50%), 0 0 30px hsl(${hue}, 100%, 50%); font-weight: 900;`;
                case 'Glow': return `color: #fff; text-shadow: 0 0 10px hsl(${hue}, 80%, 60%), 0 0 20px hsl(${hue}, 80%, 60%); font-weight: 700;`;
                case 'Shadow': return `color: #fff; text-shadow: 2px 2px 0 hsl(${hue}, 80%, 30%), 4px 4px 0 hsl(${hue}, 80%, 20%); font-weight: 800;`;
                case 'Gradient': return `background: linear-gradient(45deg, hsl(${hue}, 100%, 50%), hsl(${hue2}, 100%, 50%)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;`;
                case '3D': return `color: hsl(${hue}, 80%, 60%); text-shadow: 0 4px 0 hsl(${hue}, 80%, 30%), 0 8px 0 hsl(${hue}, 80%, 20%), 0 12px 0 hsl(${hue}, 80%, 10%); font-weight: 900;`;
                case 'Glass': return `color: #fff; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);`;
                case 'Gold': return `color: #fbbf24; text-shadow: 0 0 10px #f59e0b, 0 0 20px #f59e0b; font-weight: 900;`;
                case 'Silver': return `color: #94a3b8; text-shadow: 0 0 10px #64748b; font-weight: 700;`;
                case 'Retro': return `color: #fb923c; font-family: 'Press Start 2P'; font-size: 14px; text-shadow: 2px 2px 0 #7c2d12;`;
                case 'Cyber': return `color: #22d3ee; text-shadow: 0 0 5px #06b6d4, 0 0 15px #06b6d4; font-family: 'Orbitron'; font-weight: 900;`;
                default: return `color: hsl(${hue}, 80%, 60%); font-weight: 700;`;
            }
        }

        // ===== 100+ FONTS =====
        function get100Fonts() {
            return ['Inter','Bebas Neue','Lobster','Pacifico','Caveat','Playfair Display','Oswald','Montserrat','Fascinate','Permanent Marker','Righteous','Fredoka One','Alfa Slab One','Bangers','Cinzel','Comfortaa','Courgette','Creepster','Gloria Hallelujah','Great Vibes','Kaushan Script','Luckiest Guy','Monoton','Orbitron','Press Start 2P','Sacramento','Satisfy','Special Elite','Spicy Rice','Titan One','Vampiro One','Abril Fatface','Anton','Archivo Black','Black Ops One','Bungee','Coiny','Exo 2','Francois One','Gravitas One','Josefin Sans','Kanit','Lilita One','Limelight','Megrim','New Rocker','Nosifer','Paytone One','Plaster','Poiret One','Rajdhani','Rampart One','Rancho','Russo One','Sigmar One','Staatliches','Syncopate','Uncial Antiqua','Wallpoet','Big Shoulders Display','Black Han Sans','Chango','Comic Neue','Delius Swash Caps','Emblema One','Fugaz One','Gaegu','Girassol','Hanalei','Henny Penny','Iceberg','Jacques Francois Shadow','Kavoon','Leckerli One','Ma Shan Zheng','Monofett','Overlock','Patua One','Qwigley','Redressed','Shrikhand','Sirin Stencil','Sofia','Sriracha','Stalinist One','Warnes','ZCOOL KuaiLe','Audiowide','Dancing Script','Epilogue','Fira Code','Genos','Hind','Inconsolata','JetBrains Mono','Karla','Lato','Merriweather','Nunito','Open Sans','Poppins','Quicksand','Roboto','Source Sans Pro'];
        }

        // ===== GENERATE STYLES WITH GROUPS =====
        function generate100Styles() {
            const styles = [];
            const groups = ['🎨 Vibrant', '✨ Glowing', '🌈 Gradient', '💎 Premium'];
            for (let i = 0; i < 100; i++) {
                const hue = (i * 29 + 10) % 360;
                const hue2 = (i * 47 + 200) % 360;
                const type = i % 8;
                let css = '';
                switch(type) {
                    case 0: css = `color: hsl(${hue}, 100%, 60%); text-shadow: 0 0 10px hsl(${hue}, 100%, 40%); font-weight: 800;`; break;
                    case 1: css = `background: linear-gradient(135deg, hsl(${hue}, 100%, 50%), hsl(${hue2}, 100%, 50%)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;`; break;
                    case 2: css = `color: #fff; text-shadow: 2px 2px 0 hsl(${hue}, 80%, 40%), 4px 4px 0 hsl(${hue}, 80%, 30%); font-weight: 700;`; break;
                    case 3: css = `color: #fff; text-shadow: 0 0 5px hsl(${hue}, 100%, 50%), 0 0 15px hsl(${hue}, 100%, 50%), 0 0 30px hsl(${hue}, 100%, 50%); font-weight: 900;`; break;
                    case 4: css = `color: hsl(${hue}, 80%, 50%); -webkit-text-stroke: 2px hsl(${hue}, 80%, 30%); font-weight: 900;`; break;
                    case 5: css = `color: hsl(${hue}, 70%, 65%); font-weight: 700; text-shadow: 0 0 20px hsl(${hue}, 70%, 40%);`; break;
                    case 6: css = `background: linear-gradient(45deg, hsl(${hue}, 100%, 50%), hsl(${hue2}, 100%, 50%)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800;`; break;
                    case 7: css = `color: #fff; text-shadow: 0 0 10px #000, 0 0 20px #000, 0 0 5px hsl(${hue}, 100%, 50%); font-weight: 900;`; break;
                }
                const group = groups[i % groups.length];
                styles.push({ css, label: `Style ${i+1}`, group });
            }
            return styles;
        }

        // ===== 100+ ANIMATIONS WITH GROUPS =====
        function get100Animations() {
            const groups = ['🔥 Popular', '✨ Smooth', '💥 Dynamic', '🌀 Creative'];
            const anims = ['Fade In','Bounce','Slide In','Glow Pulse','Rotate','Pulse','Wave','Zoom In','Flip','Shake','Wobble','Swing','Jello','Heartbeat','Flicker','Typing','Reveal','Spin','Drop In','Rise Up','Splash','Explode','Morph','Blur In','Color Shift','Rainbow','Neon Pulse','Cyber Glitch','Matrix','Hologram','Shimmer','Sparkle','Fire','Ice','Wind','Thunder','Gravity','Magnetic','Warp','Ripple','Echo','Ghost','Shadow Dance','Light Burst','Speed Trail','Comet','Nebula','Vortex','Zen','Dream','Cyber','Retro','Modern','Classic','Pop','Rock','Jazz','Blues','Metal','Punk','Grunge','Techno','House','Trance','Dubstep','DnB','LoFi','Ambient','Acoustic','Electric','Digital','Analog','VHS','Film','Reel','Cinema','Theater','Stage','Studio','Live','Night','Day','Sunrise','Sunset','Moon','Star','Galaxy','Universe','Nature','Ocean','Forest','Mountain','Desert','Arctic','Volcano','Storm'];
            return anims.map((a, i) => ({ name: a, group: groups[i % groups.length] }));
        }

        // ===== 100+ BUBBLES WITH GROUPS =====
        function generate100Bubbles() {
            const bubbles = [];
            const groups = ['🫧 Soft', '✨ Glossy', '🌈 Colorful', '💎 Premium'];
            for (let i = 0; i < 100; i++) {
                const hue = (i * 31 + 50) % 360;
                const hue2 = (i * 43 + 180) % 360;
                const type = i % 10;
                let css = '';
                switch(type) {
                    case 0: css = `background: rgba(${hue % 256}, ${(hue+50)%256}, ${(hue+100)%256}, 0.2); border: 2px solid hsl(${hue}, 80%, 60%); border-radius: 12px; padding: 6px 12px;`; break;
                    case 1: css = `background: linear-gradient(135deg, hsl(${hue}, 80%, 60%), hsl(${hue2}, 80%, 60%)); border: none; border-radius: 20px; padding: 6px 14px; color: #fff;`; break;
                    case 2: css = `background: transparent; border: 2px dashed hsl(${hue}, 80%, 60%); border-radius: 8px; padding: 6px 10px;`; break;
                    case 3: css = `background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 8px 16px;`; break;
                    case 4: css = `background: hsl(${hue}, 70%, 20%); border: 2px solid hsl(${hue}, 80%, 50%); border-radius: 50%; padding: 8px 16px; color: #fff;`; break;
                    case 5: css = `background: transparent; border: 2px dotted hsl(${hue}, 80%, 50%); border-radius: 4px; padding: 6px 12px;`; break;
                    case 6: css = `background: radial-gradient(circle at 30% 30%, hsl(${hue}, 80%, 70%), hsl(${hue2}, 80%, 40%)); border: none; border-radius: 12px; padding: 6px 14px; color: #fff;`; break;
                    case 7: css = `background: #1a1a2e; border: 2px solid hsl(${hue}, 100%, 50%); border-radius: 8px; padding: 6px 12px; box-shadow: 0 0 20px hsl(${hue}, 100%, 30%); color: #fff;`; break;
                    case 8: css = `background: linear-gradient(45deg, hsl(${hue}, 80%, 30%), hsl(${hue2}, 80%, 30%)); border: none; border-radius: 4px; padding: 6px 12px; color: #fff;`; break;
                    case 9: css = `background: rgba(0,0,0,0.5); border: 2px solid hsl(${hue}, 80%, 60%); border-radius: 20px; padding: 6px 14px; backdrop-filter: blur(5px); color: #fff;`; break;
                }
                const group = groups[i % groups.length];
                bubbles.push({ css, name: `Bubble ${i+1}`, group });
            }
            return bubbles;
        }

        // ===== RENDER TEXT TAB CONTENT WITH GROUPS AND SEARCH =====
        function renderTextTabContent(tabId) {
            const grid = document.getElementById('drawerDynamicGrid');
            grid.innerHTML = '';
            const container = document.getElementById('drawerDynamicGridContainer');
            let searchHTML = `<div class="group-search-bar"><i class="fas fa-search"></i><input type="text" id="groupSearchInput" placeholder="Search..." oninput="filterGroupItems('${tabId}')"></div>`;
            container.insertAdjacentHTML('afterbegin', searchHTML);

            if (tabId === 'templates') {
                const templates = generate100Templates();
                const groups = [...new Set(templates.map(t => t.group))];
                let html = '';
                groups.forEach(g => {
                    html += `<div class="col-span-4"><span class="group-label">${g}</span></div>`;
                    const items = templates.filter(t => t.group === g);
                    items.forEach((template, idx) => {
                        html += `<div class="asset-card" data-search="${template.name}" data-group="${g}" style="aspect-ratio: auto; height: 80px; justify-content:center;" onclick="applyTemplate('${template.name.replace(/'/g,"\\'")}', '${template.font}', '${template.styleCSS.replace(/'/g,"\\'")}')">
                            <span style="${template.styleCSS}; font-family: '${template.font}'; font-size: 11px; text-align: center; word-break: break-word;">${template.name}</span>
                        </div>`;
                    });
                });
                grid.innerHTML = html;
            } else if (tabId === 'fonts') {
                const fonts = get100Fonts();
                const groups = ['🔤 Sans Serif', '✍️ Script', '🖋️ Display', '📰 Serif'];
                let html = '';
                fonts.forEach((font, i) => {
                    const g = groups[i % groups.length];
                    if (i % 25 === 0) html += `<div class="col-span-4"><span class="group-label">${g}</span></div>`;
                    html += `<div class="font-preview-btn" data-search="${font}" data-group="${g}" onclick="applyFont('${font}')">
                        <span class="font-sample" style="font-family: '${font}';">${font}</span>
                    </div>`;
                });
                grid.innerHTML = html;
            } else if (tabId === 'styles') {
                const styles = generate100Styles();
                const groups = [...new Set(styles.map(s => s.group))];
                let html = '';
                groups.forEach(g => {
                    html += `<div class="col-span-4"><span class="group-label">${g}</span></div>`;
                    const items = styles.filter(s => s.group === g);
                    items.forEach((style, idx) => {
                        html += `<div class="asset-card" data-search="${style.label}" data-group="${g}" onclick="applyStyle('${style.css.replace(/'/g,"\\'")}')" style="aspect-ratio: auto; height: 70px; justify-content:center;">
                            <span style="${style.css}; font-size: 16px; font-weight:bold;">Aa</span>
                        </div>`;
                    });
                });
                grid.innerHTML = html;
            } else if (tabId === 'animations') {
                const animations = get100Animations();
                const groups = [...new Set(animations.map(a => a.group))];
                let html = '';
                groups.forEach(g => {
                    html += `<div class="col-span-4"><span class="group-label">${g}</span></div>`;
                    const items = animations.filter(a => a.group === g);
                    items.forEach((anim, idx) => {
                        html += `<div class="asset-card" data-search="${anim.name}" data-group="${g}" onclick="applyAnimation('${anim.name}')" style="aspect-ratio: auto; height: 70px; justify-content:center;">
                            <span style="font-size:11px; font-weight:600;">${anim.name}</span>
                        </div>`;
                    });
                });
                grid.innerHTML = html;
            } else if (tabId === 'bubbles') {
                const bubbles = generate100Bubbles();
                const groups = [...new Set(bubbles.map(b => b.group))];
                let html = '';
                groups.forEach(g => {
                    html += `<div class="col-span-4"><span class="group-label">${g}</span></div>`;
                    const items = bubbles.filter(b => b.group === g);
                    items.forEach((bubble, idx) => {
                        html += `<div class="asset-card" data-search="${bubble.name}" data-group="${g}" onclick="applyBubble('${bubble.css.replace(/'/g,"\\'")}')" style="aspect-ratio: auto; height: 70px; justify-content:center;">
                            <div style="${bubble.css}; font-size:10px;">${bubble.name}</div>
                        </div>`;
                    });
                });
                grid.innerHTML = html;
            } else if (tabId === 'presets') {
                grid.innerHTML = `<div class="col-span-4 flex flex-col gap-3">
                    <div class="bg-[#18181c] border border-zinc-800 rounded-2xl p-4 text-center">
                        <p class="text-xs text-zinc-400 mb-3">Save your current style, font, and animation setup as a custom preset!</p>
                        <button onclick="saveCurrentPreset()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition">
                            <i class="fas fa-plus mr-1.5"></i>Save Current Design as Preset
                        </button>
                    </div>
                    <div class="text-xs font-bold text-zinc-400">Your Saved Presets:</div>
                    <div id="savedPresetsList" class="grid grid-cols-2 gap-3"></div>
                </div>`;
                renderSavedPresets();
            }
            // Remove duplicate search bar if any
            const existingSearch = container.querySelector('.group-search-bar');
            if (!existingSearch) {
                container.insertAdjacentHTML('afterbegin', searchHTML);
            }
        }

        // ===== FILTER GROUP ITEMS (SEARCH) =====
        function filterGroupItems(tabId) {
            const input = document.getElementById('groupSearchInput');
            if (!input) return;
            const query = input.value.toLowerCase();
            const items = document.querySelectorAll('#drawerDynamicGrid .asset-card, #drawerDynamicGrid .font-preview-btn');
            items.forEach(el => {
                const searchText = el.dataset.search ? el.dataset.search.toLowerCase() : '';
                const groupText = el.dataset.group ? el.dataset.group.toLowerCase() : '';
                if (searchText.includes(query) || groupText.includes(query)) {
                    el.style.display = 'flex';
                } else {
                    el.style.display = 'none';
                }
            });
        }

        // ===== APPLY FUNCTIONS =====
        function applyTemplate(name, font, styleCSS) {
            currentTextState.text = name;
            currentTextState.font = font;
            currentTextState.styleCSS = styleCSS;
            document.getElementById('liveTextInput').value = name;
            updateLiveTextPreview();
            showToast(`🎨 Template: ${name}`, 'fa-palette');
        }

        function applyFont(font) {
            currentTextState.font = font;
            updateLiveTextPreview();
            showToast(`🔤 Font: ${font}`, 'fa-font');
        }

        function applyStyle(css) {
            currentTextState.styleCSS = css;
            updateLiveTextPreview();
            showToast(`🎨 Style applied`, 'fa-paint-brush');
        }

        function applyAnimation(anim) {
            currentTextState.animation = anim;
            const previewEl = document.getElementById('live-canvas-text-preview');
            if (previewEl) {
                let animCSS = '';
                switch(anim) {
                    case 'Fade In': animCSS = 'animation: textFadeIn 0.5s ease-out;'; break;
                    case 'Bounce': animCSS = 'animation: textBounce 0.6s ease-in-out infinite;'; break;
                    case 'Slide In': animCSS = 'animation: textSlideIn 0.5s ease-out;'; break;
                    case 'Glow Pulse': animCSS = 'animation: textGlow 1.5s ease-in-out infinite;'; break;
                    case 'Rotate': animCSS = 'animation: textRotate 0.3s ease-in-out infinite alternate;'; break;
                    case 'Pulse': animCSS = 'animation: textPulse 1s ease-in-out infinite;'; break;
                    case 'Wave': animCSS = 'animation: textWave 0.5s ease-in-out infinite;'; break;
                    case 'Shake': animCSS = 'animation: textShake 0.3s ease-in-out infinite;'; break;
                    case 'Flip': animCSS = 'animation: textFlip 0.6s ease-in-out;'; break;
                    case 'Zoom In': animCSS = 'animation: textZoom 0.4s ease-out;'; break;
                    case 'Neon Pulse': animCSS = 'animation: textNeonPulse 1.5s ease-in-out infinite;'; break;
                    case 'Rainbow': animCSS = 'animation: textRainbow 2s linear infinite;'; break;
                    default: animCSS = 'animation: textFadeIn 0.4s ease-out;';
                }
                previewEl.style.cssText = `${currentTextState.styleCSS}; font-family: '${currentTextState.font}'; ${currentTextState.bubbleCSS}; ${animCSS}`;
            }
            showToast(`✨ "${anim}" animation applied!`, 'fa-wand-magic-sparkles');
        }

        function applyBubble(css) {
            currentTextState.bubbleCSS = css;
            updateLiveTextPreview();
            showToast(`🫧 Bubble applied`, 'fa-circle');
        }

        // ===== SAVE/LOAD PRESETS =====
        function saveCurrentPreset() {
            const presetName = `Preset #${customPresets.length + 1}`;
            const newPreset = { name: presetName, font: currentTextState.font, styleCSS: currentTextState.styleCSS, bubbleCSS: currentTextState.bubbleCSS, animation: currentTextState.animation };
            customPresets.push(newPreset);
            showToast(`💾 "${presetName}" saved!`, 'fa-save');
            renderSavedPresets();
        }

        function renderSavedPresets() {
            const listContainer = document.getElementById('savedPresetsList');
            if (!listContainer) return;
            if (customPresets.length === 0) {
                listContainer.innerHTML = `<div class="text-zinc-600 text-xs col-span-2 py-4 text-center">No presets saved yet.</div>`;
                return;
            }
            listContainer.innerHTML = '';
            customPresets.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = 'bg-[#22222a] border border-zinc-800 rounded-xl p-3 cursor-pointer hover:border-blue-500 transition text-center';
                item.innerHTML = `<span class="text-[8px] text-zinc-400 block font-mono mb-1">Preset ${idx + 1}</span>
                    <span class="text-xs font-bold block truncate" style="${p.styleCSS}; font-family: '${p.font}';">${p.name}</span>`;
                item.onclick = () => {
                    currentTextState.font = p.font;
                    currentTextState.styleCSS = p.styleCSS;
                    currentTextState.bubbleCSS = p.bubbleCSS;
                    updateLiveTextPreview();
                    showToast(`📂 "${p.name}" loaded!`, 'fa-folder-open');
                };
                listContainer.appendChild(item);
            });
        }

        function closeDrawer() { document.getElementById('editorDrawer').classList.remove('open'); }

        // ===== CANVAS DRAWING =====
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let brushSize = 5;
        let drawActive = false;

        function syncCanvasSize() { canvas.width = ratioBox.clientWidth; canvas.height = ratioBox.clientHeight; }
        window.addEventListener('resize', syncCanvasSize);

        function toggleDraw() {
            drawActive = !drawActive;
            const panel = document.getElementById('drawToolsPanel');
            if (drawActive) { canvas.classList.add('active'); panel.classList.remove('hidden'); panel.classList.add('flex'); syncCanvasSize(); showToast('✏️ Drawing mode ON', 'fa-pen'); } 
            else { canvas.classList.remove('active'); panel.classList.add('hidden'); showToast('✏️ Drawing mode OFF', 'fa-pen'); }
        }

        function clearDraw() { ctx.clearRect(0, 0, canvas.width, canvas.height); showToast('🧹 Canvas cleared', 'fa-eraser'); }
        function setBrush(size) { brushSize = size; showToast(`🖌️ Brush: ${size}px`, 'fa-paintbrush'); }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; draw(e); });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => isDrawing = false);

        function draw(e) {
            if (!isDrawing || !drawActive) return;
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#3b82f6';
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // ===== EXPORT =====
        function showExportDialog() { document.getElementById('exportDialog').classList.remove('hidden'); }
        function closeExportDialog() { document.getElementById('exportDialog').classList.add('hidden'); }
        function exportProject(type) {
            const trackCount = audioTracks.length;
            let message = `📦 Exporting ${type.toUpperCase()}...\nAudio tracks included: ${trackCount}\n`;
            if (trackCount > 0) { message += '\nTracks:\n'; audioTracks.forEach((t, i) => { message += `  ${i+1}. ${t.name}\n`; }); } else { message += '\n⚠️ No audio tracks in project'; }
            message += `\n\n✅ Export complete!`;
            alert(message);
            closeExportDialog();
            showToast(`📤 Exporting ${type}...`, 'fa-download');
        }

        // ===== INITIALIZATION =====
        setTimeout(syncCanvasSize, 300);
        updateTrackCount();

        // Remove auto "hi DeepSeek" — now shows "Enter Text" only
        setTimeout(() => {
            // no default text element created
            document.getElementById('liveTextInput').value = 'Enter Text';
            showToast('🚀 Welcome to Dravoo Pro Studio!', 'fa-rocket');
        }, 500);
        
        console.log('🚀 Dravoo Pro Editor Loaded with Groups & Search!');
    </script>
