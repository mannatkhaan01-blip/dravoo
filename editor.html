<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dravoo · Editor</title>
    <!-- Tailwind + Font Awesome + Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <!-- Same fonts as original but simplified for performance -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0b0e;
            color: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(16, 16, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #2a2a30;
        }
        /* custom scroll */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 12px;
        }

        /* drawer */
        .editor-drawer {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            max-width: 100%;
            height: 54vh;
            background: #111115;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            border-top: 1px solid #2a2a32;
            transition: bottom 0.35s cubic-bezier(0.16, 0.76, 0.36, 0.98);
            z-index: 200;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.9);
        }
        .editor-drawer.open {
            bottom: 0;
        }
        .drawer-header {
            display: flex;
            align-items: center;
            padding: 16px 20px 12px 20px;
            border-bottom: 1px solid #22222a;
            gap: 12px;
        }
        .drawer-tabs {
            display: flex;
            overflow-x: auto;
            padding: 8px 16px;
            gap: 6px;
            border-bottom: 1px solid #1e1e24;
            flex-shrink: 0;
        }
        .drawer-tabs::-webkit-scrollbar {
            display: none;
        }
        .tab-link {
            background: transparent;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #9ca3af;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 30px;
            white-space: nowrap;
        }
        .tab-link.active {
            background: #1f2937;
            color: #fff;
        }
        .tab-content-container {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
        }
        .content-panel {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        @media(min-width: 500px) {
            .content-panel {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        .content-panel.active {
            display: grid;
        }
        .asset-card {
            background: #1c1c22;
            border-radius: 14px;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #e5e7eb;
            border: 1px solid #2c2c34;
            transition: 0.15s;
            padding: 6px;
            text-align: center;
        }
        .asset-card:hover {
            transform: scale(1.02);
            border-color: #3b82f6;
            background: #26262e;
        }

        /* canvas overlay */
        .canvas-text-overlay {
            position: absolute;
            color: #fff;
            font-weight: 700;
            font-size: 26px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
            cursor: move;
            user-select: none;
            padding: 4px 10px;
            border: 1px dashed transparent;
            z-index: 20;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .canvas-text-overlay.active-node {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.12);
        }
        .canvas-sticker-overlay {
            position: absolute;
            font-size: 48px;
            cursor: move;
            user-select: none;
            z-index: 21;
            padding: 6px;
            border: 1px dashed transparent;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 16px;
        }
        .canvas-sticker-overlay.active-node {
            border-color: #ec4899;
            background: rgba(236, 72, 153, 0.15);
        }

        /* draw overlay */
        .draw-overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            pointer-events: none;
            touch-action: none;
            display: block;
        }
        .draw-overlay-canvas.active {
            pointer-events: auto;
        }
        .draw-tools-panel {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            background: rgba(12, 12, 16, 0.92);
            backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 10px 16px;
            border: 1px solid #2a2a32;
            display: none;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            width: max-content;
            max-width: 92%;
        }
        .draw-tools-panel.active {
            display: flex;
        }
        .draw-tool-btn {
            background: #25252c;
            border: none;
            border-radius: 30px;
            padding: 6px 12px;
            color: #ddd;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .draw-tool-btn:hover {
            background: #33333e;
        }
        .draw-tool-btn.active {
            background: #3b82f6;
            color: #fff;
        }
        .draw-tool-btn.eraser-active {
            background: #ef4444;
            color: #fff;
        }
        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.15s;
        }
        .color-dot:hover {
            transform: scale(1.12);
        }
        .color-dot.active {
            border-color: #fff;
        }
        .color-picker-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.15s;
        }
        .color-picker-btn.active {
            border-color: #fff;
        }

        /* bottom menu */
        .bottom-menu {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0px;
            background: #0e0e12;
            border-top: 1px solid #22222a;
            padding: 6px 0 8px 0;
        }
        .bottom-menu button {
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 0;
            transition: 0.15s;
            cursor: pointer;
        }
        .bottom-menu button i {
            font-size: 18px;
        }
        .bottom-menu button:hover {
            color: #fff;
        }

        .timeline-track {
            background: #131318;
            border: 1px solid #24242c;
            border-radius: 18px;
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
            position: relative;
        }
        .timeline-cursor {
            position: absolute;
            top: 2px;
            bottom: 2px;
            width: 2.5px;
            background: #facc15;
            left: 30%;
            border-radius: 4px;
            z-index: 5;
        }
        .play-btn {
            background: #1e1e26;
            border: 1px solid #33333e;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1f5f9;
            cursor: pointer;
            transition: 0.15s;
        }
        .play-btn:hover {
            background: #2a2a34;
            transform: scale(1.04);
        }

        /* image style */
        .cap-gradient {
            background: linear-gradient(135deg, #2563eb, #db2777);
        }
        .bg-dark-void {
            background: #0b0b0e;
        }
    </style>
</head>
<body>

    <!-- Hidden file input -->
    <input type="file" id="video-file-picker" accept="video/*,image/*" class="hidden" />

    <!-- Top navbar (minimal) -->
    <header class="flex items-center justify-between px-5 py-3 bg-[#0b0b0e] border-b border-[#1e1e26]">
        <div class="flex items-center gap-3">
            <i class="fas fa-clapperboard text-blue-500 text-xl"></i>
            <span class="font-black text-lg tracking-tight text-white">DRAVOO</span>
            <span class="text-[10px] font-medium text-zinc-500 bg-zinc-800/60 px-2 py-0.5 rounded-full">Editor</span>
        </div>
        <button onclick="window.location.href='index.html'" class="text-xs text-zinc-400 hover:text-white bg-zinc-800/40 px-3 py-1.5 rounded-full"><i class="fas fa-home mr-1.5"></i>Home</button>
    </header>

    <!-- Main editor card -->
    <main class="max-w-3xl mx-auto px-3 my-5">
        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">

            <!-- Top bar: project + export -->
            <div class="flex items-center justify-between px-4 py-2.5 bg-[#0e0e12] border-b border-[#1f1f26]">
                <div class="flex items-center gap-2 text-sm">
                    <span class="text-white font-semibold">Project: Untitled</span>
                    <span class="text-[10px] bg-zinc-800/70 px-2 py-0.5 rounded-full text-zinc-300">draft</span>
                </div>
                <div class="flex items-center gap-3">
                    <select class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-300 rounded-full px-3 py-1.5 outline-none">
                        <option>4K UHD</option>
                        <option selected>1080p</option>
                        <option>720p</option>
                    </select>
                    <button onclick="triggerExport()" class="bg-blue-500 hover:bg-blue-400 text-white text-xs font-bold px-4 py-1.5 rounded-full transition">Export</button>
                </div>
            </div>

            <!-- Canvas -->
            <div id="canvas-container" class="relative aspect-[9/16] max-h-[480px] bg-black flex items-center justify-center overflow-hidden border-b border-[#1c1c24]">
                <video id="studio-player" loop class="w-full h-full object-contain hidden"></video>
                <img id="studio-image" class="w-full h-full object-contain hidden" alt="preview" />
                <div id="media-placeholder" class="text-center p-6">
                    <i class="fas fa-cloud-arrow-up text-5xl text-zinc-700 mb-3"></i>
                    <p class="text-sm text-zinc-500 mb-4">Upload video or image</p>
                    <button onclick="document.getElementById('video-file-picker').click()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-6 py-2.5 rounded-full transition"><i class="fas fa-plus mr-2"></i>Add Media</button>
                </div>
                <canvas id="drawCanvas" class="draw-overlay-canvas"></canvas>
                <!-- Draw tools panel (floating bottom) -->
                <div id="drawToolsPanel" class="draw-tools-panel">
                    <button class="draw-tool-btn active" data-size="2" onclick="setBrush(2)">Thin</button>
                    <button class="draw-tool-btn" data-size="6" onclick="setBrush(6)">Med</button>
                    <button class="draw-tool-btn" data-size="14" onclick="setBrush(14)">Thick</button>
                    <button class="draw-tool-btn" data-size="0" onclick="toggleEraser()" id="eraserBtn">🧹</button>
                    <div class="flex gap-1.5" id="drawColorPalette"></div>
                    <button onclick="clearDraw()" class="text-xs bg-red-600/80 hover:bg-red-500 text-white px-3 py-1 rounded-full">Clear</button>
                    <button onclick="toggleDraw()" class="text-xs bg-zinc-700 hover:bg-zinc-600 text-white px-3 py-1 rounded-full">✕</button>
                </div>
            </div>

            <!-- Transport + timeline -->
            <div class="px-4 py-3 bg-[#0c0c10] border-b border-[#1a1a22] flex items-center justify-between">
                <span id="timeDisplay" class="text-xs font-mono text-zinc-400">00:00 / 00:05</span>
                <button id="playBtn" onclick="togglePlay()" class="play-btn"><i class="fas fa-play text-sm"></i></button>
                <div class="flex gap-2">
                    <button onclick="toggleDraw()" class="text-zinc-400 hover:text-white text-sm bg-zinc-800/40 px-3 py-1.5 rounded-full"><i class="fas fa-pen mr-1.5"></i>Draw</button>
                </div>
            </div>

            <!-- Timeline -->
            <div class="px-4 py-3 bg-[#0a0a0e] border-b border-[#1a1a22]">
                <div class="timeline-track">
                    <div class="timeline-cursor"></div>
                    <i class="fas fa-video text-blue-400 text-xs"></i>
                    <span id="timelineLabel" class="text-[10px] font-mono text-zinc-400 truncate">media_track.mp4</span>
                    <button onclick="document.getElementById('video-file-picker').click()" class="ml-auto text-zinc-500 hover:text-white bg-zinc-800/60 px-3 py-1 rounded-full text-xs"><i class="fas fa-plus mr-1"></i>Add</button>
                </div>
                <div onclick="switchToText()" class="mt-2.5 flex items-center gap-2 px-2 py-1.5 rounded-full bg-[#13131a] border border-[#22222a] cursor-pointer hover:bg-[#1c1c26] transition">
                    <i class="fas fa-font text-amber-400 text-sm"></i>
                    <span class="text-xs font-medium text-zinc-300">+ Add text</span>
                </div>
            </div>

            <!-- Bottom menu (6 icons, matches 2nd image) -->
            <div class="bottom-menu">
                <button onclick="openDrawer('templates')"><i class="fas fa-paste"></i><span>Templates</span></button>
                <button onclick="openDrawer('fonts')"><i class="fas fa-font"></i><span>Fonts</span></button>
                <button onclick="openDrawer('styles')"><i class="fas fa-palette"></i><span>Styles</span></button>
                <button onclick="openDrawer('stickers')"><i class="fas fa-face-smile"></i><span>Stickers</span></button>
                <button onclick="toggleDraw()"><i class="fas fa-pen-fancy"></i><span>Draw</span></button>
                <button onclick="openDrawer('captions')"><i class="fas fa-closed-captioning"></i><span>Captions</span></button>
            </div>

            <!-- Hidden text submenu (shown when "Add text" clicked) -->
            <div id="textSubmenu" class="hidden grid grid-cols-5 gap-1 px-3 py-2.5 bg-[#0c0c10] border-t border-[#1a1a22] text-xs text-zinc-400">
                <button onclick="hideTextSubmenu()" class="flex flex-col items-center hover:text-white"><i class="fas fa-chevron-left text-sm"></i><span>Back</span></button>
                <button onclick="openDrawer('fonts')" class="flex flex-col items-center hover:text-amber-400"><i class="fas fa-plus"></i><span>Add text</span></button>
                <button onclick="openDrawer('templates')" class="flex flex-col items-center hover:text-purple-400"><i class="fas fa-paste"></i><span>Templates</span></button>
                <button onclick="openDrawer('stickers')" class="flex flex-col items-center hover:text-pink-400"><i class="fas fa-face-smile"></i><span>Stickers</span></button>
                <button onclick="toggleDraw()" class="flex flex-col items-center hover:text-teal-400"><i class="fas fa-pen-fancy"></i><span>Draw</span></button>
            </div>
        </div>
    </main>

    <!-- ========== EDITOR DRAWER ========== -->
    <div class="editor-drawer" id="editorDrawer">
        <div class="drawer-header">
            <button class="text-zinc-400 hover:text-white text-lg" onclick="closeDrawer()">✕</button>
            <input type="text" id="drawerInput" class="flex-1 bg-zinc-800 border-0 rounded-2xl px-4 py-2.5 text-sm text-white outline-none focus:ring-1 focus:ring-blue-500" placeholder="Type text..." />
            <button class="text-blue-500 font-bold text-sm px-3" onclick="closeDrawer()">✓</button>
        </div>
        <div class="drawer-tabs">
            <button class="tab-link active" onclick="switchPanel('templates')">Templates</button>
            <button class="tab-link" onclick="switchPanel('fonts')">Fonts</button>
            <button class="tab-link" onclick="switchPanel('styles')">Styles</button>
            <button class="tab-link" onclick="switchPanel('stickers')">Stickers</button>
            <button class="tab-link" onclick="switchPanel('captions')">Captions</button>
        </div>
        <div class="tab-content-container">
            <div class="content-panel active" id="panel-templates"></div>
            <div class="content-panel" id="panel-fonts"></div>
            <div class="content-panel" id="panel-styles">
                <div class="col-span-full space-y-4">
                    <p class="text-xs text-zinc-400 font-medium">Text color</p>
                    <div class="flex flex-wrap gap-2" id="colorPalette"></div>
                    <p class="text-xs text-zinc-400 font-medium">Size</p>
                    <input type="range" min="14" max="72" value="28" class="w-full accent-blue-500" oninput="applySize(this.value)" />
                    <p class="text-xs text-zinc-400 font-medium">Opacity</p>
                    <input type="range" min="0.1" max="1" step="0.05" value="1" class="w-full accent-blue-500" oninput="applyOpacity(this.value)" />
                </div>
            </div>
            <div class="content-panel" id="panel-stickers"></div>
            <div class="content-panel" id="panel-captions">
                <div class="col-span-full text-center text-zinc-500 py-6 text-sm">Captions & auto-sync coming soon</div>
            </div>
        </div>
    </div>

    <script>
        // ========== CORE EDITOR LOGIC ==========
        const picker = document.getElementById('video-file-picker');
        const player = document.getElementById('studio-player');
        const imageEl = document.getElementById('studio-image');
        const placeholder = document.getElementById('media-placeholder');
        const timelineLabel = document.getElementById('timelineLabel');
        const playBtn = document.getElementById('playBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const container = document.getElementById('canvas-container');
        const drawer = document.getElementById('editorDrawer');
        const drawerInput = document.getElementById('drawerInput');

        let activeTextNode = null;

        // ---- media handling ----
        picker.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            timelineLabel.innerText = file.name;
            placeholder.classList.add('hidden');
            if (file.type.startsWith('video/')) {
                imageEl.classList.add('hidden');
                player.classList.remove('hidden');
                player.src = URL.createObjectURL(file);
                player.play();
                playBtn.innerHTML = `<i class="fas fa-pause text-sm"></i>`;
                player.ontimeupdate = () => {
                    timeDisplay.innerText = `${fmt(player.currentTime)} / ${fmt(player.duration || 0)}`;
                };
            } else if (file.type.startsWith('image/')) {
                player.classList.add('hidden');
                player.pause();
                imageEl.classList.remove('hidden');
                imageEl.src = URL.createObjectURL(file);
                timeDisplay.innerText = "00:00 / 00:05";
            }
            initDrawCanvas();
        });

        function fmt(s) { if (isNaN(s)) return "00:00"; return `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`; }
        function togglePlay() {
            if (player.paused) { player.play();
                playBtn.innerHTML = `<i class="fas fa-pause text-sm"></i>`; } else { player.pause();
                playBtn.innerHTML = `<i class="fas fa-play text-sm"></i>`; }
        }
        function triggerExport() { alert('Exporting project... (demo)'); }

        // ---- text submenu ----
        function switchToText() {
            document.querySelector('.bottom-menu').classList.add('hidden');
            document.getElementById('textSubmenu').classList.remove('hidden');
            document.getElementById('textSubmenu').classList.add('grid');
        }

        function hideTextSubmenu() {
            document.querySelector('.bottom-menu').classList.remove('hidden');
            document.getElementById('textSubmenu').classList.add('hidden');
            document.getElementById('textSubmenu').classList.remove('grid');
        }

        // ---- drawer ----
        function openDrawer(tab) { drawer.classList.add('open');
            switchPanel(tab); }
        function closeDrawer() { drawer.classList.remove('open'); }

        function switchPanel(pid) {
            document.querySelectorAll('.tab-link').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(`panel-${pid}`);
            if (target) target.classList.add('active');
            const btn = Array.from(document.querySelectorAll('.tab-link')).find(b => b.innerText.toLowerCase() === pid.toLowerCase());
            if (btn) btn.classList.add('active');
            if (pid === 'templates') fillTemplates();
            if (pid === 'fonts') fillFonts();
            if (pid === 'stickers') fillStickers();
            if (pid === 'styles') fillColors();
        }

        // ---- templates, fonts, stickers ----
        function fillTemplates() {
            const panel = document.getElementById('panel-templates');
            if (panel.children.length > 0) return;
            const names = ['ABC Smart', 'Neon Glow', 'Satisfy', 'Great Vibes', 'Alex Brush', 'Allura', 'Pacifico', 'Dancing Script',
                'Zeyada', 'Parisienne', 'Tangerine', 'Architects', 'Indie Flower', 'Patrick Hand', 'Kaushan Script', 'Mr Dafoe',
                'Rock Salt', 'Caveat Brush', 'Sacramento', 'Marck Script', 'Rochester', 'WindSong', 'Grand Hotel', 'Meddon', 'Coming Soon'
            ];
            const styles = [
                "font-family:'Bangers';color:#ffcc00;text-shadow:2px 2px 0 #000;",
                "font-family:'Oswald';color:#00f3ff;text-shadow:0 0 10px #00f3ff;",
                "font-family:'Satisfy';color:#6c5ce7;font-size:32px;",
                "font-family:'Great Vibes';color:#fdcb6e;font-size:36px;",
                "font-family:'Alex Brush';color:#a29bfe;font-size:34px;",
                "font-family:'Allura';color:#f8a5c2;font-size:36px;",
                "font-family:'Pacifico';color:#00cec9;font-size:32px;",
                "font-family:'Dancing Script';color:#fd79a8;font-size:34px;",
                "font-family:'Zeyada';color:#e84393;font-size:34px;",
                "font-family:'Parisienne';color:#ff758c;font-size:32px;",
                "font-family:'Tangerine';color:#fdcb6e;font-size:34px;",
                "font-family:'Architects Daughter';color:#2d3436;font-size:24px;",
                "font-family:'Indie Flower';color:#0984e3;font-size:28px;",
                "font-family:'Patrick Hand';color:#00b894;font-size:26px;",
                "font-family:'Kaushan Script';color:#e17055;font-size:30px;",
                "font-family:'Mr Dafoe';color:#fab1a0;font-size:38px;",
                "font-family:'Rock Salt';color:#2d3436;font-size:22px;",
                "font-family:'Caveat Brush';color:#ff7675;font-size:28px;",
                "font-family:'Sacramento';color:#6c5ce7;font-size:34px;",
                "font-family:'Marck Script';color:#00f3ff;font-size:28px;",
                "font-family:'Rochester';color:#d4af37;font-size:30px;",
                "font-family:'WindSong';color:#48dbfb;font-size:30px;",
                "font-family:'Grand Hotel';color:#f368e0;font-size:34px;",
                "font-family:'Meddon';color:#f8a5c2;font-size:28px;",
                "font-family:'Coming Soon';color:#54a0ff;font-size:24px;"
            ];
            for (let i = 0; i < Math.min(names.length, 30); i++) {
                const card = document.createElement('div');
                card.className = 'asset-card';
                card.innerText = names[i];
                card.style.cssText = styles[i % styles.length] + 'cursor:pointer;';
                card.onclick = () => addTextNode(names[i], styles[i % styles.length]);
                panel.appendChild(card);
            }
        }

        function fillFonts() {
            const panel = document.getElementById('panel-fonts');
            if (panel.children.length > 0) return;
            const fonts = ['Rubik', 'Bangers', 'Oswald', 'Anton', 'Permanent Marker', 'Lobster', 'Pacifico', 'Dancing Script',
                'Great Vibes', 'Satisfy', 'Kaushan Script', 'Mr Dafoe', 'Architects Daughter', 'Indie Flower', 'Patrick Hand',
                'Rock Salt', 'Alex Brush', 'Allura', 'Caveat Brush', 'Sacramento', 'Tangerine', 'WindSong', 'Grand Hotel', 'Zeyada',
                'Coming Soon'
            ];
            fonts.forEach(f => {
                const card = document.createElement('div');
                card.className = 'asset-card';
                card.style.fontFamily = f;
                card.innerText = f;
                card.onclick = () => { if (activeTextNode) activeTextNode.style.fontFamily = f; };
                panel.appendChild(card);
            });
        }

        function fillStickers() {
            const panel = document.getElementById('panel-stickers');
            if (panel.children.length > 0) return;
            const emojis = ['🔥', '✨', '🎯', '❤️', '👑', '🚀', '💥', '😂', '💯', '🎉', '🌟', '👍', '🙌', '💀', '🤖', '🎃', '😈', '👀', '🎮', '🎨',
                '🎬', '⚡', '💡', '🔮', '💎', '💰', '🌍', '🍕', '🍔', '🎵', '🎤', '🎸', '🐾', '🦄', '🐼', '🦊', '🐰', '🐻', '🐺', '💖', '💙', '💚',
                '💛', '🌸', '🌺', '🌻', '🌹'
            ];
            emojis.slice(0, 30).forEach(e => {
                const card = document.createElement('div');
                card.className = 'asset-card text-3xl';
                card.innerText = e;
                card.onclick = () => addSticker(e);
                panel.appendChild(card);
            });
        }

        function fillColors() {
            const palette = document.getElementById('colorPalette');
            if (palette.children.length > 0) return;
            const colors = ['#ffffff', '#ff3b30', '#ffcc00', '#4cd964', '#3b82f6', '#e02424', '#9333ea', '#06b6d4', '#f472b6',
                '#fb923c', '#22c55e', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#6366f1', '#000000'
            ];
            colors.forEach(c => {
                const dot = document.createElement('div');
                dot.className = 'color-dot';
                dot.style.background = c;
                dot.onclick = () => { if (activeTextNode) activeTextNode.style.color = c; };
                palette.appendChild(dot);
            });
        }

        // ---- Text & sticker nodes ----
        function addTextNode(text, style) {
            const el = document.createElement('div');
            el.className = 'canvas-text-overlay active-node';
            el.innerText = text || 'Text';
            el.style.left = (20 + Math.random() * 40) + '%';
            el.style.top = (25 + Math.random() * 40) + '%';
            if (style) el.style.cssText += style;
            el.addEventListener('click', e => { e.stopPropagation();
                selectNode(el); });
            el.addEventListener('dblclick', () => { if (confirm('Delete text?')) { el.remove(); if (activeTextNode === el) activeTextNode =
                        null; } });
            makeDraggable(el);
            container.appendChild(el);
            selectNode(el);
            drawerInput.value = el.innerText;
            closeDrawer();
        }

        function addSticker(emoji) {
            const el = document.createElement('div');
            el.className = 'canvas-sticker-overlay active-node';
            el.innerText = emoji || '😊';
            el.style.left = (30 + Math.random() * 30) + '%';
            el.style.top = (30 + Math.random() * 30) + '%';
            el.addEventListener('click', e => { e.stopPropagation();
                selectNode(el); });
            el.addEventListener('dblclick', () => { if (confirm('Delete sticker?')) { el.remove(); if (activeTextNode === el) activeTextNode =
                        null; } });
            makeDraggable(el);
            container.appendChild(el);
            selectNode(el);
            closeDrawer();
        }

        function selectNode(el) {
            document.querySelectorAll('.canvas-text-overlay,.canvas-sticker-overlay').forEach(x => x.classList.remove(
            'active-node'));
            el.classList.add('active-node');
            activeTextNode = el;
            if (el.classList.contains('canvas-text-overlay')) drawerInput.value = el.innerText;
        }

        function makeDraggable(el) {
            let dx, dy, dragging = false;
            const start = (e) => {
                e = e || window.event;
                const ev = e.touches ? e.touches[0] : e;
                dx = ev.clientX - el.getBoundingClientRect().left;
                dy = ev.clientY - el.getBoundingClientRect().top;
                dragging = true;
                document.addEventListener('mousemove', move);
                document.addEventListener('touchmove', move, { passive: false });
                document.addEventListener('mouseup', end);
                document.addEventListener('touchend', end);
            };
            const move = (e) => {
                if (!dragging) return;
                e.preventDefault();
                const ev = e.touches ? e.touches[0] : e;
                const rect = container.getBoundingClientRect();
                let x = ev.clientX - rect.left - dx;
                let y = ev.clientY - rect.top - dy;
                x = Math.max(0, Math.min(x, rect.width - el.offsetWidth));
                y = Math.max(0, Math.min(y, rect.height - el.offsetHeight));
                el.style.left = x + 'px';
                el.style.top = y + 'px';
            };
            const end = () => { dragging = false;
                document.removeEventListener('mousemove', move);
                document.removeEventListener('touchmove', move);
                document.removeEventListener('mouseup', end);
                document.removeEventListener('touchend', end); };
            el.addEventListener('mousedown', start);
            el.addEventListener('touchstart', start, { passive: false });
        }

        function applySize(v) { if (activeTextNode) activeTextNode.style.fontSize = v + 'px'; }

        function applyOpacity(v) { if (activeTextNode) activeTextNode.style.opacity = v; }

        // ---- DRAW ----
        let drawCanvas, ctx, isDrawing = false,
            brushSize = 6,
            drawColor = '#ffffff',
            eraser = false,
            drawActive = false;

        function initDrawCanvas() {
            drawCanvas = document.getElementById('drawCanvas');
            if (!drawCanvas) return;
            const rect = container.getBoundingClientRect();
            drawCanvas.width = rect.width || 400;
            drawCanvas.height = rect.height || 700;
            ctx = drawCanvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            // color palette for draw
            const pal = document.getElementById('drawColorPalette');
            if (pal.children.length === 0) {
                ['#ffffff', '#ff3b30', '#ffcc00', '#4cd964', '#3b82f6', '#e02424', '#9333ea', '#06b6d4', '#f472b6', '#fb923c',
                    '#22c55e', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#6366f1'
                ].forEach(c => {
                    const b = document.createElement('button');
                    b.className = 'color-picker-btn';
                    b.style.background = c;
                    b.onclick = () => { document.querySelectorAll('#drawColorPalette .color-picker-btn').forEach(x => x
                            .classList.remove('active'));
                        b.classList.add('active');
                        drawColor = c;
                        eraser = false;
                        document.getElementById('eraserBtn').classList.remove('eraser-active'); };
                    pal.appendChild(b);
                });
                pal.firstChild?.classList.add('active');
            }
            drawCanvas.addEventListener('mousedown', startDraw);
            drawCanvas.addEventListener('mousemove', drawMove);
            drawCanvas.addEventListener('mouseup', endDraw);
            drawCanvas.addEventListener('mouseleave', endDraw);
            drawCanvas.addEventListener('touchstart', touchStart);
            drawCanvas.addEventListener('touchmove', touchMove);
            drawCanvas.addEventListener('touchend', endDraw);
        }

        function getPos(e) {
            const rect = drawCanvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (drawCanvas.width / rect.width);
            const y = (e.clientY - rect.top) * (drawCanvas.height / rect.height);
            return { x, y };
        }

        function startDraw(e) { if (!drawActive) return;
            isDrawing = true; const p = getPos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y); }

        function drawMove(e) { if (!isDrawing || !drawActive) return; const p = getPos(e);
            ctx.lineWidth = eraser ? brushSize * 2.5 : brushSize;
            ctx.lineCap = 'round';
            ctx.globalCompositeOperation = eraser ? 'destination-out' : 'source-over';
            ctx.strokeStyle = eraser ? 'rgba(0,0,0,1)' : drawColor;
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(p.x, p.y); }

        function endDraw() { isDrawing = false;
            ctx.beginPath(); }

        function touchStart(e) { e.preventDefault(); const t = e.touches[0];
            drawCanvas.dispatchEvent(new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY })); }

        function touchMove(e) { e.preventDefault(); const t = e.touches[0];
            drawCanvas.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY })); }

        function toggleDraw() {
            drawActive = !drawActive;
            document.getElementById('drawToolsPanel').classList.toggle('active', drawActive);
            drawCanvas?.classList.toggle('active', drawActive);
            if (drawActive) { initDrawCanvas(); if (drawCanvas) drawCanvas.style.display = 'block'; } else { if (drawCanvas)
                    drawCanvas.style.display = 'none'; }
        }

        function setBrush(size) {
            brushSize = size;
            eraser = false;
            document.getElementById('eraserBtn').classList.remove('eraser-active');
            document.querySelectorAll('.draw-tool-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.draw-tool-btn[data-size="${size}"]`)?.classList.add('active');
            if (ctx) ctx.globalCompositeOperation = 'source-over';
        }

        function toggleEraser() {
            eraser = !eraser;
            document.getElementById('eraserBtn').classList.toggle('eraser-active', eraser);
            if (ctx) ctx.globalCompositeOperation = eraser ? 'destination-out' : 'source-over';
            if (eraser) document.querySelectorAll('.draw-tool-btn').forEach(b => b.classList.remove('active'));
        }

        function clearDraw() { if (ctx) { ctx.globalCompositeOperation = 'source-over';
                ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); } }

        // ---- init ----
        setTimeout(() => { initDrawCanvas(); }, 300);
        fillTemplates();
        fillFonts();
        fillStickers();
        fillColors();
    </script>
</body>
</html>
