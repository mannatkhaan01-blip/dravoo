<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dravoo · Pro Editor</title>
    <!-- Tailwind + Font Awesome + Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Pacifico&family=Bangers&family=Creepster&family=Lobster&family=Permanent+Marker&family=Righteous&family=Fredoka+One&family=Orbitron:wght@700&family=Cinzel:wght@700&family=Press+Start+2P&family=Monoton&family=Rubik+Mono+One&family=Shadows+Into+Light&family=Abril+Fatface&family=Comfortaa:wght@700&family=Teko:wght@600&family=Alfa+Slab+One&family=Luckiest+Guy&family=Oswald:wght@600&family=Russo+One&family=Titan+One&family=Kalam:wght@700&family=Quicksand:wght@700&family=VT323&display=swap" rel="stylesheet" />
    
    <style>
        body { background: #0b0b0e; color: #f1f5f9; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(16, 16, 20, 0.9); backdrop-filter: blur(12px); border: 1px solid #2a2a30; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 12px; }

        /* CapCut Style Custom Text Drawer Panel */
        .capcut-drawer {
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 60vh;
            background: #141418; border-top-left-radius: 24px; border-top-right-radius: 24px;
            border-top: 1px solid #282830; transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 300; display: flex; flex-direction: column;
            box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.9);
        }
        .capcut-drawer.open { bottom: 0; }
        
        .capcut-tabs-container { display: flex; overflow-x: auto; border-bottom: 1px solid #22222a; padding: 10px 14px; gap: 24px; background: #141418; }
        .capcut-tabs-container::-webkit-scrollbar { display: none; }
        .capcut-tab-btn { color: #8e8e93; font-size: 14px; font-weight: 600; white-space: nowrap; position: relative; padding-bottom: 4px; transition: 0.2s; }
        .capcut-tab-btn.active { color: #ffffff; }
        .capcut-tab-btn.active::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 100%; height: 3px; background: #00b4d8; border-radius: 2px; }

        .capcut-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; overflow-y: auto; flex: 1; }
        .capcut-card {
            background: #1e1e24; border-radius: 12px; aspect-ratio: 1/1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; padding: 10px; text-align: center;
            border: 1px solid #2a2a34; transition: all 0.15s ease; position: relative; overflow: hidden;
        }
        .capcut-card:hover { border-color: #00b4d8; transform: scale(1.02); background: #25252e; }

        /* ONE-SHOT CUSTOM ANIMATIONS (Sirf Aik Baar Chlein Gi) */
        .anim-once-bounce { animation: bounceOnce 0.8s ease-out 1 forwards; }
        .anim-once-spin { animation: spinOnce 0.6s linear 1 forwards; }
        .anim-once-zoom { animation: zoomOnce 0.5s ease-in-out 1 forwards; }
        .anim-once-fade { animation: fadeOnce 0.5s ease-in 1 forwards; }
        .anim-once-shake { animation: shakeOnce 0.5s ease-in-out 1 forwards; }

        @keyframes bounceOnce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes spinOnce {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes zoomOnce {
            0% { transform: scale(0.3); }
            100% { transform: scale(1); }
        }
        @keyframes fadeOnce {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes shakeOnce {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .submenu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; background: #0c0c10; }
    </style>
</head>
<body>

    <input type="file" id="video-file-picker" accept="video/*,image/*" class="hidden" />
    <input type="file" id="overlay-file-picker" accept="video/*,image/*" class="hidden" onchange="handleOverlaySelected(this)" />

    <!-- Navbar -->
    <header class="flex items-center justify-between px-5 py-3 bg-[#0b0b0e] border-b border-[#1e1e26]">
        <div class="flex items-center gap-3">
            <i class="fas fa-clapperboard text-blue-500 text-xl"></i>
            <span class="font-black text-lg tracking-tight text-white">DRAVOO</span>
        </div>
        <button class="text-xs text-zinc-400 bg-zinc-800/40 px-3 py-1.5 rounded-full"><i class="fas fa-home mr-1.5"></i>Home</button>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-md mx-auto px-2 my-4">
        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">

            <!-- Video Viewport Parent -->
            <div class="w-full bg-[#050507] p-4 flex items-center justify-center border-b border-[#1c1c24]">
                <div id="video-ratio-box" class="relative bg-black flex items-center justify-center overflow-hidden transition-all w-full max-w-[260px]" style="aspect-ratio: 9/16;">
                    <video id="studio-player" loop class="w-full h-full object-contain hidden"></video>
                    <img id="studio-image" class="w-full h-full object-contain hidden" alt="preview" />
                    
                    <!-- Text Target Layer -->
                    <div id="canvas-elements-layer" class="absolute inset-0 pointer-events-none z-40 flex items-center justify-center text-center p-4"></div>

                    <div id="media-placeholder" class="text-center p-6 z-10">
                        <i class="fas fa-photo-film text-4xl text-zinc-700 mb-3"></i>
                        <p class="text-xs text-zinc-400 mb-4">No media imported</p>
                        <button onclick="document.getElementById('video-file-picker').click()" class="bg-blue-600 text-white text-xs px-4 py-2 rounded-full"><i class="fas fa-plus mr-2"></i>Import File</button>
                    </div>
                </div>
            </div>

            <!-- Controls bar -->
            <div class="px-4 py-2 bg-[#0c0c10] border-b border-[#1a1a22] flex items-center justify-between">
                <span id="timeDisplay" class="text-xs font-mono text-zinc-400">00:00 / 00:00</span>
                <button id="playBtn" onclick="togglePlay()" class="w-8 h-8 bg-zinc-800 rounded-full flex items-center justify-center text-white"><i class="fas fa-play text-xs"></i></button>
            </div>

            <!-- MASTER BOTTOM MENU -->
            <div id="masterBottomMenu" class="flex bg-[#0e0e12] border-t border-[#22222a] py-3 justify-around">
                <button onclick="showSubmenu('text')" class="flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white"><i class="fas fa-font text-lg text-amber-400"></i><span class="text-[11px]">Text</span></button>
                <button onclick="showSubmenu('filters')" class="flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white"><i class="fas fa-filter text-lg text-indigo-400"></i><span class="text-[11px]">Filters</span></button>
                <button onclick="showSubmenu('aspect-ratio')" class="flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white"><i class="fas fa-crop-simple text-lg text-emerald-400"></i><span class="text-[11px]">Ratio</span></button>
            </div>

            <!-- DYNAMIC SUBMENUS -->
            <div id="submenu-text" class="hidden submenu-grid">
                <button onclick="backToMaster()" class="bg-zinc-950 p-2 rounded text-zinc-400 text-xs"><i class="fas fa-arrow-left block mb-1"></i>Back</button>
                <button onclick="openCapCutDrawer('templates')" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs"><i class="fas fa-plus text-amber-400 block mb-1"></i>Add Text</button>
            </div>
            
            <div id="submenu-filters" class="hidden p-3 bg-[#0c0c10]">
                <button onclick="backToMaster()" class="text-xs text-zinc-400 mb-2"><i class="fas fa-arrow-left mr-1"></i>Back</button>
                <div class="flex gap-2"><button onclick="applyFilter('grayscale(1)')" class="bg-zinc-800 px-3 py-1 rounded text-xs">B&W</button><button onclick="applyFilter('none')" class="bg-zinc-800 px-3 py-1 rounded text-xs">Reset</button></div>
            </div>

            <div id="submenu-aspect-ratio" class="hidden p-3 bg-[#0c0c10]">
                <button onclick="backToMaster()" class="text-xs text-zinc-400 mb-2"><i class="fas fa-arrow-left mr-1"></i>Back</button>
                <div class="flex gap-2"><button onclick="changeRatio('9/16')" class="bg-zinc-800 px-3 py-1 rounded text-xs">9:16</button><button onclick="changeRatio('16/9')" class="bg-zinc-800 px-3 py-1 rounded text-xs">16:9</button></div>
            </div>

        </div>
    </main>

    <!-- ==================== CAPCUT DRAWER SYSTEM ==================== -->
    <div class="capcut-drawer" id="capcutTextDrawer">
        <div class="p-3 bg-[#111115] flex items-center gap-2 border-b border-zinc-800">
            <input type="text" id="capcut-input-field" class="flex-1 bg-[#1a1a20] text-sm text-white px-3 py-1.5 rounded-lg outline-none border border-zinc-700" value="Mudassir Shabbir" />
            <button onclick="applyTextChanges()" class="w-8 h-8 bg-[#00b4d8] text-white rounded-lg flex items-center justify-center"><i class="fas fa-check text-xs"></i></button>
            <button onclick="closeCapCutDrawer()" class="w-8 h-8 bg-zinc-800 text-zinc-400 rounded-lg flex items-center justify-center"><i class="fas fa-times text-xs"></i></button>
        </div>

        <div class="capcut-tabs-container">
            <button onclick="switchCapCutTab('templates')" id="tab-templates" class="capcut-tab-btn active">Templates</button>
            <button onclick="switchCapCutTab('fonts')" id="tab-fonts" class="capcut-tab-btn">Fonts</button>
            <button onclick="switchCapCutTab('styles')" id="tab-styles" class="capcut-tab-btn">Styles</button>
            <button onclick="switchCapCutTab('effects')" id="tab-effects" class="capcut-tab-btn">Effects</button>
            <button onclick="switchCapCutTab('animations')" id="tab-animations" class="capcut-tab-btn">Animations</button>
            <button onclick="switchCapCutTab('bubbles')" id="tab-bubbles" class="capcut-tab-btn">Bubbles</button>
        </div>

        <div class="flex-1 overflow-y-auto bg-[#0f0f12]">
            <div id="capcutDynamicGrid" class="capcut-grid"></div>
        </div>
    </div>

    <script>
        const picker = document.getElementById('video-file-picker');
        const player = document.getElementById('studio-player');
        const imageEl = document.getElementById('studio-image');
        const placeholder = document.getElementById('media-placeholder');
        const timelineLabel = document.getElementById('timelineLabel');
        const playBtn = document.getElementById('playBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const ratioBox = document.getElementById('video-ratio-box');
        const elementsLayer = document.getElementById('canvas-elements-layer');
        const capcutDrawer = document.getElementById('capcutTextDrawer');
        const capcutGrid = document.getElementById('capcutDynamicGrid');
        const capcutInputField = document.getElementById('capcut-input-field');

        let selectedFont = "'Inter', sans-serif";
        let selectedStyleClass = "";
        let selectedEffectStyle = "";
        let selectedAnimationClass = "";
        let selectedBubbleStyle = "";

        picker.addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return;
            placeholder.classList.add('hidden');
            if (file.type.startsWith('video/')) {
                imageEl.classList.add('hidden'); player.classList.remove('hidden');
                player.src = URL.createObjectURL(file); player.play();
            } else {
                player.classList.add('hidden'); imageEl.classList.remove('hidden');
                imageEl.src = URL.createObjectURL(file);
            }
        });

        function togglePlay() {
            if (player.src && !player.classList.contains('hidden')) {
                if (player.paused) { player.play(); playBtn.innerHTML = `<i class="fas fa-pause text-xs"></i>`; }
                else { player.paused; player.pause(); playBtn.innerHTML = `<i class="fas fa-play text-xs"></i>`; }
            }
        }

        function showSubmenu(id) {
            backToMaster(); document.getElementById('masterBottomMenu').classList.add('hidden');
            document.getElementById(`submenu-${id}`).classList.remove('hidden');
        }

        function backToMaster() {
            ['text', 'filters', 'aspect-ratio'].forEach(s => document.getElementById(`submenu-${s}`).classList.add('hidden'));
            document.getElementById('masterBottomMenu').classList.remove('hidden');
        }

        function changeRatio(ratioStr) { ratioBox.style.aspectRatio = ratioStr; }
        function applyFilter(f) { player.style.filter = f; imageEl.style.filter = f; }

        function openCapCutDrawer(tabName = 'templates') { capcutDrawer.classList.add('open'); switchCapCutTab(tabName); }
        function closeCapCutDrawer() { capcutDrawer.classList.remove('open'); }

        function switchCapCutTab(tabName) {
            document.querySelectorAll('.capcut-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            capcutGrid.innerHTML = '';

            // 1. TEMPLATES (Har card ka unique configuration style matrix)
            if(tabName === 'templates') {
                const templateDesigns = [
                    { name: 'Neon Glow', style: "color: #00f0ff; font-family: 'Orbitron'; text-shadow: 0 0 8px #00f0ff;" },
                    { name: 'Retro Pop', style: "color: #ffff00; font-family: 'Bangers'; text-shadow: 3px 3px #ff0055;" },
                    { name: 'Vintage Metal', style: "color: #e0e0e0; font-family: 'Cinzel'; font-weight: bold;" },
                    { name: 'Cute Pink', style: "color: #ff7494; font-family: 'Pacifico';" },
                    { name: 'Spooky Horror', style: "color: #22c55e; font-family: 'Creepster'; letter-spacing: 2px;" },
                    { name: 'Bold Marker', style: "color: #ffffff; font-family: 'Permanent Marker'; background: #000; padding: 2px 6px;" }
                ];
                templateDesigns.forEach((t, i) => {
                    const card = document.createElement('div'); card.className = "capcut-card bg-zinc-900";
                    card.innerHTML = `<span style="${t.style}" class="text-xs">${t.name}</span>`;
                    card.onclick = () => { selectedEffectStyle = t.style; applyTextChanges(); };
                    capcutGrid.appendChild(card);
                });
            }
            // 2. FONTS (Purely non-repetitive clean typeface names array mapping)
            else if(tabName === 'fonts') {
                const fonts = ['Pacifico', 'Bangers', 'Creepster', 'Lobster', 'Permanent Marker', 'Righteous', 'Fredoka One', 'Orbitron', 'Cinzel', 'VT323'];
                fonts.forEach(f => {
                    const card = document.createElement('div'); card.className = "capcut-card";
                    card.innerHTML = `<span style="font-family: '${f}';" class="text-xs">${f}</span>`;
                    card.onclick = () => { selectedFont = `'${f}', sans-serif`; applyTextChanges(); };
                    capcutGrid.appendChild(card);
                });
            }
            // 3. STYLES (Alag-alag solid/stroke color states background combos)
            else if(tabName === 'styles') {
                const styles = [
                    { name: 'Yellow Badge', css: "background:#ffeb3b; color:#000; font-weight:bold; padding:4px; border-radius:4px;" },
                    { name: 'Red Glass', css: "background:rgba(239,68,68,0.3); border:1px solid #ef4444; color:#fff;" },
                    { name: 'Cyan Stroke', css: "color:#fff; -webkit-text-stroke: 1px #00f0ff;" },
                    { name: 'Minimal Dark', css: "background:#000; color:#fff; border-radius:12px; border:1px solid #333;" }
                ];
                styles.forEach(s => {
                    const card = document.createElement('div'); card.className = "capcut-card";
                    card.innerHTML = `<span style="${s.css}" class="text-[11px] p-1">${s.name}</span>`;
                    card.onclick = () => { selectedStyleClass = s.css; applyTextChanges(); };
                    capcutGrid.appendChild(card);
                });
            }
            // 4. EFFECTS
            else if(tabName === 'effects') {
                const effects = [
                    { name: 'Fire Flame', shadow: "text-shadow: 0 -2px 4px #ff3d00, 0 -4px 10px #ffea00; color:#fff;" },
                    { name: 'Deep Cyber', shadow: "text-shadow: 4px 4px 0px #002244; color:#00d2ff;" },
                    { name: 'Matrix Green', shadow: "text-shadow: 0 0 10px #00ff00; color:#fff; font-family:monospace;" }
                ];
                effects.forEach(e => {
                    const card = document.createElement('div'); card.className = "capcut-card";
                    card.innerHTML = `<span style="${e.shadow}" class="text-xs font-bold">${e.name}</span>`;
                    card.onclick = () => { selectedEffectStyle = e.shadow; applyTextChanges(); };
                    capcutGrid.appendChild(card);
                });
            }
            // 5. ANIMATIONS (ONE-SHOT TRIGGER ASSIGNMENTS)
            else if(tabName === 'animations') {
                const anims = [
                    { name: 'Jump Drop', class: 'anim-once-bounce', icon: 'fa-arrow-down' },
                    { name: 'Fast Spin', class: 'anim-once-spin', icon: 'fa-rotate' },
                    { name: 'Pop Zoom', class: 'anim-once-zoom', icon: 'fa-magnifying-glass-plus' },
                    { name: 'Smooth Fade', class: 'anim-once-fade', icon: 'fa-eye' },
                    { name: 'Side Shake', class: 'anim-once-shake', icon: 'fa-bolt' }
                ];
                anims.forEach(a => {
                    const card = document.createElement('div'); card.className = "capcut-card text-zinc-300";
                    card.innerHTML = `<i class="fas ${a.icon} text-sm mb-1"></i><span class="text-[10px]">${a.name}</span>`;
                    card.onclick = () => {
                        selectedAnimationClass = a.class;
                        applyTextChanges();
                    };
                    capcutGrid.appendChild(card);
                });
            }
            // 6. BUBBLES
            else if(tabName === 'bubbles') {
                const bubbles = [
                    { name: 'Cloud', css: "border-radius:20px; background:#fff; color:#000; padding:6px;" },
                    { name: 'Retro Box', css: "border:2px solid #ff0055; background:#000; color:#fff; padding:4px;" },
                    { name: 'Oval Banner', css: "border-radius:50%; background:#e0f7fa; color:#006064; padding:6px;" }
                ];
                bubbles.forEach(b => {
                    const card = document.createElement('div'); card.className = "capcut-card";
                    card.innerHTML = `<span style="${b.css}" class="text-[10px]">${b.name}</span>`;
                    card.onclick = () => { selectedBubbleStyle = b.css; applyTextChanges(); };
                    capcutGrid.appendChild(card);
                });
            }
        }

        function applyTextChanges() {
            const currentInputValue = capcutInputField.value || "Enter text";
            const combinedStyles = `font-family: ${selectedFont}; ${selectedStyleClass} ${selectedEffectStyle} ${selectedBubbleStyle}`;

            // Resetting inner HTML triggers the CSS animation from scratch exactly ONCE.
            elementsLayer.innerHTML = `
                <div class="text-node transition-transform duration-200 ${selectedAnimationClass}" 
                     style="${combinedStyles} font-size: 18px; font-weight:900; pointer-events: auto; display: inline-block;">
                     ${currentInputValue}
                </div>
            `;
            
            // Animation class removal logic post execution loop lifecycle so it can re-trigger on next touch
            const activeNode = elementsLayer.querySelector('.text-node');
            if(activeNode && selectedAnimationClass) {
                activeNode.addEventListener('animationend', () => {
                    activeNode.classList.remove(selectedAnimationClass);
                });
            }
        }
    </script>
</body>
</html>
