<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dravoo · full editor</title>
  <!-- Tailwind + Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0b0b0e; color:#f1f5f9; font-family:'Inter',sans-serif; overflow-x:hidden; }
    .glass-card { background:rgba(16,16,20,0.88); backdrop-filter:blur(6px); border:1px solid #2a2a32; }
    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-track { background:#18181b; }
    ::-webkit-scrollbar-thumb { background:#3b82f6; border-radius:12px; }

    /* main toolbar – horizontal scroll */
    .toolbar-scroll {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 6px 8px;
      flex-wrap: nowrap;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }
    .toolbar-scroll::-webkit-scrollbar { height: 3px; }
    .toolbar-scroll::-webkit-scrollbar-thumb { background:#3b82f6; border-radius:20px; }
    .tool-btn {
      background: transparent;
      border: none;
      color: #b0b8c5;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 12px;
      border-radius: 30px;
      white-space: nowrap;
      transition: 0.15s;
      cursor: pointer;
      min-width: 60px;
      border: 1px solid transparent;
    }
    .tool-btn i { font-size: 20px; margin-bottom: 1px; }
    .tool-btn:hover { color:#fff; background:#1e1e28; border-color:#2f2f3a; }
    .tool-btn.active { color:#fff; background:#1f2937; border-color:#3b82f6; }

    /* dropdown panel – floating */
    .float-panel {
      position: absolute;
      top: 110%;
      left: 0;
      background: #14141a;
      border: 1px solid #2e2e38;
      border-radius: 24px;
      padding: 16px 18px;
      min-width: 260px;
      max-width: 480px;
      z-index: 300;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 380px;
      overflow-y: auto;
    }
    .float-panel.open { display: flex; }
    .float-panel .opt {
      background: #21212a;
      border: none;
      color: #d1d5db;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.1s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .float-panel .opt:hover { background:#33333e; color:#fff; }
    .float-panel .opt i { font-size:14px; width:18px; }

    /* canvas & overlay */
    .canvas-wrapper { position:relative; background:#000; border-radius:24px; overflow:hidden; }
    .canvas-text-overlay { position:absolute; color:#fff; font-weight:700; font-size:28px; text-shadow:0 2px 12px rgba(0,0,0,0.9); cursor:move; user-select:none; padding:4px 12px; border:1px dashed transparent; z-index:20; white-space:nowrap; background:rgba(0,0,0,0.2); border-radius:12px; }
    .canvas-text-overlay.active-node { border-color:#3b82f6; background:rgba(59,130,246,0.15); }
    .canvas-sticker-overlay { position:absolute; font-size:48px; cursor:move; user-select:none; z-index:21; padding:6px; border:1px dashed transparent; background:rgba(0,0,0,0.1); border-radius:16px; }
    .canvas-sticker-overlay.active-node { border-color:#ec4899; background:rgba(236,72,153,0.15); }

    /* drawer (for text/stickers) */
    .editor-drawer {
      position:fixed; bottom:-100%; left:0; width:100%; max-width:480px; margin:0 auto; right:0;
      height:52vh; background:#111115; border-top-left-radius:28px; border-top-right-radius:28px;
      border-top:1px solid #2a2a32; transition:bottom 0.3s cubic-bezier(0.16,0.76,0.36,0.98);
      z-index:400; display:flex; flex-direction:column; box-shadow:0 -20px 60px rgba(0,0,0,0.9);
    }
    .editor-drawer.open { bottom:0; }
    .drawer-header { display:flex; align-items:center; padding:14px 18px; gap:10px; border-bottom:1px solid #22222a; }
    .drawer-tabs { display:flex; overflow-x:auto; padding:6px 12px; gap:4px; border-bottom:1px solid #1e1e24; flex-shrink:0; }
    .drawer-tabs::-webkit-scrollbar { display:none; }
    .tab-link { background:transparent; border:none; padding:6px 14px; font-size:13px; font-weight:600; color:#9ca3af; cursor:pointer; border-radius:30px; white-space:nowrap; }
    .tab-link.active { background:#1f2937; color:#fff; }
    .tab-content { flex:1; overflow-y:auto; padding:12px 14px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .tab-content > div { background:#1c1c22; border-radius:14px; aspect-ratio:1/1; display:flex; flex-direction:column; justify-content:center; align-items:center; cursor:pointer; border:1px solid #2c2c34; font-size:13px; padding:4px; text-align:center; transition:0.1s; }
    .tab-content > div:hover { transform:scale(1.02); border-color:#3b82f6; background:#26262e; }
    .color-dot { width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:0.1s; }
    .color-dot:hover { transform:scale(1.1); }
  </style>
</head>
<body>

<!-- hidden file input -->
<input type="file" id="mediaPicker" accept="video/*,image/*" class="hidden" />

<!-- Top bar -->
<header class="flex items-center justify-between px-4 py-2.5 bg-[#0b0b0e] border-b border-[#1e1e26]">
  <div class="flex items-center gap-3">
    <i class="fas fa-clapperboard text-blue-500 text-xl"></i>
    <span class="font-black text-lg tracking-tight text-white">DRAVOO</span>
    <span class="text-[10px] font-medium text-zinc-500 bg-zinc-800/60 px-2 py-0.5 rounded-full">Editor</span>
  </div>
  <div class="flex items-center gap-3">
    <button onclick="document.getElementById('mediaPicker').click()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-1.5 rounded-full transition"><i class="fas fa-plus mr-1.5"></i>Media</button>
    <button onclick="triggerExport()" class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs px-4 py-1.5 rounded-full transition"><i class="fas fa-upload mr-1.5"></i>Export</button>
  </div>
</header>

<!-- main canvas -->
<main class="max-w-4xl mx-auto px-3 py-4">
  <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">

    <!-- canvas area -->
    <div id="canvasContainer" class="canvas-wrapper aspect-[9/16] max-h-[500px] flex items-center justify-center relative">
      <video id="studioPlayer" loop class="w-full h-full object-contain hidden"></video>
      <img id="studioImage" class="w-full h-full object-contain hidden" alt="preview" />
      <div id="placeholder" class="text-center p-6">
        <i class="fas fa-cloud-arrow-up text-5xl text-zinc-700 mb-3"></i>
        <p class="text-sm text-zinc-500 mb-4">Upload video or image</p>
        <button onclick="document.getElementById('mediaPicker').click()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-6 py-2.5 rounded-full"><i class="fas fa-plus mr-2"></i>Add Media</button>
      </div>
      <!-- overlays will be injected here -->
    </div>

    <!-- transport + timeline (minimal) -->
    <div class="px-4 py-2 bg-[#0c0c10] border-b border-[#1a1a22] flex items-center justify-between">
      <span id="timeDisplay" class="text-xs font-mono text-zinc-400">00:00 / 00:05</span>
      <button id="playBtn" onclick="togglePlay()" class="bg-zinc-800 hover:bg-zinc-700 w-10 h-10 rounded-full flex items-center justify-center text-white border border-zinc-700"><i class="fas fa-play text-sm"></i></button>
      <div class="flex gap-2">
        <button onclick="openDrawer()" class="text-zinc-400 hover:text-white text-xs bg-zinc-800/40 px-3 py-1.5 rounded-full"><i class="fas fa-font mr-1.5"></i>Text</button>
      </div>
    </div>

    <!-- ========== TOOLBAR (all 15+ options) ========== -->
    <div class="bg-[#0a0a0e] border-b border-[#1a1a22] relative" id="toolbarWrapper">
      <div class="toolbar-scroll">
        <!-- 1. Edit -->
        <button class="tool-btn" data-panel="editPanel"><i class="fas fa-sliders-h"></i>Edit</button>
        <!-- 2. Audio -->
        <button class="tool-btn" data-panel="audioPanel"><i class="fas fa-music"></i>Audio</button>
        <!-- 3. Text -->
        <button class="tool-btn" data-panel="textPanel"><i class="fas fa-font"></i>Text</button>
        <!-- 4. Effects -->
        <button class="tool-btn" data-panel="effectsPanel"><i class="fas fa-bolt"></i>Effects</button>
        <!-- 5. Overlay -->
        <button class="tool-btn" data-panel="overlayPanel"><i class="fas fa-layer-group"></i>Overlay</button>
        <!-- 6. Caption -->
        <button class="tool-btn" data-panel="captionPanel"><i class="fas fa-closed-captioning"></i>Caption</button>
        <!-- 7. Filters (renamed from 8) -->
        <button class="tool-btn" data-panel="filtersPanel"><i class="fas fa-filter"></i>Filters</button>
        <!-- 8. Adjust -->
        <button class="tool-btn" data-panel="adjustPanel"><i class="fas fa-adjust"></i>Adjust</button>
        <!-- 9. Stickers (built-in) -->
        <button class="tool-btn" data-panel="stickersPanel"><i class="fas fa-face-smile"></i>Stickers</button>
        <!-- 10. Generate media -->
        <button class="tool-btn" data-panel="generatePanel"><i class="fas fa-wand-magic-sparkles"></i>Generate</button>
        <!-- 11. AI Avatar -->
        <button class="tool-btn" data-panel="avatarPanel"><i class="fas fa-robot"></i>AI Avatar</button>
        <!-- 12. Aspect ratio -->
        <button class="tool-btn" data-panel="aspectPanel"><i class="fas fa-expand"></i>Aspect</button>
        <!-- 13. Background -->
        <button class="tool-btn" data-panel="bgPanel"><i class="fas fa-image"></i>Background</button>
        <!-- extra: Draw (integrated) -->
        <button class="tool-btn" onclick="toggleDraw()"><i class="fas fa-pen-fancy"></i>Draw</button>
      </div>

      <!-- floating panels (each tool) -->
      <div id="editPanel" class="float-panel"></div>
      <div id="audioPanel" class="float-panel"></div>
      <div id="textPanel" class="float-panel"></div>
      <div id="effectsPanel" class="float-panel"></div>
      <div id="overlayPanel" class="float-panel"></div>
      <div id="captionPanel" class="float-panel"></div>
      <div id="filtersPanel" class="float-panel"></div>
      <div id="adjustPanel" class="float-panel"></div>
      <div id="stickersPanel" class="float-panel"></div>
      <div id="generatePanel" class="float-panel"></div>
      <div id="avatarPanel" class="float-panel"></div>
      <div id="aspectPanel" class="float-panel"></div>
      <div id="bgPanel" class="float-panel"></div>
    </div>
  </div>
</main>

<!-- ====== DRAWER (text/stickers) ====== -->
<div class="editor-drawer" id="editorDrawer">
  <div class="drawer-header">
    <button class="text-zinc-400 hover:text-white" onclick="closeDrawer()">✕</button>
    <input type="text" id="drawerInput" class="flex-1 bg-zinc-800 border-0 rounded-2xl px-4 py-2 text-sm text-white outline-none focus:ring-1 focus:ring-blue-500" placeholder="Type text..." />
    <button class="text-blue-500 font-bold px-2" onclick="addTextFromDrawer()">✓</button>
  </div>
  <div class="drawer-tabs">
    <button class="tab-link active" onclick="switchDrawerTab('fonts')">Fonts</button>
    <button class="tab-link" onclick="switchDrawerTab('templates')">Templates</button>
    <button class="tab-link" onclick="switchDrawerTab('styles')">Styles</button>
    <button class="tab-link" onclick="switchDrawerTab('stickers')">Stickers</button>
  </div>
  <div class="tab-content" id="drawerContent"></div>
</div>

<script>
  // --------------------------------------------------------------
  // 1. MEDIA / PLAYER
  // --------------------------------------------------------------
  const picker = document.getElementById('mediaPicker');
  const player = document.getElementById('studioPlayer');
  const imageEl = document.getElementById('studioImage');
  const placeholder = document.getElementById('placeholder');
  const playBtn = document.getElementById('playBtn');
  const timeDisplay = document.getElementById('timeDisplay');
  const container = document.getElementById('canvasContainer');

  picker.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    placeholder.classList.add('hidden');
    if (file.type.startsWith('video/')) {
      imageEl.classList.add('hidden');
      player.classList.remove('hidden');
      player.src = URL.createObjectURL(file);
      player.play();
      playBtn.innerHTML = `<i class="fas fa-pause text-sm"></i>`;
      player.ontimeupdate = () => { timeDisplay.innerText = `${fmt(player.currentTime)} / ${fmt(player.duration||0)}`; };
    } else if (file.type.startsWith('image/')) {
      player.classList.add('hidden');
      player.pause();
      imageEl.classList.remove('hidden');
      imageEl.src = URL.createObjectURL(file);
      timeDisplay.innerText = "00:00 / 00:05";
    }
  });

  function fmt(s) { if (isNaN(s)) return "00:00"; return `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`; }
  function togglePlay() {
    if (player.paused) { player.play(); playBtn.innerHTML = `<i class="fas fa-pause text-sm"></i>`; } 
    else { player.pause(); playBtn.innerHTML = `<i class="fas fa-play text-sm"></i>`; }
  }
  function triggerExport() { alert('Export project (demo)'); }

  // --------------------------------------------------------------
  // 2. TOOLBAR FLOATING PANELS (all options)
  // --------------------------------------------------------------
  const panelData = {
    editPanel: ['Split','Volume','Animation','Effects','Delete','Speed','Beats','AI Extends','Crop','Duplicate','Replace','Overlay','Adjust','Filter','Retouch','Video Quality','Remove BG','AI Remove','AI Expand','AI Remix','Eye Contact','Relight','Opacity','Motion Blur','Lip Sync','Transform','Auto Reframe','Stabilize','Extract Audio','Isolate Voice','Audio Effects','Enhance Voice','Video Translator','Freeze','Reverse','Mask','Unlink'],
    audioPanel: ['Extract','Sounds','Sound Effects','Record','Text to Audio','Brand Music','Copyright'],
    textPanel: ['Add Text','Auto Caption','Stickers','Draw','Templates','Text to Audio','Auto Lyrics'],
    effectsPanel: ['Body Effects','Video Effects','Photo Effects','AI Effects'],
    overlayPanel: ['Gallery (open)','Add Image','Add Video','Overlay Blend'],
    captionPanel: ['Auto Caption','Manual Caption','Style','Position'],
    filtersPanel: ['4K','HD','Vivid','Cinematic','Retro','Monochrome','Warm','Cool','Dramatic','Soft','HDR','Film','Noir','Pastel','Neon','Vintage','Sepia','Fade','Boost','Clarity','Sharp','Mellow','Contrast+','Bright','Natural','Dreamy','Glow','Matte','Rustic','Sunset','Ocean','Forest','Urban','Gold','Silver','Cream','Lemon','Cherry','Sky','Lavender','Mint','Coral','Amber','Graphite','Pearl','Denim','Olive','Rose','Choco','Ivory'],  // 50 approx
    adjustPanel: ['Auto Adjust','Colour Match','Colour Correction','Brightness','Contrast','Saturation','Brilliance','Sharpen','Clarity','HSL','Graph','Colour Wheel','Highlight','Shadows','White','Black','Temp','Hue','Fade','Vignette','Grain'],
    stickersPanel: ['🔥','✨','🎯','❤️','👑','🚀','💥','😂','💯','🎉','🌟','👍','🙌','💀','🤖','🎃','😈','👀','🎮','🎨','🎬','⚡','💡','🔮','💎','💰','🌍','🍕','🍔','🎵','🎤','🎸','🐾','🦄','🐼','🦊','🐰','🐻','🐺','💖','💙','💚','💛','🌸','🌺','🌻','🌹'],
    generatePanel: ['AI Image','AI Video','Dravoo Studio','Pixabay API'],
    avatarPanel: ['Avatar 1','Avatar 2','Avatar 3','Avatar 4','Avatar 5','Avatar 6','Avatar 7','Avatar 8'],
    aspectPanel: ['9:16','16:9','1:1','4:3','3:4','5.8"','128:27','2:1','2.35:1','1.85:1'],
    bgPanel: ['Color','Image','Blur','Brand Background']
  };

  // build panels
  Object.keys(panelData).forEach(id => {
    const panel = document.getElementById(id);
    if (!panel) return;
    panelData[id].forEach(label => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = `<i class="fas fa-circle" style="font-size:8px;color:#3b82f6;"></i> ${label}`;
      btn.onclick = () => { alert(`Action: ${label}`); closeAllPanels(); };
      panel.appendChild(btn);
    });
  });

  // toggle panels on tool click
  document.querySelectorAll('.tool-btn[data-panel]').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const panelId = this.dataset.panel;
      const panel = document.getElementById(panelId);
      if (!panel) return;
      const isOpen = panel.classList.contains('open');
      closeAllPanels();
      if (!isOpen) {
        panel.classList.add('open');
        this.classList.add('active');
        // position
        const rect = this.getBoundingClientRect();
        const wrapper = document.getElementById('toolbarWrapper');
        const wrapperRect = wrapper.getBoundingClientRect();
        panel.style.left = Math.min(rect.left - wrapperRect.left, wrapperRect.width - panel.offsetWidth - 10) + 'px';
        panel.style.top = '100%';
      } else {
        this.classList.remove('active');
      }
    });
  });

  function closeAllPanels() {
    document.querySelectorAll('.float-panel').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.tool-btn.active').forEach(b => b.classList.remove('active'));
  }
  document.addEventListener('click', closeAllPanels);

  // --------------------------------------------------------------
  // 3. TEXT / STICKERS overlays + DRAWER
  // --------------------------------------------------------------
  let activeNode = null;
  const drawerEl = document.getElementById('editorDrawer');
  const drawerInput = document.getElementById('drawerInput');
  const drawerContent = document.getElementById('drawerContent');

  function openDrawer() { drawerEl.classList.add('open'); fillDrawer('fonts'); }
  function closeDrawer() { drawerEl.classList.remove('open'); }

  function switchDrawerTab(tab) {
    document.querySelectorAll('.tab-link').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab-link[onclick*="${tab}"]`)?.classList.add('active');
    fillDrawer(tab);
  }

  function fillDrawer(tab) {
    drawerContent.innerHTML = '';
    let items = [];
    if (tab === 'fonts') items = ['Rubik','Bangers','Oswald','Anton','Permanent Marker','Lobster','Pacifico','Dancing Script','Great Vibes','Satisfy','Kaushan Script','Mr Dafoe','Architects Daughter','Indie Flower','Patrick Hand','Rock Salt','Alex Brush','Allura','Caveat Brush','Sacramento','Tangerine','WindSong'];
    else if (tab === 'templates') items = ['ABC Smart','Neon Glow','Satisfy','Great Vibes','Alex Brush','Allura','Pacifico','Dancing Script','Zeyada','Parisienne','Tangerine','Architects','Indie Flower','Patrick Hand','Kaushan Script','Mr Dafoe','Rock Salt','Caveat Brush','Sacramento','Marck Script','Rochester','WindSong','Grand Hotel','Meddon','Coming Soon'];
    else if (tab === 'styles') { // color picker
      const colors = ['#ffffff','#ff3b30','#ffcc00','#4cd964','#3b82f6','#e02424','#9333ea','#06b6d4','#f472b6','#fb923c','#22c55e','#8b5cf6','#ec4899','#f59e0b','#10b981','#6366f1','#000000'];
      colors.forEach(c => {
        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.background = c;
        dot.onclick = () => { if (activeNode) activeNode.style.color = c; };
        drawerContent.appendChild(dot);
      });
      return;
    } else if (tab === 'stickers') {
      items = ['🔥','✨','🎯','❤️','👑','🚀','💥','😂','💯','🎉','🌟','👍','🙌','💀','🤖','🎃','😈','👀','🎮','🎨','🎬','⚡','💡','🔮','💎','💰','🌍','🍕','🍔','🎵','🎤','🎸','🐾','🦄','🐼','🦊','🐰','🐻','🐺','💖','💙','💚','💛','🌸','🌺','🌻','🌹'];
    }
    items.forEach(label => {
      const div = document.createElement('div');
      div.innerText = label;
      if (tab === 'stickers') div.style.fontSize = '32px';
      div.onclick = () => {
        if (tab === 'stickers') addSticker(label);
        else addTextNode(label);
        closeDrawer();
      };
      drawerContent.appendChild(div);
    });
  }

  function addTextNode(text) {
    const el = document.createElement('div');
    el.className = 'canvas-text-overlay active-node';
    el.innerText = text || 'Text';
    el.style.left = (20 + Math.random()*40) + '%';
    el.style.top = (25 + Math.random()*40) + '%';
    el.addEventListener('click', e => { e.stopPropagation(); selectNode(el); });
    el.addEventListener('dblclick', () => { if(confirm('Delete?')) { el.remove(); if(activeNode===el) activeNode=null; } });
    makeDraggable(el);
    container.appendChild(el);
    selectNode(el);
    drawerInput.value = el.innerText;
  }

  function addSticker(emoji) {
    const el = document.createElement('div');
    el.className = 'canvas-sticker-overlay active-node';
    el.innerText = emoji || '😊';
    el.style.left = (30 + Math.random()*30) + '%';
    el.style.top = (30 + Math.random()*30) + '%';
    el.addEventListener('click', e => { e.stopPropagation(); selectNode(el); });
    el.addEventListener('dblclick', () => { if(confirm('Delete?')) { el.remove(); if(activeNode===el) activeNode=null; } });
    makeDraggable(el);
    container.appendChild(el);
    selectNode(el);
  }

  function selectNode(el) {
    document.querySelectorAll('.canvas-text-overlay,.canvas-sticker-overlay').forEach(x => x.classList.remove('active-node'));
    el.classList.add('active-node');
    activeNode = el;
    if (el.classList.contains('canvas-text-overlay')) drawerInput.value = el.innerText;
  }

  function makeDraggable(el) {
    let dx, dy, drag = false;
    const start = (e) => {
      e = e || window.event;
      const ev = e.touches ? e.touches[0] : e;
      dx = ev.clientX - el.getBoundingClientRect().left;
      dy = ev.clientY - el.getBoundingClientRect().top;
      drag = true;
      document.addEventListener('mousemove', move);
      document.addEventListener('touchmove', move, {passive:false});
      document.addEventListener('mouseup', end);
      document.addEventListener('touchend', end);
    };
    const move = (e) => {
      if (!drag) return; e.preventDefault();
      const ev = e.touches ? e.touches[0] : e;
      const rect = container.getBoundingClientRect();
      let x = ev.clientX - rect.left - dx, y = ev.clientY - rect.top - dy;
      x = Math.max(0, Math.min(x, rect.width - el.offsetWidth));
      y = Math.max(0, Math.min(y, rect.height - el.offsetHeight));
      el.style.left = x + 'px'; el.style.top = y + 'px';
    };
    const end = () => { drag = false; document.removeEventListener('mousemove', move); document.removeEventListener('touchmove', move); document.removeEventListener('mouseup', end); document.removeEventListener('touchend', end); };
    el.addEventListener('mousedown', start);
    el.addEventListener('touchstart', start, {passive:false});
  }

  function addTextFromDrawer() {
    const val = drawerInput.value.trim();
    if (val) addTextNode(val);
    closeDrawer();
  }

  // --------------------------------------------------------------
  // 4. DRAW (simple toggle)
  // --------------------------------------------------------------
  let drawActive = false;
  function toggleDraw() {
    drawActive = !drawActive;
    alert(drawActive ? 'Draw mode ON (demo)' : 'Draw mode OFF');
  }

  // --------------------------------------------------------------
  // 5. extra: overlay panel -> gallery picker
  // --------------------------------------------------------------
  document.querySelector('#overlayPanel .opt')?.addEventListener('click', () => {
    document.getElementById('mediaPicker').click();
  });

  // init drawer fonts
  fillDrawer('fonts');
</script>
</body>
</html>
