<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dravoo · Pro Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b0e;
            color: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(16, 16, 20, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid #2a2a30;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 12px; }

        .scroll-x-menu {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-x-menu::-webkit-scrollbar { display: none; }

        .editor-drawer {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 65vh;
            background: #111115;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            border-top: 1px solid #2a2a32;
            transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.8);
        }
        .editor-drawer.open { bottom: 0; }
        
        .asset-card {
            background: #1c1c22;
            border-radius: 14px;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
            color: #e5e7eb;
            border: 1px solid #2c2c34;
            transition: 0.15s;
            padding: 8px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .asset-card:hover { transform: scale(1.02); border-color: #3b82f6; background: #26262e; }
        
        .draw-overlay-canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 30; 
            pointer-events: none; 
            touch-action: none;
        }
        .draw-overlay-canvas.active { pointer-events: auto; cursor: crosshair; }
        
        .submenu-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            padding: 12px;
            background: #0c0c10;
        }
        @media (max-width: 600px) {
            .submenu-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .canvas-text-item {
            position: absolute;
            cursor: grab;
            user-select: none;
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 50;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.3s;
        }
        .canvas-text-item:hover {
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
            border-radius: 4px;
        }
        .canvas-text-item .text-content {
            pointer-events: none;
        }
        .canvas-text-item .delete-btn {
            display: none;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            pointer-events: auto;
        }
        .canvas-text-item:hover .delete-btn {
            display: flex;
        }
        .canvas-text-item .delete-btn:hover {
            background: #ef4444;
            transform: scale(1.1);
        }
        .canvas-text-item.dragging {
            cursor: grabbing;
            opacity: 0.8;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        .canvas-text-item.selected {
            box-shadow: 0 0 0 3px #3b82f6, 0 0 20px rgba(59,130,246,0.3);
        }

        /* Audio Waveform Track */
        .waveform-track {
            background: #0a0a0e;
            border-bottom: 1px solid #1a1a22;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .waveform-track .waveform-bar {
            height: 20px;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .waveform-track .waveform-bar .bar {
            flex: 1;
            background: #34d399;
            border-radius: 2px;
            opacity: 0.7;
            height: 100%;
        }
        .waveform-track .waveform-bar .bar:nth-child(odd) { height: 40%; }
        .waveform-track .waveform-bar .bar:nth-child(3n) { height: 80%; }
        .waveform-track .waveform-bar .bar:nth-child(5n) { height: 60%; }
        .waveform-track .waveform-bar .bar:nth-child(7n) { height: 100%; }
        .waveform-track .waveform-bar .bar:nth-child(11n) { height: 30%; }

        .track-label {
            font-size: 10px;
            color: #6b7280;
            min-width: 60px;
            font-family: monospace;
        }

        /* Color Picker */
        .color-picker-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            padding: 10px;
        }
        .color-picker-grid .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .color-picker-grid .color-option:hover {
            transform: scale(1.15);
            border-color: #fff;
        }
        .color-picker-grid .color-option.selected {
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        /* Opacity Slider */
        .opacity-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #2a2a32;
            outline: none;
        }
        .opacity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }

        /* Sticker Grid */
        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            padding: 10px;
        }
        .sticker-grid .sticker-item {
            aspect-ratio: 1/1;
            background: #1c1c22;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            border: 1px solid #2c2c34;
            transition: all 0.2s;
        }
        .sticker-grid .sticker-item:hover {
            transform: scale(1.05);
            border-color: #3b82f6;
            background: #26262e;
        }

        /* Animation Keyframes */
        @keyframes textFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes textBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes textSlideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(59,130,246,0.5); }
            50% { text-shadow: 0 0 30px rgba(59,130,246,0.8); }
        }
        @keyframes textRotate {
            from { transform: rotate(-5deg); }
            to { transform: rotate(5deg); }
        }
        @keyframes textPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes textWave {
            0% { transform: translateY(0); }
            25% { transform: translateY(-5px); }
            50% { transform: translateY(0); }
            75% { transform: translateY(5px); }
            100% { transform: translateY(0); }
        }
        @keyframes textShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        @keyframes textFlip {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
        @keyframes textZoom {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        @keyframes textNeonPulse {
            0%, 100% { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #3b82f6, 0 0 40px #3b82f6; }
            50% { text-shadow: 0 0 10px #fff, 0 0 20px #3b82f6, 0 0 40px #3b82f6, 0 0 80px #3b82f6; }
        }
        @keyframes textRainbow {
            0% { color: #ff0000; }
            17% { color: #ff8800; }
            33% { color: #ffff00; }
            50% { color: #00ff00; }
            67% { color: #0088ff; }
            83% { color: #8800ff; }
            100% { color: #ff0000; }
        }
    </style>
</head>
<body>

    <input type="file" id="video-file-picker" accept="video/*,image/*" class="hidden" />
    <input type="file" id="overlay-file-picker" accept="video/*,image/*" class="hidden" onchange="handleOverlaySelected(this)" />
    <input type="file" id="audio-extract-picker" accept="audio/*,video/*" class="hidden" onchange="handleAudioExtracted(this)" />

    <!-- Navbar -->
    <header class="flex items-center justify-between px-5 py-3 bg-[#0b0b0e] border-b border-[#1e1e26]">
        <div class="flex items-center gap-3">
            <i class="fas fa-clapperboard text-blue-500 text-xl"></i>
            <span class="font-black text-lg tracking-tight text-white">DRAVOO</span>
            <span class="text-[10px] font-medium text-zinc-500 bg-zinc-800/60 px-2 py-0.5 rounded-full">Pro Studio</span>
        </div>
        <button onclick="showExportDialog()" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:opacity-90 text-white text-xs font-bold px-4 py-1.5 rounded-full transition">
            <i class="fas fa-download mr-1.5"></i>Export
        </button>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-3xl mx-auto px-2 my-4">
        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">

            <!-- Top Project Toolbar -->
            <div class="flex items-center justify-between px-4 py-2.5 bg-[#0e0e12] border-b border-[#1f1f26]">
                <div class="flex items-center gap-2 text-sm">
                    <span class="text-white font-semibold">Project: Untitled</span>
                    <span class="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/30">Active</span>
                </div>
                <div class="flex items-center gap-3">
                    <select class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-300 rounded-full px-3 py-1.5 outline-none">
                        <option>4K UHD</option>
                        <option selected>1080p Full HD</option>
                        <option>720p HD</option>
                    </select>
                    <button onclick="showExportDialog()" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:opacity-90 text-white text-xs font-bold px-4 py-1.5 rounded-full transition">
                        <i class="fas fa-upload mr-1.5"></i>Export
                    </button>
                </div>
            </div>

            <!-- Main Canvas Viewport -->
            <div class="w-full bg-[#050507] p-4 flex items-center justify-center border-b border-[#1c1c24]">
                <div id="video-ratio-box" class="relative bg-black flex items-center justify-center overflow-hidden shadow-inner transition-all duration-300 w-full max-w-[280px]" style="aspect-ratio: 9/16;">
                    <video id="studio-player" loop class="w-full h-full object-contain hidden"></video>
                    <img id="studio-image" class="w-full h-full object-contain hidden" alt="preview" />
                    
                    <!-- Canvas Elements Layer -->
                    <div id="canvas-elements-layer" class="absolute inset-0 pointer-events-none z-40"></div>
                    
                    <!-- Overlay Image -->
                    <img id="overlay-display-img" class="absolute max-w-[40%] max-h-[40%] border-2 border-dashed border-blue-500 hidden z-20 pointer-events-auto cursor-move" style="top:20px; left:20px;" alt="Overlay" />

                    <!-- Placeholder -->
                    <div id="media-placeholder" class="text-center p-6 z-10">
                        <i class="fas fa-photo-film text-5xl text-zinc-700 mb-3 animate-pulse"></i>
                        <p class="text-sm text-zinc-400 mb-4">No media timeline detected</p>
                        <button onclick="document.getElementById('video-file-picker').click()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-5 py-2 rounded-full transition"><i class="fas fa-plus mr-2"></i>Import Asset</button>
                    </div>

                    <!-- Drawing Canvas -->
                    <canvas id="drawCanvas" class="draw-overlay-canvas"></canvas>
                    
                    <!-- Draw Tools -->
                    <div id="drawToolsPanel" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-50 bg-[#111116] border border-zinc-800 rounded-full px-4 py-2 hidden items-center gap-3 shadow-2xl">
                        <button class="text-xs bg-zinc-800 px-2 py-1 rounded text-white" onclick="setBrush(3)">Thin</button>
                        <button class="text-xs bg-zinc-800 px-2 py-1 rounded text-white" onclick="setBrush(8)">Thick</button>
                        <button onclick="clearDraw()" class="text-xs bg-red-600 px-2 py-1 rounded text-white">Clear</button>
                        <button onclick="toggleDraw()" class="text-xs text-zinc-400">✕</button>
                    </div>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="px-4 py-2.5 bg-[#0c0c10] border-b border-[#1a1a22] flex items-center justify-between">
                <span id="timeDisplay" class="text-xs font-mono text-zinc-400">00:00 / 00:00</span>
                <button id="playBtn" onclick="togglePlay()" class="w-9 h-9 bg-zinc-800 hover:bg-zinc-700 rounded-full flex items-center justify-center text-white"><i class="fas fa-play text-xs"></i></button>
                <span class="text-[10px] uppercase tracking-wider font-bold text-zinc-500">Timeline</span>
            </div>

            <!-- AUDIO TRACK WITH WAVEFORM -->
            <div id="audioTrackContainer" class="waveform-track">
                <span class="track-label"><i class="fas fa-music text-emerald-400 mr-1"></i>Audio</span>
                <div id="waveformBars" class="waveform-bar">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
                <span id="trackCount" class="text-[10px] text-zinc-600">0 tracks</span>
            </div>

            <!-- Video Timeline Track -->
            <div class="px-4 py-2 bg-[#0a0a0e] border-b border-[#1a1a22] flex items-center justify-between">
                <div class="flex items-center gap-2 truncate">
                    <i class="fas fa-video text-blue-400 text-xs"></i>
                    <span id="timelineLabel" class="text-xs font-mono text-zinc-400 truncate">No video</span>
                </div>
                <button onclick="document.getElementById('video-file-picker').click()" class="text-zinc-400 hover:text-white text-[11px] bg-zinc-800 px-2.5 py-1 rounded-md">Import</button>
            </div>

            <!-- MASTER BOTTOM MENU -->
            <div id="masterBottomMenu" class="scroll-x-menu bg-[#0e0e12] border-t border-[#22222a] py-2 px-1 gap-1">
                <button onclick="showSubmenu('edit')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-video text-base text-blue-400"></i><span class="text-[10px] font-medium">Edit</span></button>
                <button onclick="showSubmenu('audio')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-music text-base text-green-400"></i><span class="text-[10px] font-medium">Audio</span></button>
                <button onclick="showSubmenu('text')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-font text-base text-amber-400"></i><span class="text-[10px] font-medium">Text</span></button>
                <button onclick="showSubmenu('effects')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-wand-magic-sparkles text-base text-purple-400"></i><span class="text-[10px] font-medium">Effects</span></button>
                <button onclick="showSubmenu('overlay')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-layer-group text-base text-cyan-400"></i><span class="text-[10px] font-medium">Overlay</span></button>
                <button onclick="showSubmenu('caption')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-closed-captioning text-base text-pink-400"></i><span class="text-[10px] font-medium">Caption</span></button>
                <button onclick="showSubmenu('filters')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-filter text-base text-indigo-400"></i><span class="text-[10px] font-medium">Filters</span></button>
                <button onclick="showSubmenu('adjust')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-sliders text-base text-orange-400"></i><span class="text-[10px] font-medium">Adjust</span></button>
                <button onclick="openDrawer('stickers')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-face-smile text-base text-yellow-400"></i><span class="text-[10px] font-medium">Stickers</span></button>
                <button onclick="openDrawer('draw')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-pen text-base text-rose-400"></i><span class="text-[10px] font-medium">Draw</span></button>
                <button onclick="openDrawer('lyrics')" class="flex-shrink-0 w-20 flex flex-col items-center gap-1 text-[#9ca3af] hover:text-white py-1 transition"><i class="fas fa-guitar text-base text-emerald-400"></i><span class="text-[10px] font-medium">Lyrics</span></button>
            </div>

            <!-- SUBMENUS -->
            <div id="submenu-edit" class="hidden submenu-grid">
                <button onclick="backToMaster()" class="bg-zinc-950 p-2 rounded text-center text-zinc-400 text-xs flex flex-col items-center gap-1"><i class="fas fa-arrow-left"></i>Back</button>
                <button onclick="triggerTool('Split')" class="bg-zinc-900 p-2 rounded text-center text-xs flex flex-col items-center gap-1 text-zinc-200"><i class="fas fa-scissors text-blue-400"></i>Split</button>
                <button onclick="triggerTool('Volume')" class="bg-zinc-900 p-2 rounded text-center text-xs flex flex-col items-center gap-1 text-zinc-200"><i class="fas fa-volume-high"></i>Volume</button>
                <button onclick="triggerTool('Delete')" class="bg-zinc-900 p-2 rounded text-center text-xs flex flex-col items-center gap-1 text-red-400"><i class="fas fa-trash"></i>Delete</button>
                <button onclick="triggerTool('Speed')" class="bg-zinc-900 p-2 rounded text-center text-xs flex flex-col items-center gap-1 text-zinc-200"><i class="fas fa-gauge-high"></i>Speed</button>
                <button onclick="triggerTool('Crop')" class="bg-zinc-900 p-2 rounded text-center text-xs flex flex-col items-center gap-1 text-zinc-200"><i class="fas fa-crop"></i>Crop</button>
                <button onclick="triggerTool('Duplicate')" class="bg-zinc-900 p-2 rounded text-center text-xs flex flex-col items-center gap-1 text-zinc-200"><i class="fas fa-clone"></i>Clone</button>
                <button onclick="triggerTool('Replace')" class="bg-zinc-900 p-2 rounded text-center text-xs flex flex-col items-center gap-1 text-zinc-200"><i class="fas fa-arrows-rotate"></i>Replace</button>
                <button onclick="triggerTool('Reverse')" class="bg-zinc-900 p-2 rounded text-center text-xs flex flex-col items-center gap-1 text-zinc-200"><i class="fas fa-backward"></i>Reverse</button>
            </div>

            <div id="submenu-audio" class="hidden submenu-grid">
                <button onclick="backToMaster()" class="bg-zinc-950 p-2 rounded text-center text-zinc-400 text-xs flex flex-col items-center gap-1"><i class="fas fa-arrow-left"></i>Back</button>
                <button onclick="document.getElementById('audio-extract-picker').click()" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-file-audio text-green-400"></i>Extract</button>
                <button onclick="openPixabayModal('sounds')" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-music"></i>Sounds</button>
                <button onclick="openPixabayModal('sound-fx')" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-bolt text-yellow-400"></i>FX</button>
                <button id="record-btn-ui" onclick="toggleVoiceRecording()" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i id="mic-icon-status" class="fas fa-microphone text-red-500"></i><span id="record-text-status">Record</span></button>
            </div>

            <div id="submenu-text" class="hidden submenu-grid">
                <button onclick="backToMaster()" class="bg-zinc-950 p-2 rounded text-center text-zinc-400 text-xs flex flex-col items-center gap-1"><i class="fas fa-arrow-left"></i>Back</button>
                <button onclick="openDrawer('templates')" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-paste text-amber-400"></i>Templates</button>
                <button onclick="openDrawer('fonts')" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-font text-blue-400"></i>Fonts</button>
                <button onclick="openDrawer('styles')" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-palette text-purple-400"></i>Styles</button>
                <button onclick="openDrawer('animations')" class="bg-zinc-900 p-2 rounded text-zinc-200 text-xs flex flex-col items-center gap-1"><i class="fas fa-film text-rose-400"></i>Animations</button>

    <script>
        // ============================================================
        // COMPLETE JAVASCRIPT
        // ============================================================

        let currentTextState = {
            text: "",
            font: "Inter",
            styleCSS: "color: #ffffff; text-shadow: none;",
            animation: "",
            bubbleCSS: "",
            opacity: 1
        };

        let customPresets = [];
        let textElementCounter = 0;
        let selectedTextElement = null;
        let audioTracks = [];
        let trackIdCounter = 0;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        // ===== MEDIA PLAYER =====
        const picker = document.getElementById('video-file-picker');
        const player = document.getElementById('studio-player');
        const imageEl = document.getElementById('studio-image');
        const placeholder = document.getElementById('media-placeholder');
        const timelineLabel = document.getElementById('timelineLabel');
        const playBtn = document.getElementById('playBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const ratioBox = document.getElementById('video-ratio-box');
        const elementsLayer = document.getElementById('canvas-elements-layer');
        const overlayImg = document.getElementById('overlay-display-img');

        picker.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            timelineLabel.innerText = file.name;
            placeholder.classList.add('hidden');
            if (file.type.startsWith('video/')) {
                imageEl.classList.add('hidden');
                player.classList.remove('hidden');
                player.src = URL.createObjectURL(file);
                player.muted = false;
                player.play();
                playBtn.innerHTML = `<i class="fas fa-pause text-xs"></i>`;
                setTimeout(syncCanvasSize, 100);
                addAudioTrack('Video Audio', URL.createObjectURL(file), 'track');
            } else {
                player.classList.add('hidden');
                imageEl.classList.remove('hidden');
                imageEl.src = URL.createObjectURL(file);
                timeDisplay.innerText = "00:00 / 00:05";
                setTimeout(syncCanvasSize, 100);
                // Image as video with 3 sec track
                addAudioTrack('Image Track', 'data:audio/mp3;base64,//uQx', 'track');
            }
        });

        function togglePlay() {
            if (player.src && !player.classList.contains('hidden')) {
                if (player.paused) {
                    player.play();
                    audioTracks.forEach(t => { if (t.playing) t.audio.play(); });
                    playBtn.innerHTML = `<i class="fas fa-pause text-xs"></i>`;
                } else {
                    player.pause();
                    audioTracks.forEach(t => { if (t.playing) t.audio.pause(); });
                    playBtn.innerHTML = `<i class="fas fa-play text-xs"></i>`;
                }
            }
        }

        player.addEventListener('timeupdate', () => {
            const current = formatTime(player.currentTime);
            const total = formatTime(player.duration || 0);
            timeDisplay.innerText = `${current} / ${total}`;
        });

        function formatTime(secs) {
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = Math.floor(secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // ===== AUDIO TRACKS =====
        function addAudioTrack(name, url, type = 'track') {
            const id = ++trackIdCounter;
            const audio = new Audio(url);
            audio.loop = false;
            audio.volume = 1.0;
            audioTracks.push({ id, name, audio, type, playing: false });
            updateTrackCount();
            renderWaveform();
            if (audioTracks.length === 1) {
                audio.play().catch(e => {});
                audioTracks[0].playing = true;
            }
            return audio;
        }

        function renderWaveform() {
            const container = document.getElementById('waveformBars');
            if (!container) return;
            const bars = container.querySelectorAll('.bar');
            bars.forEach((bar, i) => {
                const height = 20 + Math.random() * 80;
                bar.style.height = height + '%';
                bar.style.background = audioTracks.length > 0 ? '#34d399' : '#2a2a32';
            });
        }

        function updateTrackCount() {
            const el = document.getElementById('trackCount');
            if (el) el.textContent = `${audioTracks.length} tracks`;
        }

        function handleAudioExtracted(input) {
            const file = input.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            const trackName = file.name.replace(/\.[^/.]+$/, '') || 'Extracted';
            addAudioTrack(trackName, url, 'track');
            showSubmenu('audio');
            input.value = '';
        }

        // ===== PIXABAY =====
        const PIXABAY_API_KEY = '52778614-b103ae3cfe866a30cb154bd0a';

        function openPixabayModal(mode) {
            document.getElementById('pixabayModal').classList.remove('hidden');
            document.getElementById('pixabayMode').value = mode;
            document.getElementById('pixabayResults').classList.add('hidden');
            document.getElementById('pixabayResults').innerHTML = '';
            if (mode === 'sounds') {
                document.getElementById('pixabayTitle').innerText = "Free Music";
                document.getElementById('pixabayIcon').className = "fas fa-music text-purple-400";
            } else {
                document.getElementById('pixabayTitle').innerText = "Sound Effects";
                document.getElementById('pixabayIcon').className = "fas fa-bolt text-yellow-400";
            }
        }

        function closePixabayModal() {
            document.getElementById('pixabayModal').classList.add('hidden');
        }

        async function searchPixabayAudio() {
            const query = document.getElementById('pixabayQuery').value.trim() || 'music';
            const mode = document.getElementById('pixabayMode').value;
            const resultsDiv = document.getElementById('pixabayResults');
            resultsDiv.classList.remove('hidden');
            resultsDiv.innerHTML = '<p class="text-zinc-500 text-xs text-center py-4"><i class="fas fa-spinner fa-spin mr-2"></i>Searching...</p>';

            try {
                const url = `https://pixabay.com/api/?key=${PIXABAY_API_KEY}&q=${encodeURIComponent(query)}&category=${mode === 'sounds' ? 'music' : 'sound-effects'}&per_page=20`;
                const response = await fetch(url);
                const data = await response.json();
                resultsDiv.innerHTML = '';
                let tracks = [];

                if (data.hits && data.hits.length > 0) {
                    tracks = data.hits.map(hit => ({ title: hit.tags || 'Track', url: hit.audio || hit.previewURL }));
                } else {
                    tracks = [
                        { title: 'Vlog Beat', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
                        { title: 'LoFi Chill', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
                        { title: 'Cinematic', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' }
                    ];
                }

                tracks.forEach(track => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between p-2.5 bg-[#1b1b22] border border-zinc-800 rounded-xl mb-1.5';
                    row.innerHTML = `
                        <span class="text-xs font-medium text-zinc-200 truncate max-w-[200px]">${track.title}</span>
                        <button class="bg-purple-600 text-[10px] font-bold text-white px-3 py-1.5 rounded-lg hover:bg-purple-500 transition">Apply</button>
                    `;
                    row.querySelector('button').onclick = () => {
                        const trackType = mode === 'sound-fx' ? 'fx' : 'track';
                        addAudioTrack(track.title, track.url, trackType);
                        closePixabayModal();
                        showSubmenu('audio');
                    };
                    resultsDiv.appendChild(row);
                });
            } catch (error) {
                resultsDiv.innerHTML = '<p class="text-zinc-400 text-xs text-center py-4">Error loading tracks</p>';
            }
        }

        // ===== VOICE RECORDING =====
        async function toggleVoiceRecording() {
            const recordText = document.getElementById('record-text-status');
            const micIcon = document.getElementById('mic-icon-status');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    recordedChunks = [];
                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(recordedChunks, { type: 'audio/mp3' });
                        const url = URL.createObjectURL(audioBlob);
                        addAudioTrack('Voice Recording', url, 'track');
                        showSubmenu('audio');
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    recordText.innerText = "Stop";
                    micIcon.className = "fas fa-stop text-red-500 animate-pulse";
                } catch (err) {
                    alert("Microphone Error: " + err.message);
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordText.innerText = "Record";
                micIcon.className = "fas fa-microphone text-red-500";
            }
        }

        // ===== TEXT ELEMENTS =====
        function createTextElementOnCanvas(text, styleCSS = '', font = 'Inter', bubbleCSS = '', animation = '', opacity = 1) {
            const wrapper = document.createElement('div');
            wrapper.className = 'canvas-text-item';
            wrapper.id = `text-${++textElementCounter}`;
            
            const randomX = 20 + Math.random() * 60;
            const randomY = 20 + Math.random() * 60;
            wrapper.style.left = randomX + '%';
            wrapper.style.top = randomY + '%';
            wrapper.style.transform = 'translate(-50%, -50%)';
            wrapper.style.opacity = opacity;
            
            const textSpan = document.createElement('span');
            textSpan.className = 'text-content';
            textSpan.innerText = text || 'Enter Text';
            textSpan.style.cssText = `${styleCSS}; font-family: '${font}'; ${bubbleCSS}`;
            
            if (animation) {
                const animCSS = getAnimationCSS(animation);
                if (animCSS) textSpan.style.cssText += `; ${animCSS}`;
            }
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '×';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deleteTextElement(wrapper.id);
            };
            
            wrapper.appendChild(textSpan);
            wrapper.appendChild(deleteBtn);
            elementsLayer.appendChild(wrapper);
            wrapper.style.pointerEvents = 'auto';
            setupDrag(wrapper);
            
            wrapper.addEventListener('click', (e) => {
                if (e.target.classList.contains('delete-btn')) return;
                selectTextElement(wrapper);
            });
            
            // Add to timeline track
            addTextTrack(text);
            
            return wrapper;
        }

        function addTextTrack(text) {
            // Show text in timeline
            const trackContainer = document.querySelector('.waveform-track');
            const label = document.createElement('span');
            label.className = 'text-[8px] text-emerald-400 font-mono ml-2';
            label.innerText = `📝 ${text.substring(0, 10)}...`;
            trackContainer.appendChild(label);
            setTimeout(() => { if (label.parentNode) label.remove(); }, 3000);
        }

        function getAnimationCSS(animation) {
            const animMap = {
                'Fade In': 'animation: textFadeIn 0.5s ease-out;',
                'Bounce': 'animation: textBounce 0.6s ease-in-out infinite;',
                'Slide In': 'animation: textSlideIn 0.5s ease-out;',
                'Glow Pulse': 'animation: textGlow 1.5s ease-in-out infinite;',
                'Rotate': 'animation: textRotate 0.3s ease-in-out infinite alternate;',
                'Pulse': 'animation: textPulse 1s ease-in-out infinite;',
                'Wave': 'animation: textWave 0.5s ease-in-out infinite;',
                'Shake': 'animation: textShake 0.3s ease-in-out infinite;',
                'Flip': 'animation: textFlip 0.6s ease-in-out;',
                'Zoom In': 'animation: textZoom 0.4s ease-out;',
                'Neon Pulse': 'animation: textNeonPulse 1.5s ease-in-out infinite;',
                'Rainbow': 'animation: textRainbow 2s linear infinite;'
            };
            return animMap[animation] || '';
        }

        function selectTextElement(element) {
            if (selectedTextElement) selectedTextElement.classList.remove('selected');
            selectedTextElement = element;
            element.classList.add('selected');
        }

        function deleteTextElement(id) {
            const el = document.getElementById(id);
            if (el) {
                if (selectedTextElement === el) selectedTextElement = null;
                el.style.transition = 'all 0.2s';
                el.style.transform = 'scale(0.8)';
                el.style.opacity = '0';
                setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
            }
        }

        function setupDrag(element) {
            let isDragging = false;
            let startX, startY, startLeft, startTop;
            
            element.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('delete-btn')) return;
                isDragging = true;
                element.classList.add('dragging');
                const leftPercent = parseFloat(element.style.left) || 50;
                const topPercent = parseFloat(element.style.top) || 50;
                startX = e.clientX;
                startY = e.clientY;
                startLeft = leftPercent;
                startTop = topPercent;
                e.preventDefault();
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const containerRect = element.parentElement.getBoundingClientRect();
                const deltaX = (e.clientX - startX) / containerRect.width * 100;
                const deltaY = (e.clientY - startY) / containerRect.height * 100;
                let newLeft = Math.max(0, Math.min(100, startLeft + deltaX));
                let newTop = Math.max(0, Math.min(100, startTop + deltaY));
                element.style.left = newLeft + '%';
                element.style.top = newTop + '%';
                e.preventDefault();
            });
            
            document.addEventListener('mouseup', () => {
                if (isDragging) { isDragging = false; element.classList.remove('dragging'); }
            });
        }

        function applyNewTextToCanvas() {
            const text = document.getElementById('liveTextInput').value || 'Text';
            createTextElementOnCanvas(
                text, 
                currentTextState.styleCSS, 
                currentTextState.font, 
                currentTextState.bubbleCSS,
                currentTextState.animation,
                currentTextState.opacity
            );
            closeDrawer();
        }

        function updateLiveTextPreview() {
            const text = document.getElementById('liveTextInput').value || '';
            let previewEl = document.getElementById('live-canvas-text-preview');
            if (!previewEl) {
                previewEl = document.createElement('div');
                previewEl.id = 'live-canvas-text-preview';
                previewEl.className = 'absolute z-45 p-2 select-none pointer-events-none opacity-50';
                elementsLayer.appendChild(previewEl);
            }
            previewEl.style.cssText = `${currentTextState.styleCSS}; font-family: '${currentTextState.font}'; ${currentTextState.bubbleCSS}; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: ${currentTextState.opacity * 0.5}; pointer-events: none; z-index: 45;`;
            if (currentTextState.animation) {
                const animCSS = getAnimationCSS(currentTextState.animation);
                if (animCSS) previewEl.style.cssText += `; ${animCSS}`;
            }
            previewEl.innerText = text || 'Preview';
        }

        // ===== UNLIMITED GENERATORS =====
        function generateUnlimitedTemplates(count = 1000) {
            const templates = [];
            const styles = ['Neon','Glow','Shadow','Gradient','3D','Glass','Chrome','Gold','Silver','Retro','Vintage','Cyber','Hologram','Crystal','Fire','Ice','Water','Sand','Metal','Wood','Paper','Ink','Paint','Sketch','Pixel','Vector','Minimal','Maximal','Elegant','Bold','Soft','Dreamy','Dark','Light','Colorful','Monochrome','Pastel','Vibrant','Muted','Royal','Luxury','Modern','Classic','Rustic','Industrial','Gothic','Steampunk','Cyberpunk','ArtDeco','Bauhaus','PopArt','Surreal','Abstract','Geometric','Organic'];
            const fonts = ['Inter','Bebas Neue','Orbitron','Pacifico','Permanent Marker','Lobster','Cinzel','Bangers','Abril Fatface','Anton'];
            const words = ['STYLE','DESIGN','CREATE','VISION','DREAM','LIVE','LOVE','ART','SOUL','VIBE','GOLD','CORE','PURE','TRUE','BOLD','WILD','FREE','STAR','MOON','SUN','FIRE','ICE','WAVE','STORM','LIGHT','DARK','GLOW','SHINE','SPARK','BLAZE'];
            
            for (let i = 0; i < count; i++) {
                const style = styles[i % styles.length];
                const font = fonts[i % fonts.length];
                const word = words[i % words.length];
                const hue = (i * 37 + 180) % 360;

        function generateUnlimitedStyles(count = 1000) {

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let brushSize = 5;
        let drawActive = false;

        function syncCanvasSize() {
            canvas.width = ratioBox.clientWidth;
            canvas.height = ratioBox.clientHeight;
        }
        window.addEventListener('resize', syncCanvasSize);

        function toggleDraw() {
            drawActive = !drawActive;
            const panel = document.getElementById('drawToolsPanel');
            if (drawActive) {
                canvas.classList.add('active');
                panel.classList.remove('hidden');
                panel.classList.add('flex');
                syncCanvasSize();
                showNotification('✏️ Draw mode ON');
            } else {
                canvas.classList.remove('active');
                panel.classList.add('hidden');
                showNotification('✏️ Draw mode OFF');
            }
        }

        function clearDraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            showNotification('🗑️ Drawing cleared!');
        }

        function setBrush(size) {
            brushSize = size;
            showNotification(`🖊️ Brush: ${size}px`);
        }

        canvas.addEventListener('mousedown', (e) => {
            if (!drawActive) return;
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.beginPath();
            ctx.moveTo(x, y);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || !drawActive) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.strokeStyle = drawColor;
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        });

        canvas.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mouseleave', () => { isDrawing = false; });

        // ===== PRESETS =====
        function saveCurrentPreset() {
            const presetName = `Preset #${customPresets.length + 1}`;
            customPresets.push({
                name: presetName,
                font: currentTextState.font,
                styleCSS: currentTextState.styleCSS,
                bubbleCSS: currentTextState.bubbleCSS,
                animation: currentTextState.animation,
                opacity: currentTextState.opacity
            });
            showNotification(`✅ "${presetName}" saved!`);
            renderSavedPresets();
        }

        function renderSavedPresets() {
            const list = document.getElementById('savedPresetsList');
            if (!list) return;
            if (customPresets.length === 0) {
                list.innerHTML = `<div class="text-zinc-600 text-xs col-span-2 py-4 text-center">No presets yet</div>`;
                return;
            }
            list.innerHTML = '';
            customPresets.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = 'bg-[#22222a] border border-zinc-800 rounded-xl p-3 cursor-pointer hover:border-blue-500 transition text-center';
                item.innerHTML = `<span class="text-[7px] text-zinc-400 block font-mono mb-1">Preset ${idx+1}</span><span class="text-xs font-bold block truncate" style="${p.styleCSS}; font-family: '${p.font}';">${p.name}</span>`;
                item.onclick = () => {
                    currentTextState.font = p.font;
                    currentTextState.styleCSS = p.styleCSS;
                    currentTextState.bubbleCSS = p.bubbleCSS;
                    currentTextState.animation = p.animation || '';
                    currentTextState.opacity = p.opacity || 1;
                    updateLiveTextPreview();
                    if (selectedTextElement) {
                        const span = selectedTextElement.querySelector('.text-content');
                        if (span) {
                            span.style.cssText = `${p.styleCSS}; font-family: '${p.font}'; ${p.bubbleCSS}`;
                            if (p.animation) { const animCSS = getAnimationCSS(p.animation); if (animCSS) span.style.cssText += `; ${animCSS}`; }
                        }
                        selectedTextElement.style.opacity = p.opacity || 1;
                    }
                    showNotification(`✅ "${p.name}" applied!`);
                };
                list.appendChild(item);
            });
        }

        // ===== NAVIGATION =====
        function showSubmenu(id) {
            backToMaster();
            document.getElementById('masterBottomMenu').classList.add('hidden');
            const sub = document.getElementById(`submenu-${id}`);
            if (sub) sub.classList.remove('hidden');
        }

        function backToMaster() {
            const subs = ['edit','audio','text','effects','overlay','caption','filters','adjust'];
            subs.forEach(s => { const el = document.getElementById(`submenu-${s}`); if (el) el.classList.add('hidden'); });
            document.getElementById('masterBottomMenu').classList.remove('hidden');
        }

        function triggerTool(name) { showNotification(`🔧 "${name}" triggered!`); }
        function handleOverlaySelected(input) {
            const file = input.files[0];
            if (file) { overlayImg.src = URL.createObjectURL(file); overlayImg.classList.remove('hidden'); showNotification('🖼️ Overlay added!'); }
        }
        function applyCSSFilter(filterValue) { player.style.filter = filterValue; imageEl.style.filter = filterValue; showNotification('🎨 Filter applied!'); }
        function adjustBrightness(val) { applyCSSFilter(`brightness(${val}%)`); }

        // ===== EXPORT =====
        function showExportDialog() { document.getElementById('exportDialog').classList.remove('hidden'); }
        function closeExportDialog() { document.getElementById('exportDialog').classList.add('hidden'); }
        function exportProject(type) {
            const trackCount = audioTracks.length;
            let msg = `📦 Exporting ${type.toUpperCase()}...\nTracks: ${trackCount}\n`;
            audioTracks.forEach((t, i) => msg += `  ${i+1}. ${t.name}\n`);
            msg += `\n✅ Export complete!`;
            alert(msg);
            closeExportDialog();
        }

        // ===== DRAWER =====
        function openDrawer(type) {
            const drawer = document.getElementById('editorDrawer');
            drawer.classList.add('open');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const tabMap = {
                'templates': 'tab-templates',
                'fonts': 'tab-fonts',
                'styles': 'tab-styles',
                'animations': 'tab-animations',
                'bubbles': 'tab-bubbles',
                'presets': 'tab-presets',
                'stickers': 'tab-stickers',
                'draw': 'tab-draw',
                'lyrics': 'tab-lyrics'
            };
            const tabId = tabMap[type] || 'tab-templates';
            const tabBtn = document.getElementById(tabId);
            if (tabBtn) tabBtn.classList.add('active');
            document.getElementById('drawerTitle').innerText = type.charAt(0).toUpperCase() + type.slice(1);
            renderTextTabContent(type);
        }

        function switchTextTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.getElementById('drawerTitle').innerText = tabId.charAt(0).toUpperCase() + tabId.slice(1);
            renderTextTabContent(tabId);
        }

        function closeDrawer() { document.getElementById('editorDrawer').classList.remove('open'); }

        // ===== NOTIFICATION =====
        function showNotification(msg) {
            const el = document.createElement('div');
            el.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white text-xs px-4 py-2 rounded-full z-[500] opacity-0 transition-opacity duration-300';
            el.innerText = msg;
            document.body.appendChild(el);
            setTimeout(() => el.style.opacity = '1', 10);
            setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            }, 2000);
        }

        // ===== INIT =====
        setTimeout(syncCanvasSize, 300);
        updateTrackCount();
        renderWaveform();
        document.getElementById('liveTextInput').value = '';
        showNotification('🚀 Dravoo Pro Editor Ready!');
        console.log('✅ All features working!');
    </script>
</body>
</html>
