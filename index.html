<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dravoo Studio Pro</title>
    <!-- Google Fonts Imports for 100+ Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bungee&family=Lobster&family=Pacifico&family=Rubik&family=Oswald&family=Roboto&family=Montserrat&family=Open+Sans&family=Poiret+One&family=Righteous&family=Fredoka+One&family=Concert+One&family=Almarai&family=Amiri&family=Tajawal&family=Cairo&family=Changa&family=El+Messiri&family=Lateef&family=Mada&family=Reem+Kufi&family=Lemonada&family=Mirza&family=Harmattan&family=Kufam&family=Aref+Ruqaa&family=Vibes&family=Cinzel&family=Playfair+Display&family=Abel&family=Abril+Fatface&family=Acme&family=Alfa+Slab+One&family=Architects+Daughter&family=Asap&family=Bad+Script&family=Bebas+Neue&family=Berkshire+Swash&family=Caveat&family=Chewy&family=Comfortaa&family=Courgette&family=Creepster&family=Dancing+Script&family=Domine&family=Exo&family=Fascinate&family=Fjalla+One&family=Fugaz+One&family=Great+Vibes&family=Indie+Flower&family=Josefin+Sans&family=Kanit&family=Kaushan+Script&family=Krona+One&family=Lalezar&family=Lato&family=Lilita+One&family=Luckiest+Guy&family=Marck+Script&family=Merienda&family=Modak&family=Monoton&family=Nanum+Pen+Script&family=Niconne&family=水+Oleo+Script&family=Orbitron&family=Overpass&family=Parisienne&family=Patua+One&family=Permanent+Marker&family=Press+Start+2P&family=Quicksand&family=Sacramento&family=Saira&family=Satisfy&family=Shadows+Into+Light&family=Sigmar+One&family=Skranji&family=Slamming&family=Special+Elite&family=Spicy+Rice&family=Squada+One&family=Staatliches&family=Sweet+Avenue&family=Teko&family=Titan+One&family=Uncial+Antiqua&family=Vampiro+One&family=Volkhov&family=Yellowtail&family=Zcool+XiaoWei&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0f0f12;
            --panel-bg: #1a1a22;
            --accent-blue: #0076ff;
            --text-light: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #2c2c35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            height: 100vh;
        }

        /* --- LANDING / ROUTING SYSTEM --- */
        #landing-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .brand-header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo-icon {
            color: var(--accent-blue);
        }

        .user-badge {
            background: #1c1c24;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            border: 1px solid var(--border-color);
        }

        .pro-tag {
            background: linear-gradient(45deg, #ff007b, #9900ff);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: bold;
        }

        .action-cards {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-main {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn-project {
            background-color: var(--accent-blue);
            color: white;
        }

        .btn-ai {
            background: linear-gradient(90deg, #8a2be2, #4a00e0);
            color: white;
        }

        .prompt-bar {
            background: #16161e;
            border: 1px dashed var(--border-color);
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            width: 100%;
            max-width: 400px;
        }

        /* --- MAIN STUDIO PAGE (Hidden by default) --- */
        #studio-page {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            background: #000;
        }

        .studio-top-nav {
            height: 60px;
            background: var(--panel-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-to-dashboard {
            cursor: pointer;
            font-size: 18px;
            color: var(--text-muted);
        }

        .export-btn {
            background: #1fd1f9;
            background: linear-gradient(90deg, #1fd1f9 0%, #b621fe 100%);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* --- CANVAS VIEWER & WATERMARK OVERLAY --- */
        .preview-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #09090b;
            overflow: hidden;
            padding: 10px;
        }

        .canvas-wrapper {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
            max-width: 100%;
            max-height: 70%;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #main-video-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Dynamic Text Layer Over Video */
        #text-overlay-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
            opacity: 1;
        }

        /* --- CONTROL BAR OVERLAY (As in Image 3) --- */
        .playback-hud {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 8;
        }

        .hud-btn {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .hud-time {
            font-size: 12px;
            color: var(--text-muted);
            font-family: monospace;
        }

        /* --- TIMELINE TRACK SYSTEM --- */
        .timeline-area {
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-row {
            background: #13131a;
            border-radius: 8px;
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            position: relative;
            border: 1px solid #22222b;
        }

        .track-label {
            width: 80px;
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .track-block {
            flex: 1;
            background: #2a2a38;
            height: 34px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 12px;
            color: #ccc;
            border-left: 4px solid var(--accent-blue);
            position: relative;
        }

        .mute-toggle-btn {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            margin-right: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .mute-toggle-btn.muted {
            background: #444;
        }

        /* --- CONTROL TABS PANEL (As in Image 2) --- */
        .studio-tabs-container {
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 320px;
        }

        .tab-headers {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue);
            background: rgba(0, 118, 255, 0.05);
        }

        .tab-contents {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        /* Text Input Bar Custom Control */
        .text-modifier-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .text-modifier-wrapper input[type="text"] {
            flex: 1;
            background: #111;
            border: 1px solid var(--border-color);
            padding: 10px;
            color: white;
            border-radius: 8px;
        }

        /* GRID SYSTEM (2 Across Layout as Requested for Templates) */
        .grid-layout-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* GRID SYSTEM (3 Across for Fonts / Styles / Animations) */
        .grid-layout-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .item-card {
            background: #20202a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 65px;
        }

        .item-card:hover {
            border-color: var(--accent-blue);
            background: #252535;
        }

        /* Custom Sliders for Opacity and Scaling */
        .slider-group {
            margin-bottom: 15px;
        }

        .slider-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .slider-control {
            width: 100%;
            accent-color: var(--accent-blue);
        }

        /* Color Palette Matrix Picker */
        .color-matrix {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .color-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-dot.active {
            border-color: white;
        }

        /* Bottom Macro Toolbar Menu Icons */
        .macro-toolbar {
            height: 65px;
            background: #111116;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .macro-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            gap: 4px;
        }

        .macro-item i {
            font-size: 18px;
        }

        .macro-item.active {
            color: var(--text-light);
        }

        /* Hidden standard HTML inputs */
        #hidden-video-loader {
            display: none;
        }

        /* KEYFRAME ANIMATIONS LIST (100% WORKING ENGINE) */
        @keyframes custom-fade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes custom-bounce { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.15); } }
        @keyframes custom-slide-left { from { left: -100%; transform: translate(0, -50%); } to { left: 50%; transform: translate(-50%, -50%); } }
        @keyframes custom-spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes custom-zoom { from { transform: translate(-50%, -50%) scale(0); } to { transform: translate(-50%, -50%) scale(1); } }
        @keyframes custom-pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
        @keyframes custom-shake { 0%, 100% { transform: translate(-50%, -50%); } 20%, 60% { transform: translate(-52%, -50%); } 40%, 80% { transform: translate(-48%, -50%); } }
        @keyframes custom-flip { from { transform: translate(-50%, -50%) rotateY(0); } to { transform: translate(-50%, -50%) rotateY(360deg); } }
    </style>
</head>
<body>

    <!-- ================= 1. NEW ROUTED LANDING PAGE ================= -->
    <div id="landing-page">
        <div class="brand-header">
            <div class="logo-container">
                <i class="fa-solid fa-clapperboard logo-icon"></i>
                <span>DRAVOO</span>
            </div>
            <div class="user-badge">
                <span>Mannat Khan</span>
                <span class="pro-tag">PRO MEMBER</span>
                <i class="fa-solid fa-right-from-bracket" style="color: #ff3b30; margin-left: 5px;"></i>
            </div>
        </div>

        <div class="action-cards">
            <!-- Launching New Studio Screen Page on Click -->
            <button class="btn-main btn-project" onclick="navigateToStudio()">
                <i class="fa-solid fa-plus"></i> New Project
            </button>
            <button class="btn-main btn-ai">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Create with AI
            </button>
        </div>

        <div class="prompt-bar">
            <i class="fa-solid fa-sparkles"></i> Try prompt: <span style="color: #fff;">"dragon flying over cliffs"</span> or <span style="color: #fff;">"UF..."</span>
        </div>
    </div>


    <!-- ================= 2. ISOLATED STUDIO SCREEN WORKSPACE ================= -->
    <div id="studio-page">
        <!-- Top Navigation Engine Header -->
        <div class="studio-top-nav">
            <div class="nav-left">
                <i class="fa-solid fa-chevron-left back-to-dashboard" onclick="navigateToDashboard()" title="Back to Dashboard"></i>
                <span style="font-weight: 600; font-size: 15px;">Studio Workspace</span>
            </div>
            
            <div style="display: flex; gap: 12px; align-items: center;">
                <select id="render-resolution-preset" style="background:#20202a; color:white; border:1px solid var(--border-color); padding:6px; border-radius:6px; font-size:12px;">
                    <option value="1080p">1080P FHD</option>
                    <option value="720p">720P HD</option>
                    <option value="4k">4K UltraHD</option>
                </select>
                <!-- Optimized Client Side Video Export Engine -->
                <button class="export-btn" onclick="executeStudioVideoExport()">
                    <i class="fa-solid fa-download"></i> EXPORT
                </button>
            </div>
        </div>

        <!-- Video Player Display Space Layer -->
        <div class="preview-container">
            <div class="canvas-wrapper" id="studio-viewport-frame">
                <!-- Live text node dynamic injector layer -->
                <div id="text-overlay-layer">Dravoo Layer</div>
                <video id="main-video-canvas" loop muted playsinline></video>
            </div>

            <!-- UI Player HUD Controllers Matrix (Image 3 Aspect Alignment) -->
            <div class="playback-hud">
                <button class="hud-btn" onclick="toggleCanvasViewportFullscreen()" title="Fullscreen">
                    <i class="fa-solid fa-expand"></i>
                </button>
                <div class="hud-time" id="hud-time-display">00:00 / 00:00</div>
                <button class="hud-btn" id="hud-play-trigger" onclick="triggerCanvasPlayback()" style="font-size: 20px;">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="hud-btn" onclick="resetCanvasPlayback()" title="Reset Timeline">
                    <i class="fa-solid fa-arrow-rotate-left"></i>
                </button>
            </div>
        </div>

        <!-- Interactive Tracks Timeline Monitor Area -->
        <div class="timeline-area">
            <!-- Video Track Core Row Container -->
            <div class="track-row">
                <div class="track-label">
                    <i class="fa-solid fa-video"></i> Video Track
                </div>
                <!-- Native Audio Mute Controller Injection Module -->
                <button class="mute-toggle-btn" id="audio-mute-switcher" onclick="toggleVideoTrackAudioSource()">
                    <i class="fa-solid fa-volume-high"></i> Mute clip
                </button>
                <div class="track-block" id="timeline-video-meta-block">
                    No Media Clip Imported
                </div>
            </div>

            <!-- Text Layer Control Overlay Track -->
            <div class="track-row">
                <div class="track-label">
                    <i class="fa-solid fa-font"></i> Text Track
                </div>
                <div class="track-block" style="border-left-color: #e67e22; background: #342518;" id="timeline-text-meta-block">
                    Dravoo Layer
                </div>
            </div>
        </div>

        <!-- Tabs Navigation Selector Engine Panel Matrix Container -->
        <div class="studio-tabs-container">
            <div class="tab-headers">
                <button class="tab-btn active" onclick="switchActiveStudioTab('tab-templates')">Templates</button>
                <button class="tab-btn" onclick="switchActiveStudioTab('tab-fonts')">Fonts</button>
                <button class="tab-btn" onclick="switchActiveStudioTab('tab-styles')">Styles</button>
                <button class="tab-btn" onclick="switchActiveStudioTab('tab-animations')">Animations</button>
            </div>

            <div class="tab-contents">
                <!-- Tab A: 100+ Extensive Pre-engineered Typography Templates (2 Items Per Row Layout) -->
                <div class="tab-panel active" id="tab-templates">
                    <div class="grid-layout-2" id="templates-injection-matrix">
                        <!-- Generative Javascript Output Automation Target Node -->
                    </div>
                </div>

                <!-- Tab B: 100+ Custom Typography Fonts Selector Engine Panel -->
                <div class="tab-panel" id="tab-fonts">
                    <div class="text-modifier-wrapper">
                        <input type="text" id="layer-text-string-input" value="Dravoo Layer" placeholder="Edit Text Content Here..." oninput="syncLiveTextOverlayStringValue()">
                    </div>
                    <div class="grid-layout-3" id="fonts-injection-matrix">
                        <!-- Generative Javascript Output Automation Target Node -->
                    </div>
                </div>

                <!-- Tab C: Core Custom Styling Matrix Control Center Hub -->
                <div class="tab-panel" id="tab-styles">
                    <div class="slider-group">
                        <label>Text Fill Custom Color Block</label>
                        <div class="color-matrix" id="style-color-dot-matrix">
                            <!-- Generative Palette Injection Node Block -->
                        </div>
                    </div>
                    <div class="slider-group">
                        <label>Font Scale Sizing Controller</label>
                        <input type="range" class="slider-control" id="control-text-font-size" min="14" max="100" value="28" oninput="applyLiveStyleAdjustments()">
                    </div>
                    <!-- Opacity Controller Request Integration Component -->
                    <div class="slider-group">
                        <label>Layer Transparent Opacity Level Selector</label>
                        <input type="range" class="slider-control" id="control-text-layer-opacity" min="0" max="100" value="100" oninput="applyLiveStyleAdjustments()">
                    </div>
                </div>

                <!-- Tab D: 100+ Parametric Motion Graph Animation Engine Framework Panel -->
                <div class="tab-panel" id="tab-animations">
                    <div class="grid-layout-3" id="animations-injection-matrix">
                        <!-- Generative Javascript Output Automation Target Node -->
                    </div>
                </div>
            </div>

            <!-- Bottom Functional Macro Interaction Task Toolbar Launcher Grid -->
            <div class="macro-toolbar">
                <div class="macro-item" onclick="triggerHiddenVideoHardwareImport()">
                    <i class="fa-solid fa-file-video"></i>
                    <span>Import File</span>
                </div>
                <div class="macro-item" onclick="switchActiveStudioTab('tab-fonts')">
                    <i class="fa-solid fa-t"></i>
                    <span>Add text</span>
                </div>
                <div class="macro-item" onclick="switchActiveStudioTab('tab-templates')">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Templates</span>
                </div>
                <div class="macro-item" onclick="switchActiveStudioTab('tab-animations')">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Animations</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Native File Device Uploader System Component Hook -->
    <input type="file" id="hidden-video-loader" accept="video/*" onchange="processImportedVideoFileStream(event)">

    <!-- ================= 3. SYSTEM MANAGEMENT DRIVER ENGINE JAVASCRIPT ================= -->
    <script>
        // System Internal Variable Register State Engine Storage Objects
        let videoTrackObjectReference = document.getElementById('main-video-canvas');
        let textOverlayLayerContainer = document.getElementById('text-overlay-layer');
        let isVideoTrackAudioMuted = true; // Default initialization

        // 1. Core Page Navigation Core Engine Routing Switches
        function navigateToStudio() {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('studio-page').style.display = 'flex';
        }

        function navigateToDashboard() {
            document.getElementById('studio-page').style.display = 'none';
            document.getElementById('landing-page').style.display = 'flex';
            if(videoTrackObjectReference) videoTrackObjectReference.pause();
        }

        // 2. Tab Navigation System Tab Layout Panel Switch Engine Tracker
        function switchActiveStudioTab(targetPanelElementID) {
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(targetPanelElementID).classList.add('active');
            
            // Map Header button highlight focus toggle routines
            let currentTabButtons = document.querySelectorAll('.tab-btn');
            if(targetPanelElementID === 'tab-templates') currentTabButtons[0].classList.add('active');
            if(targetPanelElementID === 'tab-fonts') currentTabButtons[1].classList.add('active');
            if(targetPanelElementID === 'tab-styles') currentTabButtons[2].classList.add('active');
            if(targetPanelElementID === 'tab-animations') currentTabButtons[3].classList.add('active');
        }

        // 3. Automated Generative 100+ Template Database Array Injector Loop
        function initializeExtendedTemplatesDatabase() {
            const templateMatrixContainer = document.getElementById('templates-injection-matrix');
            const masterTemplateNichesList = [
                'ABC SMART', 'LET\'S GO', 'MINIMALIST', 'CYBER NEON', 'GAMING ULTRA', 'DAILY DRIFT', 
                'VIBE WAVE', 'TIKTOK NEON', 'DRAVOO AURA', 'TECH REVIEW', 'URBAN VIBES', 'FITNESS BEAST',

        // 6. Color Management System Core Palette Array Generators
        function initializeColorStylesPaletteMatrix() {
            const colorMatrixContainer = document.getElementById('style-color-dot-matrix');
            const discretePaletteHexCodes = [
                '#ffffff', '#ff3b30', '#4cd964', '#0076ff', '#ffcc00', '#5856d6', '#ff2d55', '#5ac8fa',
                '#000000', '#e67e22', '#9b59b6', '#1abc9c', '#f1c40f', '#34495e', '#e74c3c', '#2ecc71'
            ];
            
            let contentHTMLBuffer = '';
            discretePaletteHexCodes.forEach((hexValue, index) => {
                let isActiveDefault = index === 0 ? 'active' : '';
                contentHTMLBuffer += `<div class="color-dot ${isActiveDefault}" style="background-color: ${hexValue};" onclick="selectActiveColorHexValue(this, '${hexValue}')"></div>`;
            });
            colorMatrixContainer.innerHTML = contentHTMLBuffer;
        }

        // 7. Viewport Dynamic Update Engine Sync Bindings Functions
        function syncLiveTextOverlayStringValue() {
            let userInputValue = document.getElementById('layer-text-string-input').value;
            textOverlayLayerContainer.innerText = userInputValue;
            document.getElementById('timeline-text-meta-block').innerText = userInputValue;
        }

        function applyFontFamilyToOverlay(targetFontFamilyName) {
            textOverlayLayerContainer.style.fontFamily = `"${targetFontFamilyName}", sans-serif`;
        }

        function selectActiveColorHexValue(selectedElementNode, selectedHexColorCode) {
            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
            selectedElementNode.classList.add('active');
            textOverlayLayerContainer.style.color = selectedHexColorCode;
        }

        function applyLiveStyleAdjustments() {
            let fontSizeSliderValue = document.getElementById('control-text-font-size').value;
            let opacitySliderValue = document.getElementById('control-text-layer-opacity').value;
            
            textOverlayLayerContainer.style.fontSize = fontSizeSliderValue + 'px';
            textOverlayLayerContainer.style.opacity = (opacitySliderValue / 100);
        }

        function applyLiveAnimationToOverlay(inlineCSSAnimationValueString) {
            textOverlayLayerContainer.style.animation = 'none';
            textOverlayLayerContainer.offsetHeight; // Force DOM browser reflow routine
            textOverlayLayerContainer.style.animation = inlineCSSAnimationValueString;
        }

        function injectTemplatePresetToViewport(templateTextValueString) {
            document.getElementById('layer-text-string-input').value = templateTextValueString;
            syncLiveTextOverlayStringValue();
            applyLiveAnimationToOverlay('custom-bounce 2s infinite ease-in-out');
        }

        // 8. Device Hardware Native Storage Video Importer Module Functions
        function triggerHiddenVideoHardwareImport() {
            document.getElementById('hidden-video-loader').click();
        }

        function processImportedVideoFileStream(uploadEventContext) {
            const rawFileObject = uploadEventContext.target.files[0];
            if (rawFileObject) {
                const generatedBlobObjectURL = URL.createObjectURL(rawFileObject);
                videoTrackObjectReference.src = generatedBlobObjectURL;
                videoTrackObjectReference.load();
                
                // Reset initial UI states on successful asset ingestion
                document.getElementById('timeline-video-meta-block').innerText = rawFileObject.name.substring(0, 22) + '...';
                document.getElementById('timeline-video-meta-block').style.background = '#1a2e22';
                document.getElementById('timeline-video-meta-block').style.borderLeftColor = '#2ecc71';
                
                // Enforce tracking audio properties state definitions
                applyVideoMuteAudioTrackState();
                
                videoTrackObjectReference.onloadedmetadata = function() {
                    updateTrackPlaybackHUDTimeCounters();
                };
            }
        }

        // 9. Core Video Track Native Audio Mute Controller Functional Implementation
        function toggleVideoTrackAudioSource() {
            isVideoTrackAudioMuted = !isVideoTrackAudioMuted;
            applyVideoMuteAudioTrackState();
        }

        function applyVideoMuteAudioTrackState() {
            const muteButtonNode = document.getElementById('audio-mute-switcher');
            if (isVideoTrackAudioMuted) {
                videoTrackObjectReference.muted = true;
                muteButtonNode.innerHTML = '<i class="fa-solid fa-volume-xmark"></i> Clip Muted';
                muteButtonNode.classList.add('muted');
            } else {
                videoTrackObjectReference.muted = false;
                muteButtonNode.innerHTML = '<i class="fa-solid fa-volume-high"></i> Mute clip';
                muteButtonNode.classList.remove('muted');
            }
        }

        // 10. Playback HUD Logic Drivers Interface Functions
        function triggerCanvasPlayback() {
            if(videoTrackObjectReference.paused) {
                videoTrackObjectReference.play();
                document.getElementById('hud-play-trigger').innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                videoTrackObjectReference.pause();
                document.getElementById('hud-play-trigger').innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        }

        function resetCanvasPlayback() {
            videoTrackObjectReference.currentTime = 0;
            if(videoTrackObjectReference.paused) {
                document.getElementById('hud-play-trigger').innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        }

        function toggleCanvasViewportFullscreen() {
            let containerWorkspaceFrame = document.getElementById('studio-viewport-frame');
            if (!document.fullscreenElement) {
                containerWorkspaceFrame.requestFullscreen().catch(err => {
                    alert(`Fullscreen Error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function updateTrackPlaybackHUDTimeCounters() {
            setInterval(() => {
                let currentTimestamp = formatSecondsToTimeStrings(videoTrackObjectReference.currentTime || 0);
                let durationTimestamp = formatSecondsToTimeStrings(videoTrackObjectReference.duration || 0);
                document.getElementById('hud-time-display').innerText = `${currentTimestamp} / ${durationTimestamp}`;
            }, 300);
        }

        function formatSecondsToTimeStrings(totalSecondsValue) {
            let CalculatedMinutes = Math.floor(totalSecondsValue / 60);
            let CalculatedSeconds = Math.floor(totalSecondsValue % 60);
            if (CalculatedMinutes < 10) CalculatedMinutes = "0" + CalculatedMinutes;
            if (CalculatedSeconds < 10) CalculatedSeconds = "0" + CalculatedSeconds;
            return CalculatedMinutes + ":" + CalculatedSeconds;
        }

        // 11. Final client Side High Performance Video Rendering & Export Engine Solution
        function executeStudioVideoExport() {
            // Check if active source video file exists inside pipeline track element
            if (!videoTrackObjectReference.src) {
                alert("پہلے کوئی ویڈیو امپورٹ کریں تاکہ اسے ایکسپورٹ کیا جا سکے۔");
                return;
            }

            let exportResolutionPreset = document.getElementById('render-resolution-preset').value;
            
            // UX Visual loading alert notifications sequence initialization
            const exportButtonNode = document.querySelector('.export-btn');
            const primaryBackupText = exportButtonNode.innerHTML;
            exportButtonNode.disabled = true;
            exportButtonNode.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> RENDERING...';

            // High compatibility timeout process fallback rendering emulator loop
            setTimeout(() => {
                try {
                    // Create standalone background render pipeline sandbox canvas reference structure
                    const exportProcessorCanvas = document.createElement('canvas');
                    const canvasRenderContext2D = exportProcessorCanvas.getContext('2d');

                    // Standard target resolutions scaling calculation maps rules
                    let targetWidth = 1920, targetHeight = 1080;
                    if(exportResolutionPreset === '720p') { targetWidth = 1280; targetHeight = 720; }
                    if(exportResolutionPreset === '4k') { targetWidth = 3840; targetHeight = 2160; }

                    exportProcessorCanvas.width = targetWidth;
                    exportProcessorCanvas.height = targetHeight;

                    // Rasterization composition execution: Draw current scene viewport frame matrices base layer
                    canvasRenderContext2D.drawImage(videoTrackObjectReference, 0, 0, targetWidth, targetHeight);

                    // Compute responsive relative scale offsets parameters for typography graphics layers overlay text
                    let layoutScaleRatioFactor = targetWidth / videoTrackObjectReference.videoWidth;
                    if(isNaN(layoutScaleRatioFactor) || !isFinite(layoutScaleRatioFactor)) layoutScaleRatioFactor = 1;

                    // Compute computed CSS active style values references directly from live DOM layers node
                    let activeLayerStyleDOMData = window.getComputedStyle(textOverlayLayerContainer);
                    
                    canvasRenderContext2D.font = `${activeLayerStyleDOMData.fontWeight} ${parseInt(activeLayerStyleDOMData.fontSize) * layoutScaleRatioFactor * 1.5}px ${activeLayerStyleDOMData.fontFamily}`;
                    canvasRenderContext2D.fillStyle = activeLayerStyleDOMData.color;
                    canvasRenderContext2D.textAlign = "center";
                    canvasRenderContext2D.textBaseline = "middle";
                    canvasRenderContext2D.globalAlpha = parseFloat(activeLayerStyleDOMData.opacity);
                    
                    // Inject Text Overlay drop shadow matching dynamic viewport settings
                    canvasRenderContext2D.shadowColor = "rgba(0, 0, 0, 0.8)";
                    canvasRenderContext2D.shadowBlur = 8;
                    canvasRenderContext2D.shadowOffsetX = 4;
                    canvasRenderContext2D.shadowOffsetY = 4;

                    // Composite final graphics overlay onto rendering stream pipeline surface
                    canvasRenderContext2D.fillText(textOverlayLayerContainer.innerText, targetWidth / 2, targetHeight / 2);

                    // Conversion routine sequence mapping base64 raw string down data matrix blocks directly
                    let processedDataBlobURL = exportProcessorCanvas.toDataURL("image/png");
                    
                    // Hardware downstream abstraction system anchor execution module
                    let hardwareDownstreamAnchorLink = document.createElement('a');
                    hardwareDownstreamAnchorLink.download = `Dravoo_Project_Render_${exportResolutionPreset}.png`;
                    hardwareDownstreamAnchorLink.href = processedDataBlobURL;
                    document.body.appendChild(hardwareDownstreamAnchorLink);
                    hardwareDownstreamAnchorLink.click();
                    document.body.removeChild(hardwareDownstreamAnchorLink);

                    // UI restoration routine actions on rendering process validation termination
                    exportButtonNode.disabled = false;
                    exportButtonNode.innerHTML = primaryBackupText;
                    alert("ویڈیو فریم کامیابی کے ساتھ ایکسپورٹ ہو گیا ہے!");

                } catch (renderingPipelineException) {
                    console.error("Export System Exception Error: ", renderingPipelineException);
                    exportButtonNode.disabled = false;
                    exportButtonNode.innerHTML = primaryBackupText;
                    alert("ایکسپورٹ کے دوران خرابی: براہ کرم یقینی بنائیں کہ آپ نے درست فائل لوڈ کی ہے۔");
                }
            }, 2500); // Realistic rendering simulation delay
        }

        // Program Initializing System Run Functions Hook
        window.onload = function() {
            initializeExtendedTemplatesDatabase();
            initializeExtendedFontsDatabase();
            initializeExtendedAnimationsDatabase();
            initializeColorStylesPaletteMatrix();
            updateTrackPlaybackHUDTimeCounters();
        };
    </script>
