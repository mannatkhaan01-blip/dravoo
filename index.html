<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio Pipeline</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .hidden { display: none; }
        .opacity-0 { opacity: 0; }
        .transition-opacity { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-md w-full bg-gray-800 p-6 rounded-2xl shadow-xl space-y-4">
        <h2 class="text-xl font-bold text-center text-blue-400">AI Image Generation Pipeline</h2>
        
        <textarea id="ai-prompt-banana" rows="3" class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:border-blue-500 text-white" placeholder="Enter your prompt here..."></textarea>
        
        <button id="ai-btn-banana" onclick="generateAIStudioImage()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 disabled:opacity-50">
            Generate Art
        </button>

        <!-- Result Container -->
        <div id="ai-result-banana" class="hidden border border-gray-700 rounded-xl p-4 bg-gray-850 flex flex-col items-center justify-center min-h-[300px] relative">
            
            <!-- Loader -->
            <div id="ai-loader-banana" class="flex flex-col items-center space-y-3">
                <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-500"></div>
                <p id="loader-status-text" class="text-sm text-gray-400 animate-pulse">Initializing pipeline...</p>
            </div>

            <!-- Output Image -->
            <img id="ai-img-src-banana" class="w-full h-auto rounded-lg shadow-md opacity-0 transition-opacity" alt="AI Generated Artwork">
        </div>
    </div>

    <script>
        // SECURE WARNING: Replace these placeholders with your active keys securely!
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE";
        const HF_TOKEN = "YOUR_HUGGINGFACE_TOKEN_HERE";

        // ================= STEP 1: GEMINI PROMPT EXPANSION =================
        async function improvePrompt(rawPrompt) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `Expand this image prompt into a highly detailed, cinematic description for Stable Diffusion. Do not include introductory text, just output the final expanded prompt: "${rawPrompt}"` }]
                        }]
                    })
                });

                if (!response.ok) throw new Error("Gemini API call failed");
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (err) {
                console.warn("Gemini expansion failed, using raw prompt as fallback.", err);
                return rawPrompt; // Fallback to original prompt if Gemini fails
            }
        }

        // ================= STEP 2: HUGGING FACE IMAGE GENERATION =================
        async function queryHF(expandedPrompt) {
            const response = await fetch("https://api-inference.huggingface.co/models/runwayml/stable-diffusion-v1-5", {
                headers: { Authorization: `Bearer ${HF_TOKEN}`, "Content-Type": "application/json" },
                method: "POST",
                body: JSON.stringify({ inputs: expandedPrompt }),
            });

            if (!response.ok) throw new Error("Hugging Face API rendering failed");
            const resultBlob = await response.blob();
            return URL.createObjectURL(resultBlob);
        }

        // ================= STEP 3: MAIN PIPELINE CONTROL =================
        async function generateAIStudioImage() {
            const promptInput = document.getElementById('ai-prompt-banana');
            const genBtn = document.getElementById('ai-btn-banana');
            const resultDiv = document.getElementById('ai-result-banana');
            const resultImg = document.getElementById('ai-img-src-banana');
            const loaderDiv = document.getElementById('ai-loader-banana');
            const loaderStatus = document.getElementById('loader-status-text');

            if (!promptInput || !genBtn) return;
            const promptText = promptInput.value.trim();
            if (!promptText) return alert("Please enter a creative prompt first!");

            // Setup UI states
            genBtn.innerText = "ENGINES WORKING...";
            genBtn.disabled = true;
            resultDiv.classList.remove('hidden');
            loaderDiv.classList.remove('hidden');
            resultImg.classList.add('opacity-0');

            try {
                // Step 1: Improve prompt via Gemini
                loaderStatus.innerText = "Gemini expanding prompt...";
                const enhancedPrompt = await improvePrompt(promptText);
                console.log("Enhanced Prompt:", enhancedPrompt);

                // Step 2: Generate Image via HuggingFace
                loaderStatus.innerText = "HuggingFace structural rendering...";
                const generatedImgUrl = await queryHF(enhancedPrompt);

                // Step 3: Render on target component
                resultImg.src = generatedImgUrl;
                resultImg.onload = function() {
                    loaderDiv.classList.add('hidden');
                    resultImg.classList.remove('opacity-0');
                    genBtn.innerText = "Generate Art";
                    genBtn.disabled = false;
                };

            } catch (error) {
                console.error("Pipeline Breakdown:", error);
                alert("Generation failed. Please check the console or verify your network connection.");
                
                // Graceful UI Reset on Failure
                loaderDiv.classList.add('hidden');
                resultDiv.classList.add('hidden');
                genBtn.innerText = "Generate Art";
                genBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
