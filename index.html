<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dravoo Video Editor Component</title>
    <!-- Google Fonts for Typography Links -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bungee&family=Italianno&family=Larken&family=Montra&family=Oswald&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #121214;
            --panel-dark: #1e1e22;
            --accent-color: #25c5a2;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            font-family: 'Rubik', sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Video Preview Area */
        .preview-container {
            width: 100%;
            max-width: 450px;
            height: 50%;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .video-placeholder {
            width: 90%;
            height: 80%;
            border: 1px dashed #444;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #1a1a1a;
        }

        /* Dynamic Canvas Elements */
        #canvas-text-layer {
            position: absolute;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            cursor: move;
            user-select: none;
            padding: 5px;
            border: 1px transparent dashed;
        }

        #canvas-text-layer.active {
            border-color: var(--accent-color);
        }

        #canvas-sticker-layer {
            position: absolute;
            font-size: 50px;
            cursor: move;
            user-select: none;
        }

        /* Toolbar Control Bottom */
        .main-toolbar {
            width: 100%;
            max-width: 450px;
            background: var(--panel-dark);
            padding: 15px 0;
            display: flex;
            justify-content: space-around;
            position: absolute;
            bottom: 0;
            border-top: 1px solid #2d2d34;
            z-index: 5;
        }

        .tool-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .tool-btn:hover, .tool-btn.active {
            color: var(--text-main);
        }

        .tool-btn svg {
            width: 24px;
            height: 24px;
            margin-bottom: 5px;
            fill: currentColor;
        }

        /* Advanced Professional Editor Drawer */
        .editor-drawer {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 450px;
            height: 55%;
            background: var(--panel-dark);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            transition: bottom 0.3s ease-out;
            z-index: 10;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.7);
        }

        .editor-drawer.open {
            bottom: 0;
        }

        /* Drawer Header Controls */
        .drawer-header {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #2d2d34;
        }

        .close-drawer {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .input-box-wrapper {
            flex-grow: 1;
            margin: 0 15px;
            position: relative;
        }

        .text-input-field {
            width: 100%;
            background: #2d2d34;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }

        .apply-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 20px;
            cursor: pointer;
        }

        /* Custom Modern Tabs */
        .drawer-tabs {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 5px 10px;
            border-bottom: 1px solid #2d2d34;
        }

        .drawer-tabs::-webkit-scrollbar { display: none; }

        .tab-link {
            padding: 8px 16px;
            color: var(--text-muted);
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .tab-link.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--accent-color);
        }

        /* Dynamic Grid Content Items */
        .tab-content-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .content-panel {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .content-panel.active {
            display: grid;
        }

        /* Asset Grid Cards */
        .asset-card {
            background: #2d2d34;
            border-radius: 8px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
            padding: 5px;
            user-select: none;
            transition: transform 0.1s;
            border: 1px solid transparent;
        }

        .asset-card:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
        }

        /* Style Controls Layout */
        #styles-panel {
            grid-template-columns: 1fr;
        }
        
        .style-row {
            margin-bottom: 15px;
        }

        .style-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .color-palette {
            display: flex;
            gap: 10px;
        }

        .color-dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-dot.active { border-color: #fff; }
    </style>
</head>
<body>

    <!-- Video Canvas Frame -->
    <div class="preview-container">
        <div class="video-placeholder" id="video-frame">
            <div id="canvas-text-layer">Dravoo Layer</div>
            <div id="canvas-sticker-layer"></div>
        </div>
    </div>

    <!-- Bottom Navigation Bar Menu -->
    <div class="main-toolbar">
        <button class="tool-btn" onclick="openEditorDrawer('templates')">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            Text template
        </button>
        <button class="tool-btn" id="add-text-trigger">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Add text
        </button>
        <button class="tool-btn" onclick="openEditorDrawer('stickers')">
            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5s.67 1.5 1.5 1.5zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
            Stickers
        </button>
    </div>

    <!-- Advanced Video Customization Drawer -->
    <div class="editor-drawer" id="editorDrawer">
        <div class="drawer-header">
            <button class="close-drawer" id="closeDrawerBtn">✕</button>
            <div class="input-box-wrapper">
                <input type="text" id="liveTextInput" class="text-input-field" placeholder="Enter text here...">
            </div>
            <button class="apply-btn" id="applyTextBtn">✓</button>
        </div>

        <!-- Navigation Tabs Matrix -->
        <div class="drawer-tabs">
            <button class="tab-link active" onclick="switchPanel('templates')">Templates</button>
            <button class="tab-link" onclick="switchPanel('fonts')">Fonts</button>
            <button class="tab-link" onclick="switchPanel('styles')">Styles</button>
            <button class="tab-link" onclick="switchPanel('effects')">Effects</button>
            <button class="tab-link" onclick="switchPanel('stickers')">Stickers</button>
        </div>

        <!-- Scrollable Dynamic Panels Context -->
        <div class="tab-content-container">
            
            <!-- 20 Working Premium Templates Panel -->
            <div class="content-panel active" id="templates-panel">
                <!-- Javascript will loop and populate 20 templates here seamlessly -->
            </div>

            <!-- Dynamic Typography Fonts Panel -->
            <div class="content-panel" id="fonts-panel">
                <div class="asset-card" style="font-family: 'Rubik';" onclick="applyFont('Rubik')">Rubik</div>
                <div class="asset-card" style="font-family: 'Bangers';" onclick="applyFont('Bangers')">Bangers</div>
                <div class="asset-card" style="font-family: 'Bungee';" onclick="applyFont('Bungee')">Bungee</div>
                <div class="asset-card" style="font-family: 'Italianno';" onclick="applyFont('Italianno')">Italianno</div>
                <div class="asset-card" style="font-family: 'Oswald';" onclick="applyFont('Oswald')">Oswald</div>
                <div class="asset-card" style="font-family: 'Larken';" onclick="applyFont('Larken')">Larken</div>
                <div class="asset-card" style="font-family: 'Montra';" onclick="applyFont('Montra')">Montra</div>
            </div>

            <!-- Realtime Workspace Styles Panel -->
            <div class="content-panel" id="styles-panel">
                <div class="style-row">
                    <div class="style-label">Text Color</div>
                    <div class="color-palette">
                        <div class="color-dot" style="background: #ffffff;" onclick="applyColor('#ffffff')"></div>
                        <div class="color-dot" style="background: #ff3b30;" onclick="applyColor('#ff3b30')"></div>
                        <div class="color-dot" style="background: #ffcc00;" onclick="applyColor('#ffcc00')"></div>
                        <div class="color-dot" style="background: #4cd964;" onclick="applyColor('#4cd964')"></div>
                        <div class="color-dot" style="background: #007aff;" onclick="applyColor('#007aff')"></div>
                    </div>
                </div>
                <div class="style-row">
                    <div class="style-label">Font Size</div>
                    <input type="range" min="16" max="60" value="24" style="width:100%; accent-color: var(--accent-color);" oninput="applySize(this.value)">
                </div>
            </div>

            <!-- Kinetic Styling FX Effects Panel -->
            <div class="content-panel" id="effects-panel">
                <div class="asset-card" style="text-shadow: 2px 2px 4px #000;" onclick="applyEffect('shadow')">Glow Shadow</div>
                <div class="asset-card" style="background: #fff; color: #000; font-weight: bold;" onclick="applyEffect('invert')">Invert UI</div>
                <div class="asset-card" style="letter-spacing: 6px;" onclick="applyEffect('spacing')">Spaced Out</div>
                <div class="asset-card" style="border: 2px solid var(--accent-color);" onclick="applyEffect('border')">Stroke Outline</div>
            </div>

            <!-- Visual Stickers Collection Panel (Ref Image 3) -->
            <div class="content-panel" id="stickers-panel">
                <div class="asset-card" style="font-size:30px;" onclick="applySticker('🔥')">🔥</div>
                <div class="asset-card" style="font-size:30px;" onclick="applySticker('✨')">✨</div>
                <div class="asset-card" style="font-size:30px;" onclick="applySticker('🎯')">🎯</div>
                <div class="asset-card" style="font-size:30px;" onclick="applySticker('❤️')">❤️</div>
                <div class="asset-card" style="font-size:30px;" onclick="applySticker('👑')">👑</div>
                <div class="asset-card" style="font-size:30px;" onclick="applySticker('🚀')">🚀</div>
                <div class="asset-card" style="font-size:30px;" onclick="applySticker('⭐')">⭐</div>
                <div class="asset-card" style="font-size:30px;" onclick="applySticker('💥')">💥</div>
            </div>

        </div>
    </div>

    <script>
        // DOM Handles Identification
        const drawer = document.getElementById('editorDrawer');
        const textLayer = document.getElementById('canvas-text-layer');
        const stickerLayer = document.getElementById('canvas-sticker-layer');
        const liveInput = document.getElementById('liveTextInput');
        const addTextTrigger = document.getElementById('add-text-trigger');
        const closeDrawerBtn = document.getElementById('closeDrawerBtn');
        const applyTextBtn = document.getElementById('applyTextBtn');
        const templatesPanel = document.getElementById('templates-panel');

        // Generate Exactly 20 Professional Rich Text Templates
        const mockTemplates = [
            { name: "ABC Smart", style: "font-family:'Bangers'; color:#ffcc00; text-shadow:2px 2px 0px #000;" },
            { name: "Let's Go", style: "font-family:'Bungee'; color:#ff3b30; font-style:italic;" },
            { name: "Vlog Day", style: "font-family:'Italianno'; color:#fff; font-size:32px;" },
            { name: "Minimalist", style: "font-family:'Rubik'; letter-spacing:4px; font-weight:300;" },
            { name: "Cyber Neon", style: "font-family:'Oswald'; color:#00f3ff; text-shadow:0 0 8px #00f3ff;" },
            { name: "Retro Wave", style: "font-family:'Bangers'; color:#ff007f; text-shadow:2px 2px #3f007f;" },
            { name: "Golden Hour", style: "font-family:'Larken'; color:#d4af37; font-weight:bold;" },
            { name: "Bold Impact", style: "font-family:'Bungee'; background:#fff; color:#000; padding:2px 6px;" },
            { name: "Modern Clean", style: "font-family:'Rubik'; font-weight:700; color:#4cd964;" },
            { name: "Spooky Night", style: "font-family:'Montra'; color:#a832a4; text-shadow:1px 1px 5px #000;" },
            { name: "Sub 2 Channel", style: "font-family:'Oswald'; color:#fff; background:#ff0000; padding:4px;" },
            { name: "Thanks Watching", style: "font-family:'Italianno'; color:#ffcc00; font-size:36px;" },
            { name: "Gaming Ultra", style: "font-family:'Bungee'; color:#00ffcc; text-shadow: 3px 3px #000;" },
            { name: "Daily Drift", style: "font-family:'Larken'; font-style:italic; color:#e0e0e0;" },
            { name: "Stream Live", style: "font-family:'Oswald'; border: 2px solid #fff; padding: 2px;" },
            { name: "Aesthetic", style: "font-family:'Italianno'; color:#ffb6c1;" },
            { name: "Comic Pop", style: "font-family:'Bangers'; color:#ffff00; -webkit-text-stroke:1px black;" },
            { name: "Tech Vibe", style: "font-family:'Bungee'; color:#8e8e93;" },
            { name: "Urban City", style: "font-family:'Oswald'; font-weight:900; text-transform:uppercase;" },
            { name: "Dravoo Sign", style: "font-family:'Montra'; color:#25c5a2; font-weight:bold;" }
        ];

        // Hydrate Template UI Container Loop
        mockTemplates.forEach((tpl, idx) => {
            const card = document.createElement('div');
            card.className = 'asset-card';
            card.innerText = tpl.name;
            card.setAttribute('style', tpl.style + "cursor:pointer;");
            card.onclick = () => {
                textLayer.style.cssText = tpl.style;
                textLayer.innerText = tpl.name;
                liveInput.value = tpl.name;
            };
            templatesPanel.appendChild(card);
        });

        // Open Drawer Engine
        function openEditorDrawer(targetTab) {
            drawer.classList.add('open');
            switchPanel(targetTab);
            liveInput.value = textLayer.innerText;
        }

        // Switch Tabs Layout UI Function
        function switchPanel(tabName) {
            document.querySelectorAll('.tab-link').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-panel').forEach(panel => panel.classList.remove('active'));
            
            const targetBtn = Array.from(document.querySelectorAll('.tab-link')).find(btn => btn.innerText.toLowerCase() === tabName.toLowerCase());
            if(targetBtn) targetBtn.classList.add('active');
            
            const targetPanel = document.getElementById(`${tabName}-panel`);
            if(targetPanel) targetPanel.classList.add('active');
        }

        // Action Core Modifiers
        addTextTrigger.onclick = () => openEditorDrawer('fonts');
        closeDrawerBtn.onclick = () => drawer.classList.remove('open');
        applyTextBtn.onclick = () => drawer.classList.remove('open');

        liveInput.oninput = (e) => {
            textLayer.innerText = e.target.value || "Dravoo Layer";
        };

        // Customization Functions Realtime Execution
        function applyFont(fontName) { textLayer.style.fontFamily = fontName; }
        function applyColor(colorHex) { textLayer.style.color = colorHex; }
        function applySize(sizePx) { textLayer.style.fontSize = `${sizePx}px`; }
        function applySticker(emoji) { stickerLayer.innerText = emoji; }
        
        function applyEffect(fx) {
            textLayer.style.textShadow = fx === 'shadow' ? '3px 3px 6px #000' : 'none';
            textLayer.style.color = fx === 'invert' ? '#000000' : '#ffffff';
            textLayer.style.backgroundColor = fx === 'invert' ? '#ffffff' : 'transparent';
            textLayer.style.letterSpacing = fx === 'spacing' ? '8px' : 'normal';
            textLayer.style.webkitTextStroke = fx === 'border' ? '1px #25c5a2' : 'unset';
        }

        // Drag and Drop Architecture Layer Engine
        function makeElementDraggable(elm) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elm.onmousedown = dragMouseDown;
            elm.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                if(e.type === 'touchstart') {
                    pos3 = e.touches[0].clientX;
                    pos4 = e.touches[0].clientY;
                } else {
                    pos3 = e.clientX;
                    pos4 = e.clientY;
                }
                document.onmouseup = closeDragElement;
                document.ontouchend = closeDragElement;
                document.onmousemove = elementDrag;
                document.ontouchmove = elementDrag;
                elm.classList.add('active');
            }

            function elementDrag(e) {
                e = e || window.event;
                let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
                
                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;
                
                elm.style.top = (elm.offsetTop - pos2) + "px";
                elm.style.left = (elm.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;
                elm.classList.remove('active');
            }
        }

        makeElementDraggable(textLayer);
        makeElementDraggable(stickerLayer);
    </script>
</body>
</html>
