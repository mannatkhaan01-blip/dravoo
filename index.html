<!DOCTYPE html>
<html lang="en">
<head>
<style>
  /* ... (Aapke existing styles yahan rahenge, maine sirf neeche wala fix kiya hai) ... */
  /* نیا شامل کیا گیا باکس ڈیزائن */
  .dravoo-box {
    text-align: center;
    margin: 40px auto;
    max-width: 550px;
    padding: 30px;
    border: 2px dashed #0070f3;
    border-radius: 15px;
    background-color: #f9f9f9;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #333;
  }
  .dravoo-btn {
    padding: 12px 25px;
    background-color: #0070f3;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    transition: 0.3s;
  }
  .dravoo-btn:hover {
    background-color: #0051b3;
  }
  .dravoo-btn:disabled {
    background-color: #ccc;
    cursor: not-allowed;
  }
  .preview-img {
    max-width: 100%;
    max-height: 350px;
    border-radius: 8px;
    margin-top: 15px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
</style>
  <!-- ... (Aapke existing meta tags yahan hain) ... -->
</head>
<body>
    <!-- ... (Aapka Existing Navbar aur saara UI yahan hai) ... -->

    <!-- 🆕 FIXED ANIMAL STUDIO MODAL STARTS HERE -->
    <div id="animalModal" class="modal-overlay">
        <div class="content-card text-center">
            <h3 class="text-lg font-black mb-4 uppercase text-pink-500"><i class="fas fa-paw mr-1"></i> Convert to Animal (Fixed)</h3>
            <div class="relative w-full aspect-square bg-black rounded-xl overflow-hidden mb-4 flex items-center justify-center border border-zinc-800">
                <!-- Canvas jo final image render karega -->
                <canvas id="animal-canvas" class="hidden max-w-full max-h-full"></canvas>
                <!-- User ki uploaded image yahan dikhegi -->
                <img id="animal-preview-img" class="max-w-full max-h-full object-contain hidden">
                <div id="animal-placeholder-text" class="text-gray-600 text-xs uppercase tracking-widest font-bold">Upload Face Image</div>
            </div>
            
            <div class="space-y-3 text-left">
                <button onclick="document.getElementById('animal-image-picker').click()" class="w-full bg-pink-500/10 border border-pink-500/30 py-2.5 rounded-xl text-xs uppercase font-bold text-pink-400 hover:bg-pink-500/20 transition"><i class="fas fa-image mr-2"></i>Upload Face Image</button>
            </div>
            
            <div class="flex gap-3 mt-6">
                <button onclick="closeAnimalStudio()" class="w-1/3 py-3 bg-zinc-800 rounded-xl font-bold uppercase text-[10px] hover:bg-zinc-700 transition">Cancel</button>
                <button id="download-animal-btn" class="w-2/3 py-3 cap-gradient rounded-xl font-bold uppercase text-[10px]" disabled>Convert & Download</button>
            </div>
        </div>
    </div>
    <!-- 🆕 FIXED ANIMAL STUDIO MODAL ENDS HERE -->

    <!-- ... (Aapka baaki footer aur UI yahan hai) ... -->

    <script>
        // ... (Aapke existing functions yahan hain: scrollToSection, etc.) ...

        // ================================================================
        // 🚀 FIXED ANIMAL STUDIO LOGIC (Replace your old script with this)
        // ================================================================
        const animalModal = document.getElementById('animalModal');
        const animalImgPicker = document.getElementById('animal-image-picker');
        const animalPreviewImg = document.getElementById('animal-preview-img');
        const animalPlaceholderText = document.getElementById('animal-placeholder-text');
        const animalCanvas = document.getElementById('animal-canvas');
        const downloadAnimalBtn = document.getElementById('download-animal-btn');

        // High-quality animal face images to blend (Pre-cropped faces for better results)
        const animalFaceUrls = [
            "https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=400&auto=format&fit=crop", // Lion
            "https://images.unsplash.com/photo-1589656966895-2f33e7653819?w=400&auto=format&fit=crop", // Tiger
            "https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?w=400&auto=format&fit=crop", // Panda
            "https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=400&auto=format&fit=crop"  // Cat
        ];

        function openAnimalStudio() { 
            animalModal.style.display = 'flex'; 
            // Reset UI state
            animalPreviewImg.classList.add('hidden');
            animalCanvas.classList.add('hidden');
            animalPlaceholderText.classList.remove('hidden');
            downloadAnimalBtn.disabled = true;
        }

        function closeAnimalStudio() { 
            animalModal.style.display = 'none'; 
        }

        // When user uploads image
        animalImgPicker.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    animalPreviewImg.src = event.target.result;
                    animalPreviewImg.classList.remove('hidden');
                    animalCanvas.classList.add('hidden');
                    animalPlaceholderText.classList.add('hidden');
                    downloadAnimalBtn.disabled = false; // Enable button
                }
                reader.readAsDataURL(file);
            }
        });

        // FIXED: Convert & Download Logic (Soft Blending instead of Paste)
        downloadAnimalBtn.addEventListener('click', () => {
            const ctx = animalCanvas.getContext('2d');
            
            // 1. Set Canvas to image dimensions
            const width = animalPreviewImg.naturalWidth || 500;
            const height = animalPreviewImg.naturalHeight || 500;
            animalCanvas.width = width;
            animalCanvas.height = height;
            animalCanvas.classList.remove('hidden');

            // 2. Draw the User's original face as background
            ctx.drawImage(animalPreviewImg, 0, 0, width, height);

            // 3. Load a Random Animal Face
            const randomAnimal = new Image();
            randomAnimal.crossOrigin = "anonymous";
            randomAnimal.src = animalFaceUrls[Math.floor(Math.random() * animalFaceUrls.length)];

            randomAnimal.onload = function() {
                // Calculate size of animal face (approx 60% of canvas size)
                const faceSize = Math.min(width, height) * 0.6;
                const centerX = (width - faceSize) / 2;
                const centerY = (height - faceSize) / 2.5; // Slightly up for a face

                // 🚀 FIX: Draw using "Destination-in" composition to get a circular mask
                // First, Save the current drawing state
                ctx.save();
                
                // Create a circular clip path (Soft rounded edges)
                ctx.beginPath();
                // Using slightly rounded rectangle for a face shape instead of hard circle
                const radius = 20; // rounded corner radius
                ctx.moveTo(centerX + radius, centerY);
                ctx.lineTo(centerX + faceSize - radius, centerY);
                ctx.quadraticCurveTo(centerX + faceSize, centerY, centerX + faceSize, centerY + radius);
                ctx.lineTo(centerX + faceSize, centerY + faceSize - radius);
                ctx.quadraticCurveTo(centerX + faceSize, centerY + faceSize, centerX + faceSize - radius, centerY + faceSize);
                ctx.lineTo(centerX + radius, centerY + faceSize);
                ctx.quadraticCurveTo(centerX, centerY + faceSize, centerX, centerY + faceSize - radius);
                ctx.lineTo(centerX, centerY + radius);
                ctx.quadraticCurveTo(centerX, centerY, centerX + radius, centerY);
                ctx.closePath();
                
                ctx.clip(); // Clip the canvas to this rounded shape

                // Draw the animal face INSIDE the clip
                ctx.drawImage(randomAnimal, centerX, centerY, faceSize, faceSize);

                // Restore the context (remove the clip)
                ctx.restore();

                // Hide user image, show canvas, and download
                animalPreviewImg.classList.add('hidden');
                
                const link = document.createElement('a');
                link.download = 'dravoo-animal-face-fixed.png';
                link.href = animalCanvas.toDataURL('image/png');
                link.click();
            };
        });
        // ================================================================

        // ... (Aapke baaki existing scripts yahan chalein) ...
    </script>
</body>
</html>
